syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets) is said on the package in access.proto.
package nopacs.v1;

import "google/protobuf/timestamp.proto";
import "nopacs/v1/scope.proto";

// AuditService reads the audit logs. Every request to the API writes one entry,
// refused requests included, in one of two kinds of log: the installation's,
// or a tenant's.
//
// A refused request (answered UNAUTHENTICATED or PERMISSION_DENIED) is always
// written to the installation's log, with the tenant's name when the request
// named one: a caller who was refused causes no write in a tenant's database,
// and keys and grants are the installation's. A request that was allowed is
// written to the log of what it concerns: a tenant's log for a request about
// a tenant, the installation's log for one about the installation. When the
// tenant's database does not answer, the entry is written to the installation's
// log instead, with the tenant's name and a detail saying the tenant's log did
// not answer; so is the entry of a request that names a tenant that does not
// exist. Where a method's comment names a tenant's log, it means the entry of
// the request when it was allowed.
//
// The entry of a change is written together with the change, or the change is
// not made. The entry of a refusal or of a read is written shortly after the
// answer, in a batch: a server overwhelmed by requests drops such entries and
// writes to the installation's log how many it dropped, and a server that is
// killed may lose those of its last moment.
//
// No entry holds a key's secret, a database's address or a setting's value.
//
// Entries the server makes itself. Some changes are made by the server, not
// by a request: a naming key made, a forward job, a sealing pass, a purge
// at the end of its grace period, a correction abandoned at start. Their
// entries have local_user_id "server", no key id and no client address;
// their method names what the server did, as "server/<action>" (such as
// "server/purge" or "server/seal"), never an API method; and their
// request_id is the id the server made for that piece of work, which its
// log lines carry too.
service AuditService {
  // ListAuditEntries answers the entries of the installation's log or of one
  // tenant's log, newest first, filtered by key, by outcome and by time.
  //
  // Role: admin on the scope asked for.
  // Audit: one entry in the log of the scope asked for, with the filters in
  // details; the listing records itself, so reading the log is in the log.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the database of the scope does not answer, or the
  // tenant is not ready).
  rpc ListAuditEntries(ListAuditEntriesRequest) returns (ListAuditEntriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// AuditOutcome is how a request ended.
enum AuditOutcome {
  // Never written by the server. As a filter, it means every outcome.
  AUDIT_OUTCOME_UNSPECIFIED = 0;

  // The request did what it asked.
  AUDIT_OUTCOME_DONE = 1;

  // The caller may not do this: the request was answered UNAUTHENTICATED or
  // PERMISSION_DENIED, and did nothing.
  AUDIT_OUTCOME_REFUSED = 2;

  // The caller was allowed and the request did not complete: it was invalid,
  // named something that does not exist, collided with what exists, found a
  // tenant's database or the master database not answering, ran out of time,
  // or met a fault of the server. The entry's reason says which.
  AUDIT_OUTCOME_FAILED = 3;
}

// AuditEntry records one request: when, who, from where, what, and how it
// ended.
message AuditEntry {
  // The entry's id, unique within its log.
  string id = 1;

  // When the request was received.
  google.protobuf.Timestamp time = 2;

  // The id of the key the request carried, read from the key even when the
  // key was refused. Empty when the request carried no key or none could be
  // read, and for the local operator.
  string key_id = 3;

  // The operating system's id of the local operator, for a request on the
  // local socket; "server" for an entry the server made itself (the
  // service's comment says which). Empty for a request over the network.
  string local_user_id = 4;

  // The network address and port the request came from. Empty for a request
  // on the local socket.
  string client_address = 5;

  // The full name of the method called, such as
  // "/nopacs.v1.TenantService/CreateTenant"; for an entry the server made
  // itself, "server/<action>".
  string method = 6;

  // The name of the tenant as the request gave it. Kept after the tenant is
  // removed, and present also when no tenant had that name. Empty when the
  // request named none.
  string tenant = 7;

  // What the request acted on, such as a key's id or a setting's name. Empty
  // when it acted on no one thing.
  string object = 8;

  // How the request ended.
  AuditOutcome outcome = 9;

  // The id the server made for the request: the same as in the response
  // header Nopacs-Request-Id and in the server's log, so an entry, the
  // answer and the log lines of one request can be found from each other.
  // For an entry the server made itself, the id of that piece of work.
  string request_id = 10;

  // What each method's comment says it records, beside the object: a
  // database type, a scope, a previous and a new role, the filters of a
  // listing. Keys are short lowercase words. Values are never a secret and
  // never a setting's value: a setting's value is not recorded.
  map<string, string> details = 11;

  // The real cause of a refusal or a failure, in words for the admin who
  // reads the log, such as "key expired" or "tenant database does not
  // answer". It is never shown to the caller that was refused, whose answer
  // stays the same whatever the cause. Empty when the outcome is done. Never
  // holds a secret.
  string reason = 12;
}

// ListAuditEntriesRequest asks for a page of one log.
message ListAuditEntriesRequest {
  // The log to read: one tenant's, or the installation's. Required.
  Scope scope = 1;

  // Only the entries of requests that carried this key. Empty for every
  // caller.
  string key_id = 2;

  // Only the entries with this outcome. AUDIT_OUTCOME_UNSPECIFIED for every
  // outcome.
  AuditOutcome outcome = 3;

  // Only the entries at or after this time. Absent for no lower bound.
  google.protobuf.Timestamp start_time = 4;

  // Only the entries before this time. Absent for no upper bound. Must be
  // after start_time when both are set.
  google.protobuf.Timestamp end_time = 5;

  // The most entries to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 6;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a scope or filters other
  // than those it was made with.
  string page_token = 7;
}

// ListAuditEntriesResponse is a page of entries.
message ListAuditEntriesResponse {
  // The entries of this page, newest first.
  repeated AuditEntry entries = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}
