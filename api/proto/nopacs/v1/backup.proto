syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets) is said on the package in access.proto.
package nopacs.v1;

import "google/protobuf/timestamp.proto";

// BackupService copies out what the archive cannot make again from its
// storages, and hands a tenant to another installation.
//
// What a backup holds: the installation's keys, grants and settings, each
// tenant's configuration (storages, receivers, senders, profiles and
// lookup tables), its sealed secrets, its audit log with its checkpoints,
// its events and its work (receptions, quarantine records, jobs,
// corrections). The catalog is never in a backup or an export: a restore
// and an import always rebuild it from the storages (RebuildJob), so a
// catalog can never be older than the bytes it points at.
//
// What a backup is. A logical copy, the same whatever the database: a
// header (the format, the installation's id, each database's schema
// version, the time), then a section per database, each the rows of its
// tables read in one read transaction with its recovery point (the moment
// it stands for: BackupSection), then a footer with each section's
// SHA-256. It restores into either database type. The whole file is
// encrypted as it is written, in chunks of 64 KiB with AES-256-GCM (NIST
// SP 800-38D), each chunk's nonce a counter with a flag on the last, so a
// file cut short, or with chunks reordered or swapped, fails to open
// rather than restoring part of an archive. The key is derived from the
// installation key file (HKDF-SHA-256, RFC 5869, label "nopacs/backup/v1"),
// so a backup opens only with that file, which has a backup of its own;
// the sealed secrets inside it are useless without that file anyway.
// Plaintext never leaves the server. Quarantined files' bytes, which live
// on the server's disk, are not in it; their records are, and come back
// marked as incoming lost.
//
// Restoring is not a method: the server is stopped, and the local command
// restore checks the whole file before writing anything, loads it, and
// brings every tenant up restoring (TENANT_STATE_RESTORING) until it is
// reconciled with its storages: their owner records taken (one naming
// another installation or tenant, or a later generation, is refused unless
// the restore is told to take it over); the correction records read, none
// trusted alone: one whose row is missing becomes an unresolved correction
// an admin decides (a delete holds its data, never purged nor undone by its
// record), and one that disagrees with its row leaves the row as the backup
// holds it and is reported; the catalog rebuilt, each record applied as its
// row says; a new event history begun. Every key it brings back is
// suspended for remote callers until AccessService.ReinstateKeys, or until
// the local operator rotates it.
// What the restore lost
// (changes after the recovery point, receptions acknowledged and not yet
// archived, quarantined bytes, events, audit entries) is printed and kept
// in its audit entry. A tenant's export is loaded into another
// installation by the local command tenant import, with the transfer key.
service BackupService {
  // CreateBackup streams an encrypted backup of the installation: its
  // master database and every tenant's, each as of one moment, its
  // recovery point. The stream is the file's bytes, in order, then a
  // summary; the client writes the bytes to a file and keeps the summary's
  // SHA-256 to check the copy. A stream that ends before its summary is no
  // backup.
  //
  // Role: admin on the installation.
  // Audit: one entry in the installation's log when the stream opens, and
  // one when it ends, with the file's size, SHA-256 and the tenants it
  // holds.
  // A backup is of the whole installation or nothing: a tenant that is
  // restoring, or whose database does not answer, fails the backup, by
  // intent, rather than leaving out a tenant a person would believe was
  // kept.
  //
  // Errors: unauthenticated, permission denied, invalid, unavailable (the
  // master database or a tenant's database does not answer, or a tenant is
  // restoring, with the reason TENANT_RESTORING, when the stream opens or
  // while it is open; the message names which).
  // Limits: no deadline is applied to the stream when the client sends
  // none; the 30-second default of other calls does not hold here. One
  // backup or export runs at a time on a server; another is answered
  // resource exhausted.
  rpc CreateBackup(CreateBackupRequest) returns (stream CreateBackupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ExportTenant hands a tenant to another installation, in this order:
  // (1) the tenant becomes moved (TENANT_STATE_MOVED): read only, its reads
  // served, every change refused (FAILED_PRECONDITION, reason
  // TENANT_MOVED), its receivers refusing; (2) its writers are drained: the
  // receptions, corrections, purges, scrub marks and job units in flight
  // finish or stop with their place kept; (3) the snapshot is taken, so
  // nothing is written after it and nothing is lost when the other
  // installation takes over. If the stream fails before the server has
  // written the summary, no transfer key reached anyone and the tenant
  // returns to ready, with an audit entry saying so. Once the summary is
  // written, moved stands, whether or not the client received it, and
  // TenantService.ReclaimTenant is the way back. A repeated call is
  // refused as precondition, since the tenant is then moved: an export is
  // not repeated by a plain retry. The stream is the tenant's database
  // without its catalog, which the target rebuilds from the storages. Every sealed
  // value in it (the naming, UID and date-shift secrets, storage and
  // sender credentials) is opened and sealed again under a transfer key
  // made at random for this export, and the file is encrypted under that
  // key, so the two installations' key files never meet on one machine.
  // The summary, the last message, carries the transfer key once; the
  // client writes it to a file of its own, readable by its owner alone,
  // and it is never answered again. The import on the target writes a new
  // owner record on each storage, so this installation, should it be
  // started against them again, fences the tenant (TENANT_STATE_FENCED).
  // The tenant's audit log and its checkpoints travel inside its database;
  // the target does not yet check them against this installation's audit
  // public key, so the chain is not verified across the move.
  //
  // Role: admin on the installation.
  // Audit: one entry in the installation's log, with the tenant's name and
  // the hand-off in details, when the stream opens, and one when it ends,
  // with the file's size and SHA-256 (never the transfer key), or with the
  // tenant's return to ready when it failed before its summary.
  // Errors: unauthenticated, permission denied, invalid, not found (no
  // tenant has that name), precondition (the tenant is already moved or
  // fenced; a rebuild of it is running; a correction of it is prepared),
  // unavailable (the tenant's database does not answer, when the stream
  // opens or while it is open, or the tenant is not ready).
  // Limits: no deadline is applied to the stream when the client sends
  // none; the 30-second default of other calls does not hold here. One
  // backup or export runs at a time on a server; another is answered
  // resource exhausted.
  rpc ExportTenant(ExportTenantRequest) returns (stream ExportTenantResponse);
}

// StorageOwner is the owner generation a database held for one storage at
// its recovery point.
message StorageOwner {
  // The storage's name.
  string storage = 1;

  // The generation in its owner record: one more each time an import or a
  // restore took the storage over.
  int64 generation = 2;
}

// BackupSection is one database in a backup or an export, and its recovery
// point: the moment it stands for, as a restore needs it to reconcile the
// database with its storages and say what was lost.
message BackupSection {
  // The tenant whose database it is, by name; empty for the master
  // database.
  string tenant = 1;

  // The database's schema version, the number of its last migration.
  int32 schema_version = 2;

  // The tables it holds.
  int32 tables = 3;

  // The rows it holds, every table together.
  int64 rows = 4;

  // The SHA-256 of the section's plaintext, as the file's footer holds it.
  bytes sha256 = 5;

  // When its read transaction began: what it holds is the database as of
  // this moment.
  google.protobuf.Timestamp snapshot_time = 6;

  // For a tenant, the id of its event feed's history at that moment; a
  // restore begins a new one. Empty for the master.
  string event_history = 7;

  // For a tenant, the operation id of the newest correction it holds.
  // Operation ids are time-ordered (Correction.id), so a restore applies
  // every correction record on the storages whose id sorts after this one,
  // as well as every record with no row or a state ahead of its row. Empty
  // for none, and for the master.
  string last_correction = 8;

  // For a tenant, the id of the newest reception it holds by its creation
  // time, which the restore's report of lost receptions names as where the
  // backup stops. Which receptions were lost is not read from this id: it
  // is every reception the section holds as not done. Empty for none, and
  // for the master.
  string last_reception = 9;

  // For a tenant, the owner generation it held for each of its storages,
  // ordered by storage name. Empty for the master.
  repeated StorageOwner owners = 10;

  // The version of the installation key in use at that moment, from 1 to
  // 2^31-1.
  int32 key_version = 11;
}

// BackupSummary ends a backup's or an export's stream: what the file holds
// and how to check it.
message BackupSummary {
  // The file's format: "nopacs-backup" or "nopacs-tenant-export".
  string format = 1;

  // The format's version: 1.
  int32 format_version = 2;

  // The id of the installation that made it.
  string installation_id = 3;

  // When it was made.
  google.protobuf.Timestamp time = 4;

  // The size in bytes of the whole file, as sent.
  int64 size_bytes = 5;

  // The SHA-256 of the whole file, as sent: 32 bytes.
  bytes sha256 = 6;

  // Each database it holds, with its recovery point: the master first,
  // then the tenants by name.
  repeated BackupSection sections = 7;

  // For a backup, the version of the installation key whose derived key
  // encrypted it, from 1 to 2^31-1; 0 for an export, which a transfer key
  // encrypts.
  int32 key_version = 8;
}

// CreateBackupRequest asks for a backup. It has no fields.
message CreateBackupRequest {}

// CreateBackupResponse is one message of a backup's stream.
message CreateBackupResponse {
  // Which it is. Exactly one is set: data, then the summary last.
  oneof kind {
    // The next bytes of the encrypted file, at most 1 MiB, in order.
    bytes data = 1;

    // What the file holds; the last message.
    BackupSummary summary = 2;
  }
}

// ExportTenantRequest names the tenant to hand off.
message ExportTenantRequest {
  // The tenant, by name. Required.
  string tenant = 1;
}

// TenantExportSummary ends an export's stream.
message TenantExportSummary {
  // What the file holds and how to check it.
  BackupSummary summary = 1;

  // The transfer key: 32 random bytes that open the file and the sealed
  // values in it. Answered once, here; the server keeps no copy.
  bytes transfer_key = 2 [debug_redact = true];
}

// ExportTenantResponse is one message of an export's stream.
message ExportTenantResponse {
  // Which it is. Exactly one is set: data, then the summary last.
  oneof kind {
    // The next bytes of the encrypted file, at most 1 MiB, in order.
    bytes data = 1;

    // What the file holds, and its transfer key; the last message.
    TenantExportSummary summary = 2;
  }
}
