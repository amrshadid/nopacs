syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package nopacs.v1;

// DataService answers the archived instances of a tenant: the DICOM files
// of an instance, a scan, a session or a subject, each as it was archived,
// byte for byte.
//
// What a reader reads. Until a later version de-identifies files at
// reception, the archive holds what the senders sent, and a reader of a
// tenant downloads it as it was received, identifying data included.
//
// Instances, keys and places. An instance is named by the labels of its
// scan and its instance id, unique in the tenant. Its bytes are a place in
// a stored object: the length bytes from offset in the object at its
// storage key, and its SHA-256 is that of those bytes, as its scan's
// manifest records them (the manifest is the list, kept on the storage
// beside the scan's files, of every file of the scan with its key, place,
// size and SHA-256). In this version every instance is its own object,
// "data/<subject>/<session>/<scan>/<SOP Instance UID>.dcm", so offset is 0
// and length is the object's size; a later version may place several
// instances in one object, and an instance keeps its own place, length,
// SHA-256 and download path. A key is opaque to a client, which compares
// it whole, takes the labels from the fields that carry them, and never
// downloads by key.
//
// Checking as it reads. Every instance is announced before its bytes with
// its place, length and SHA-256, so a client checks each one as it reads
// it and needs nothing else to know a copy is whole. The server computes
// the SHA-256 of the bytes as it sends them; an instance whose bytes do
// not match its manifest ends the stream (data loss), so an instance
// damaged on the storage is never passed on as good.
//
// One instance over plain HTTP. Each instance is also served by a plain
// HTTP GET, for a client that wants one file, a part of one, a download
// resumed where it stopped, or a value a BulkDataURI names
// (MetadataService), with any HTTP client:
//
//   GET /tenants/<tenant>/instances/<subject>/<session>/<scan>/<instance id>
//   Authorization: Bearer nopacs_<id>_<secret>
//
// on the API's port, with the same key, grants and audit as every method.
//
//   - Order of checks. The caller is authenticated (401), then must hold
//     reader on the tenant the path names (403, or 404 for a tenant that
//     does not exist to a caller who may list every tenant, as for every
//     method), and only then is the rest of the path read and the instance
//     looked up. So a 404 for an instance tells a caller only that this
//     tenant, which it may read, holds no such instance; never whether an
//     instance or a key exists in another tenant, or at all.
//   - Lookup. The path is read from the request's raw form. A path with
//     any percent-encoding (labels and ids hold only characters a path
//     segment carries as they are, so "%2F" or any other escape cannot be
//     one of the archive's), an empty segment, a "." or ".." segment, a
//     trailing "/", or anything a cleaning of the path would change, is
//     answered 404, never redirected (301), so no form of a path reaches
//     what another form names. Each label must pass the label rule and the
//     id its own; the instance is looked up by its id, the catalog's
//     primary key, and its subject, session and scan labels are compared
//     byte for byte with the path's, or the answer is 404. Only an
//     instance the tenant holds, archived and confirmed by its reception,
//     is found: one a reception has claimed and not yet archived is
//     answered 404, as one that does not exist. The bytes are
//     read from the storage at the key and place the catalog holds, the
//     key checked by the server's layout rules before it reaches a
//     storage; a path is never a file path, and nothing of the request is
//     joined into one.
//   - The whole instance. 200, Content-Type "application/dicom" (RFC
//     3240), Content-Length its length, "Accept-Ranges: bytes", and an
//     ETag that is its SHA-256 in lowercase hexadecimal in quotes, a
//     strong validator (RFC 9110 8.8.3). The server checks the SHA-256 as
//     it sends the body; on a mismatch it ends the connection (on HTTP/2,
//     resets the stream) before the last byte, so the body is short of
//     Content-Length and never looks complete.
//   - Range (RFC 9110 14). One range per request: "bytes=<first>-" (to the
//     end, the form a resumed download sends), "bytes=<first>-<last>" (a
//     last at or past the end is taken as the end), or "bytes=-<suffix>"
//     (the last suffix bytes, all of them when the instance is shorter).
//     The answer is 206 with those bytes and their Content-Range. A range
//     whose first is at or past the end, any range of an instance of
//     length zero, and a suffix of zero are answered 416 with
//     "Content-Range: bytes */<length>" (RFC 9110 15.5.17). A Range header
//     that does not parse, names another unit, has a last before its
//     first, or holds more than one range, is ignored, and the whole
//     instance answered 200, which RFC 9110 14.2 allows. The server does
//     not check the SHA-256 of a part it answers, which would mean reading
//     the whole instance: the client checks what it assembles against the
//     ETag.
//   - If-Range (RFC 9110 13.1.5). With the strong ETag the client holds,
//     the range is answered only while the instance is that one, and the
//     whole instance otherwise, so a download resumed after the instance
//     changed can never join the bytes of two versions. An If-Range that
//     holds a date or a weak tag ("W/") gets the whole instance: only a
//     strong tag proves the bytes are the same.
//   - HEAD answers what GET would, status (206 for a Range) and headers,
//     without a body.
//   - A part named in the path. The query "offset=<offset>&length=<length>",
//     which a BulkDataURI carries, names the length bytes from offset of
//     the instance, and the answer treats that window as its whole body:
//     Content-Type "application/octet-stream", Content-Length length, and
//     the instance's ETag, whose bytes the window is a part of. Both
//     parameters are given or neither, each in decimal digits with no sign
//     or leading zero (other than "0" itself), length at least 1, and
//     offset plus length no more than 2^63 - 1, and no other parameter
//     and neither of the two given twice (a parameter the server ignored
//     would let two URIs name one part, and a second value would let one
//     URI name two); a query that breaks any of these is answered 400. A window that ends past the instance's length is answered 416
//     with "Content-Range: bytes */<length>". A Range, with If-Range, is
//     applied within the window as within a whole instance, its positions
//     counted from the window's first byte. The server does not check the
//     SHA-256 of a window.
//   - Other answers carry the codes of the package (access.proto): 400,
//     401, 403, 404, 429 (too many downloads open, below), 500 (also an
//     instance missing from its storage), and 503 (the tenant's database
//     or the instance's storage does not answer, or the tenant is not
//     ready), each with the request id in Nopacs-Request-Id.
//   - Limits. A caller, a key or the local operator, holds at most 16 open
//     reads at once, and the server 256; one more is answered 429. The 16
//     are shared by the streams of ReadFiles, these downloads, and the
//     requests of the tenant's DICOMweb service that read the archive (a
//     search, a retrieve, a frame), each of which holds one while it is
//     answered. No deadline is applied; a
//     download whose client reads nothing for 5 minutes is ended by
//     closing its connection. A client that fetches the BulkDataURIs of a
//     scan in parallel keeps a small pool of downloads, a few at once:
//     they share the caller's 16 with its streams and its DICOMweb
//     requests, and the seventeenth is refused rather than queued.
//   - Logs. The audit entry of a download has the scan's path,
//     "<subject>/<session>/<scan>", as its object (a label that is not
//     valid is written "invalid" in it), and in details whether a range
//     and a window were asked for and how many bytes were sent; never the
//     instance id or a key, since in this version each holds a SOP
//     Instance UID, an identifier as received, which no log holds. For
//     the same reason the server's request log and its metrics name the
//     route, never the request's path.
//   - Role: reader on the tenant.
//
// The headers of the instances, without their bulk data, are
// MetadataService's.
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE.
service DataService {
  // ReadFiles streams the instances of one instance, one scan, one session
  // or one subject, in the order of the tuple (session label, scan label,
  // instance id), each label folded (ASCII letters in lower case) and each
  // part compared in byte order; the levels a request names are the same
  // for every instance, so a scan's instances come by instance id. The
  // instances of each scan are preceded by a marker of the scan (a
  // ReadFilesResponse with scan set), and each instance by its
  // announcement (with file set), then its bytes in order (each with chunk
  // set). An instance's chunks hold its bytes from the first to the last,
  // their offsets following on with no gap, and the last ends at its
  // length; an instance of length zero has no chunk. A chunk holds at most
  // 1 MiB in this version; a client accepts any chunk of up to 3 MiB, so
  // the server may send larger ones later without a change of the
  // contract, always under the 4 MB a stock gRPC client accepts.
  //
  // The instances of a scan are those its manifest lists when the stream
  // reaches the scan, every one of them held by the tenant (an instance a
  // reception has claimed and not yet archived is in no manifest; named
  // by instance_id, it is not found, as one that does not exist), and the scan's marker carries that manifest's
  // SHA-256: a client that compares it with the one it held, or with
  // Scan.manifest_sha256 of a listing, sees when a scan changed behind its
  // position, and reads that scan again. A stream that ends before the
  // last instance (the client went away, the server stopped, a storage
  // stopped answering) is resumed by a new call with start_after set to the
  // position of the last instance the client received whole and checked:
  // the stream goes on from the first instance after that position in the
  // order above, whether or not that instance is still held. A call with
  // announce_only set sends the markers and announcements without the
  // bytes, to compare a copy held elsewhere.
  //
  // The caller's key and grant are checked again at least every 15 seconds
  // while the stream is open: a key revoked or expired, or a grant removed,
  // ends the stream with the answer a new call would get.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log when the stream opens, with the
  // path asked for ("<subject>", "<subject>/<session>" or
  // "<subject>/<session>/<scan>", a label that is not valid written
  // "invalid") as its object, and in details whether an instance and
  // start_after were given, and announce_only (an instance id is recorded
  // only as present, since in this version it holds an identifier as
  // received, which no log holds); and one when it ends, with how many
  // instances and bytes it sent and how it ended.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a level named without the levels above it, a start_after that
  // does not name a position inside what is asked for), not found (the
  // tenant has no such subject, session or scan, or the scan no instance
  // with that id; a tenant that does not exist, for a caller who may list
  // every tenant), unavailable (the tenant's database or a storage does
  // not answer, when the stream opens or while it is open, or the tenant
  // is not ready; the client resumes with start_after), data loss (an
  // instance is missing from its storage, or its bytes do not match the
  // SHA-256 of its manifest, or a scrub found it missing or damaged and
  // marked it (ScrubJob), when the instance is announced and the stream
  // ends before any of its bytes, so a call with start_after at that
  // instance goes on past it; the message names its scan, and the bytes of
  // that instance already sent are not to be kept), resource exhausted
  // (the caller, a key or the local operator, already holds 16 open
  // reads, shared by the streams of this method, downloads and the
  // DICOMweb requests that read the archive, or the server holds 256).
  // Limits: no deadline is applied to the stream when the client sends
  // none, since a subject's instances may take hours; the 30-second
  // default of other calls does not hold here. A stream whose client reads
  // nothing for 5 minutes is ended as deadline exceeded, so a client that
  // stalls does not hold a storage's connection for ever.
  rpc ReadFiles(ReadFilesRequest) returns (stream ReadFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ScanMarker opens the instances of one scan in a stream of ReadFiles.
message ScanMarker {
  // The label of its subject.
  string subject_label = 1;

  // The label of its session.
  string session_label = 2;

  // The scan's label.
  string scan_label = 3;

  // The SHA-256 of the manifest the stream reads the scan's instances
  // from, in lowercase hexadecimal, 64 characters, as
  // Scan.manifest_sha256.
  string manifest_sha256 = 4;

  // How many instances that manifest lists: the scan's whole count,
  // whatever start_after or an instance asked for leaves out of the
  // stream.
  int64 instance_count = 5;
}

// ArchivedFile is the announcement of one archived instance, from its
// scan's manifest.
message ArchivedFile {
  // The instance's id in the tenant: unique in it, at most 64 bytes of A-Z,
  // a-z, 0-9, ".", "_" and "-", the last part of its plain HTTP path.
  // Opaque: in this version it is the SOP Instance UID as received, which
  // a client must not rely on, since a later version that replaces
  // identifiers at reception gives the archive's own.
  string instance_id = 1;

  // Its SOP Instance UID (0008,0018), as received.
  string sop_instance_uid = 2;

  // The label of its subject.
  string subject_label = 3;

  // The label of its session.
  string session_label = 4;

  // The label of its scan.
  string scan_label = 5;

  // The storage key of the object that holds it: opaque, at most 1024
  // bytes, the same on every storage of the tenant. A key is written once:
  // a replaced instance's later revision lies at a key of its own (in this
  // version one ending ".r<n>.dcm"), never over the bytes a reader may
  // still be reading.
  string key = 6;

  // Where its bytes start in that object. 0 in this version.
  int64 offset = 7;

  // Its length in bytes: the DICOM file header and the data set, as
  // archived. The stream sends this many bytes of it.
  int64 length = 8;

  // The SHA-256 of its bytes, in lowercase hexadecimal, 64 characters.
  string sha256 = 9;

  // Its revision: 1 as first archived, one more each time a correction
  // replaced it (CorrectionService.Replace). With sha256 it names these
  // exact bytes, so a client that keeps (instance_id, revision, sha256)
  // can ask later whether they are still current
  // (CorrectionService.ResolveInstances). The plain HTTP download's ETag
  // is the SHA-256, so it differs per revision.
  int32 revision = 10;
}

// FileChunk is a part of the bytes of the instance last announced.
message FileChunk {
  // Where the part starts in the instance, in bytes from its first: 0 for
  // the first chunk of an instance, and the end of the one before for each
  // next.
  int64 offset = 1;

  // The bytes: at least one, at most 1 MiB in this version, and never more
  // than 3 MiB.
  bytes data = 2;
}

// ReadPosition is a place in the order of ReadFiles: the instance id of an
// instance and the labels of its session and scan.
message ReadPosition {
  // The label of the instance's session. Required when the request names
  // a subject alone; otherwise empty or the session named.
  string session_label = 1;

  // The label of the instance's scan. Required when the request names no
  // scan; otherwise empty or the scan named.
  string scan_label = 2;

  // The instance's id. Required.
  string instance_id = 3;
}

// ReadFilesRequest names what to stream: a subject, or a session of it, or
// a scan of that, or one instance of the scan. The deepest level given is
// what is streamed, and each level needs every level above it.
message ReadFilesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The subject's label. Required.
  string subject_label = 2;

  // The session's label. Empty for every session of the subject.
  string session_label = 3;

  // The scan's label. Empty for every scan of the session; needs
  // session_label.
  string scan_label = 4;

  // The id of one instance of the scan. Empty for every instance of the
  // scan; needs scan_label.
  string instance_id = 5;

  // The position of the last instance the client received whole, to
  // resume after it, from an earlier stream of the same request. Absent to
  // start from the first instance. It need not name an instance still
  // held: the stream goes on from the first instance after the position.
  ReadPosition start_after = 6;

  // Whether to send only the markers and announcements, without the bytes:
  // a listing of the instances with their places, lengths and checksums,
  // which reads the manifests alone and no file.
  bool announce_only = 7;
}

// ReadFilesResponse is one message of the stream: a scan's marker, an
// instance's announcement, or a part of its bytes.
message ReadFilesResponse {
  // What this message carries.
  oneof part {
    // The next instance, announced before its bytes.
    ArchivedFile file = 1;

    // A part of the bytes of the instance last announced.
    FileChunk chunk = 2;

    // The next scan, before its instances.
    ScanMarker scan = 3;
  }
}
