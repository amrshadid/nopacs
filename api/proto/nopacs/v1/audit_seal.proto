syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets) is said on the package in access.proto.
package nopacs.v1;

import "google/protobuf/timestamp.proto";
import "nopacs/v1/audit.proto";
import "nopacs/v1/scope.proto";

// AuditSealService proves that an audit log (AuditService) has not been
// changed since it was written: no entry changed, removed or put in
// between. It verifies a log, lists its checkpoints, exports it with what
// an auditor needs to check it without the server, and answers the public
// key that checks it.
//
// The chain. Entries are given their order when they are sealed, not when
// they are written, since entries written at once by many requests commit
// in no fixed order. Every audit.seal-interval (an installation setting, a
// period such as "10m", from "1m" to "1d"; built-in default "10m"), and
// when the server stops (after its requests have drained and the audit
// entries it held are written), a sealing pass takes each log's entries not yet
// sealed, orders them by time and then id, gives each the next sequence
// number (seq, from 1) and folds it into the log's chain: h(n) =
// SHA-256(h(n-1) || encode(entry n)), with h(0) 32 zero bytes (SHA-256,
// FIPS 180-4). Changing one entry, or removing it, changes every h after
// it. encode writes, in this order, each field as a 4-byte big-endian
// length followed by that many bytes: "nopacs/audit-entry/v1" in ASCII;
// seq as 8 bytes, big-endian; the id; the time as 8 bytes, big-endian
// signed microseconds since 1970-01-01T00:00:00Z; the key id; the local
// user; the remote address; the method; the tenant name; the object; the
// outcome ("done", "refused" or "failed"); the reason; then the number of
// details as 4 bytes, big-endian, with no length before it, followed by
// each detail's name and value as two fields, the details sorted by their
// names' bytes; and last the request id. Every text is UTF-8, and an
// empty one is a field of length 0. ExportAudit answers each entry's
// encoded form beside it, so another implementation checks the fold
// without the server's code. Times are kept in whole microseconds, which
// is what the databases store, so a time read back encodes the same.
//
// Checkpoints. Each pass ends in a checkpoint per log that had entries to
// seal: its range of seq, its count, the chain's head h(to_seq), the digest
// of the checkpoint before it, its time, its key version, and an Ed25519
// signature (RFC 8032) over those with the installation's id and the log's
// name, in the encoding AuditCheckpoint.signed_text states. The signing
// key is derived from the installation key file (HKDF-SHA-256, RFC 5869,
// label "nopacs/audit-seal/v1"), never stored, and its public key is
// answered by GetAuditPublicKey, so an auditor checks a checkpoint with the
// public key alone, and nobody without the installation key can make one.
// The installation's log keeps the latest checkpoint digest of each tenant,
// and each tenant's log the installation's latest, so a tenant's database
// rewritten whole, its checkpoints included, disagrees with the
// installation's; an anchor moves forward only to a checkpoint that
// descends from the one it names, so a log taken back with its database
// alone and sealed again keeps the old anchor and is reported rolled back;
// the server's log carries each checkpoint's digest too, for an operator
// who keeps logs elsewhere.
//
// Logs that moved. A public key is named by the installation that holds
// its key and the key's version, since a tenant imported from another
// installation would bring checkpoints that installation signed. Once a
// tenant import exists (BackupService.ExportTenant, then a local command
// that imports it), it brings the source installation's audit public keys
// with the tenant's log, and the target's first checkpoint of that log
// anchors the source's last checkpoint digest, so the chain is checked
// across the move. No such import exists yet: a server holds and answers
// only its own installation's keys. Each checkpoint names the installation
// that signed it and the exact log string its signed text holds (the
// tenant's id, which a move keeps; not its name, which may differ).
//
// What a seal does not prove. Someone who holds the installation key file
// and can write every database can seal a rewritten log again; only a copy
// of the checkpoints or the public key kept outside the installation shows
// that. A rollback of the master and the tenant databases together to an
// earlier point, their entries, checkpoints and anchors all as they were
// then, needs no key and is consistent, so the seal alone does not detect
// it: only a checkpoint digest or a minimum seq kept outside the
// installation does, which VerifyAudit checks when given one
// (VerifyAuditRequest.expected_checkpoint_digest, expected_min_seq).
// Entries not yet sealed, at most one interval old, can be removed
// without a trace; a log whose entries wait longer is reported
// (AUDIT_VERIFY_PROBLEM_KIND_SEALING_STALLED). A read's or a refusal's entry dropped when the server
// was overwhelmed stays dropped, and counted (AuditService).
//
// Retention. The setting audit.retention (a period from "90d" to
// "36500d", such as "3650d", or "0" to keep every entry; built-in default
// "0") prunes whole sealed checkpoints older than it, counted back from
// the earlier of the server's clock and the log's latest checkpoint, so a
// clock set forward does not prune early; every checkpoint stays, so the
// chain is still checked across what was pruned, and the pruning writes
// its own entry, sealed in the same pass, which a verification needs to
// accept the pruned checkpoints (AUDIT_VERIFY_PROBLEM_KIND_ENTRY_MISSING).
// Export before a period is set: what is pruned is gone.
//
// Ranges. VerifyAudit and ExportAudit take a range of seq, never of time:
// a seq names one place in the chain, where a time can name many. A
// range's start is moved back to the from_seq of the checkpoint that
// covers it, so every range begins where a checkpoint begins and its chain
// value before is the previous checkpoint's head, which a check can trust.
service AuditSealService {
  // VerifyAudit recomputes a log's chain from its entries, checks each
  // checkpoint's head and signature against it with the public key of the
  // installation and key version it names, and checks the anchors between
  // the installation's log and the tenant's, and, when given, the values
  // kept outside the installation. It verifies from from_seq (moved back
  // to a checkpoint's start) to to_seq, and one call stops at the end of a
  // checkpoint once it has recomputed 1000000 entries or checked 10000
  // checkpoints (pruned ones included), or when less than 2 seconds are
  // left before the call's deadline; next_seq, the to_seq of the last
  // checkpoint checked plus 1, says where the next call starts, so a long
  // log is verified in several calls, none past its deadline. Every call
  // checks one checkpoint at least. It changes nothing.
  //
  // Role: admin on the scope asked for.
  // Audit: one entry in the log of the scope asked for, with the range
  // verified and whether it was intact in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a negative from_seq or to_seq, a to_seq below from_seq, an
  // expected_min_seq below 1, or an expected_checkpoint_digest not 32
  // bytes), not found (a tenant that does not exist, for a caller who may
  // list every tenant), unavailable (the database of the scope does not
  // answer, or the tenant is not ready).
  rpc VerifyAudit(VerifyAuditRequest) returns (VerifyAuditResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAuditCheckpoints answers a log's checkpoints, newest first.
  //
  // Role: admin on the scope asked for.
  // Audit: one entry in the log of the scope asked for.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the database of the scope does not answer, or the
  // tenant is not ready).
  rpc ListAuditCheckpoints(ListAuditCheckpointsRequest) returns (ListAuditCheckpointsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ExportAudit streams a log's sealed entries from from_seq (moved back to
  // a checkpoint's start) to to_seq, in the order of their seq, with what
  // checks them outside the server: first a header (the public keys, the
  // installation's id, the log, the anchors, and the chain value before
  // the first entry), then each entry with its seq and encoded form, each
  // checkpoint after the last entry it covers. Entries not sealed yet are
  // not exported. The client writes the messages as JSON lines.
  //
  // Role: admin on the scope asked for.
  // Audit: one entry in the log of the scope asked for when the stream
  // opens, with its range in details, and one when it ends, with how many
  // entries it carried.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a negative from_seq or to_seq, or a to_seq below from_seq), not
  // found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the database of the scope does not answer, when
  // the stream opens or while it is open, or the tenant is not ready).
  // Limits: no deadline is applied to the stream when the client sends
  // none; the 30-second default of other calls does not hold here.
  rpc ExportAudit(ExportAuditRequest) returns (stream ExportAuditResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetAuditPublicKey answers the public keys that check the checkpoints
  // of every log of the installation: one per version of its installation
  // key, and, once a tenant import exists, those an import brought from
  // the installations its tenants came from (today there are none), each
  // named by installation and version, so an auditor keeps them outside
  // the installation. A client asked for the key of an installation none
  // of them names answers not found, never an empty key. They are public:
  // they check a signature and cannot make one.
  //
  // Role: none; any caller the server authenticates.
  // Audit: one entry in the installation's log.
  // Errors: unauthenticated, unavailable (the master database does not
  // answer).
  rpc GetAuditPublicKey(GetAuditPublicKeyRequest) returns (GetAuditPublicKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// AuditCheckpoint is a signed record of a log's chain at one point.
message AuditCheckpoint {
  // The tenant whose log it seals, by its name now; empty for the
  // installation's log. For display: the signed text holds log.
  string tenant = 1;

  // The seq of the first entry it seals.
  int64 from_seq = 2;

  // The seq of the last entry it seals.
  int64 to_seq = 3;

  // How many entries it sealed: always to_seq - from_seq + 1, also after
  // retention pruned them (pruned says so).
  int64 entries = 4;

  // The chain's value after its last entry, h(to_seq): 32 bytes.
  bytes head = 5;

  // The digest of the checkpoint before it in the same log: the SHA-256 of
  // that checkpoint's signed text, 32 bytes; 32 zero bytes for a log's
  // first.
  bytes previous_digest = 6;

  // The SHA-256 of its signed text: what the next checkpoint names as its
  // previous_digest, and what the other log keeps as its anchor.
  bytes digest = 7;

  // When it was made, in whole microseconds, as its signed text holds it.
  google.protobuf.Timestamp time = 8;

  // The version of the installation key whose derived key signed it
  // (AuditPublicKey), from 1 to 2^31-1, of the installation
  // installation_id names.
  int32 key_version = 9;

  // The Ed25519 signature (RFC 8032) of its signed text: 64 bytes.
  bytes signature = 10;

  // The bytes it signs, exactly. Nine fields in this order, each written as
  // a 4-byte big-endian length followed by that many bytes: the header
  // "nopacs/audit-checkpoint/v1" in ASCII; the installation's id in UTF-8;
  // the log ("master", or the tenant's id) in UTF-8; from_seq as 8 bytes
  // and to_seq as 8 bytes, each big-endian; head, 32 bytes;
  // previous_digest, 32 bytes; time as 8 bytes, big-endian signed
  // microseconds since 1970-01-01T00:00:00Z; key_version as 4 bytes,
  // big-endian. Answered so a check needs no rule of its own to rebuild
  // it; a check that rebuilds it from the other fields gets the same
  // bytes.
  bytes signed_text = 11;

  // The id of the installation that signed it, exactly as its signed text
  // holds it: this installation's, or for a log imported from another,
  // the source's for the checkpoints made there.
  string installation_id = 12;

  // The log exactly as its signed text holds it: "master" for the
  // installation's log, otherwise the tenant's id (which a move keeps),
  // not its name.
  string log = 13;

  // Whether retention pruned the entries it seals: the checkpoint stays,
  // so the chain is still checked across them, but the entries are gone.
  bool pruned = 14;
}

// AuditPublicKey is the public key of one version of an installation key's
// audit signing key, named by the installation and the version.
message AuditPublicKey {
  // The installation key's version it belongs to, from 1 to 2^31-1.
  int32 key_version = 1;

  // The Ed25519 public key (RFC 8032 5.1.5): 32 bytes.
  bytes public_key = 2;

  // The same key as a PEM SubjectPublicKeyInfo (RFC 8410), which openssl
  // reads as it is: "openssl pkeyutl -verify -pubin -inkey key.pem -rawin".
  string public_key_pem = 3;

  // Whether it signs the checkpoints this installation makes now. Always
  // false for a key brought by an import.
  bool current = 4;

  // The id of the installation whose installation key it derives from:
  // this one, or one a tenant was imported from.
  string installation_id = 5;
}

// AuditVerifyProblemKind is what a verification found wrong. A kind added
// later is a new value.
enum AuditVerifyProblemKind {
  // Never answered by the server.
  AUDIT_VERIFY_PROBLEM_KIND_UNSPECIFIED = 0;

  // The chain recomputed from the entries does not reach a checkpoint's
  // head: an entry it covers was changed, removed or put in between.
  AUDIT_VERIFY_PROBLEM_KIND_CHAIN_BROKEN = 1;

  // A seq is missing in a range a checkpoint covers and retention has not
  // pruned. A checkpoint marked pruned that retention did not prune is one
  // too: one that follows a checkpoint not pruned (retention prunes the
  // oldest first), one younger than 90 days (the shortest audit.retention)
  // by its signed time, or one in the range of no pruning entry (local
  // user "server", method "AuditRetention", details pruned_from_seq and
  // pruned_to_seq) sealed after it, past the pruned checkpoints whose own
  // pruning entry retention has since pruned in its turn.
  AUDIT_VERIFY_PROBLEM_KIND_ENTRY_MISSING = 2;

  // A checkpoint's signature does not check with the public key of its
  // installation and key version, or names an installation and version
  // this installation holds no public key for.
  AUDIT_VERIFY_PROBLEM_KIND_BAD_SIGNATURE = 3;

  // A checkpoint's previous_digest is not the digest of the checkpoint
  // before it, or its range does not follow on from it.
  AUDIT_VERIFY_PROBLEM_KIND_CHECKPOINT_OUT_OF_LINE = 4;

  // The log's checkpoint at the to_seq of the anchor the other log keeps
  // for this one is there, but its digest is not the anchor's.
  AUDIT_VERIFY_PROBLEM_KIND_ANCHOR_DISAGREES = 5;

  // The log was taken back to an earlier point. Either it does not reach
  // what was kept outside the installation (its last sealed seq is below
  // expected_min_seq, or no checkpoint has expected_checkpoint_digest),
  // which the chain and the anchors alone cannot show; or it no longer
  // holds the checkpoint at the to_seq of the anchor the other log keeps
  // for it, whether or not it grew again since. A sealing pass moves an
  // anchor forward only to a checkpoint that descends from the one it
  // names, so a log taken back and sealed again keeps reporting this
  // until an operator accepts a restore.
  AUDIT_VERIFY_PROBLEM_KIND_ROLLED_BACK = 6;

  // An entry not yet sealed has waited more than two seal intervals since
  // it was written and since the log was last sealed: the sealing passes
  // are not sealing this log (an entry that cannot be encoded, as only a
  // row put in by hand can be, holds every later one back), and entries
  // not yet sealed can be removed without a trace. seq is 0; the server's
  // log names the entry.
  AUDIT_VERIFY_PROBLEM_KIND_SEALING_STALLED = 7;
}

// AuditVerifyProblem is one thing a verification found wrong, at the place
// it was found.
message AuditVerifyProblem {
  // What it is.
  AuditVerifyProblemKind kind = 1;

  // The seq at which it shows: the first entry whose fold differs, the
  // missing seq, or the to_seq of the checkpoint concerned; 0 for a
  // problem of the entries not yet sealed, which have no seq.
  int64 seq = 2;

  // More about it, in words for a person, from a fixed set of phrases the
  // server has; at most 256 bytes. Never an entry's content.
  string detail = 3;

  // For AUDIT_VERIFY_PROBLEM_KIND_SEALING_STALLED, when the oldest entry
  // not yet sealed was written, in whole microseconds: where the stall
  // begins, never what the entry holds. Absent for every other kind.
  google.protobuf.Timestamp time = 4;
}

// VerifyAuditRequest names the log to verify and where to start.
message VerifyAuditRequest {
  // The log: one tenant's, or the installation's. Required.
  Scope scope = 1;

  // The seq to start from: 0 or 1 for the first entry; a next_seq answered
  // before to go on. Moved back to the from_seq of the checkpoint that
  // covers it.
  int64 from_seq = 2;

  // The last seq to verify. Absent for the last sealed entry.
  optional int64 to_seq = 5;

  // A seq the log is known to have reached, kept outside the installation
  // (from an earlier export or verification). The log's last sealed seq
  // below it is a problem (AUDIT_VERIFY_PROBLEM_KIND_ROLLED_BACK): the
  // databases were taken back to an earlier point. It does not detect a
  // log taken back and grown again past it since: only
  // expected_checkpoint_digest does. Absent for no such check; at least 1
  // when given.
  optional int64 expected_min_seq = 3;

  // The digest of a checkpoint known to be in the log
  // (AuditCheckpoint.digest), kept outside the installation. No checkpoint
  // of the log with that digest is a problem
  // (AUDIT_VERIFY_PROBLEM_KIND_ROLLED_BACK). Empty for no such check;
  // otherwise 32 bytes.
  bytes expected_checkpoint_digest = 4;
}

// VerifyAuditResponse is what a verification found.
message VerifyAuditResponse {
  // Whether everything verified held: no problem found.
  bool intact = 1;

  // The entries recomputed by this call.
  int64 entries_checked = 2;

  // The checkpoints checked by this call.
  int64 checkpoints_checked = 3;

  // The entries of the log not sealed yet, which no verification covers.
  int64 unsealed_entries = 4;

  // The seq to start the next call from; 0 when this call reached the
  // last sealed entry.
  int64 next_seq = 5;

  // What was found wrong, in order of seq; at most 1000.
  repeated AuditVerifyProblem problems = 6;

  // The log's latest checkpoint. Absent for a log never sealed.
  AuditCheckpoint last_checkpoint = 7;
}

// ListAuditCheckpointsRequest asks for a page of a log's checkpoints.
message ListAuditCheckpointsRequest {
  // The log: one tenant's, or the installation's. Required.
  Scope scope = 1;

  // The most checkpoints to answer: zero means 100; at most 1000. A larger
  // or negative value is invalid.
  int32 page_size = 2;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a scope other than the
  // one it was made with.
  string page_token = 3;
}

// ListAuditCheckpointsResponse is a page of checkpoints.
message ListAuditCheckpointsResponse {
  // The checkpoints of this page, newest first.
  repeated AuditCheckpoint checkpoints = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// ExportAuditRequest names the log to export and its range of seq.
message ExportAuditRequest {
  // The log: one tenant's, or the installation's. Required.
  Scope scope = 1;

  // The first seq to export: 0 or 1 for the first entry kept. Moved back
  // to the from_seq of the checkpoint that covers it.
  int64 from_seq = 2;

  // The last seq to export. Absent for the last sealed entry. Must not be
  // below from_seq.
  optional int64 to_seq = 3;
}

// AuditAnchor is the latest checkpoint digest one log keeps of another, as
// an export carries it.
message AuditAnchor {
  // The other log, exactly as signed texts hold it: "master" or a
  // tenant's id.
  string log = 1;

  // The digest of that log's checkpoint this log keeps: 32 bytes.
  bytes digest = 2;

  // The to_seq of that checkpoint.
  int64 to_seq = 3;
}

// AuditExportHeader opens an export: what checks the rest.
message AuditExportHeader {
  // This installation's id.
  string installation_id = 1;

  // The tenant whose log it is, by its name now; empty for the
  // installation's.
  string tenant = 2;

  // The public keys of every installation and key version that signed a
  // checkpoint of the log (GetAuditPublicKey).
  repeated AuditPublicKey public_keys = 3;

  // The chain's value before the first entry exported, h(first seq - 1):
  // 32 bytes, so the fold is checked from there.
  bytes chain_before = 4;

  // The version of the encoding of entries and signed texts: 1.
  int32 encoding_version = 5;

  // The log exactly as its signed texts hold it: "master" or the tenant's
  // id.
  string log = 6;

  // The anchors this log keeps of the others (the installation's log of
  // each tenant's, a tenant's of the installation's, and an imported log's
  // of its source), and those the others keep of it, so a rewritten log
  // is caught outside the server too.
  repeated AuditAnchor anchors = 7;

  // The seq of the first entry exported, after moving back to a
  // checkpoint's start; 0 when nothing was exported.
  int64 from_seq = 8;
}

// SealedAuditEntry is one sealed entry of an export.
message SealedAuditEntry {
  // Its place in its log's chain, from 1.
  int64 seq = 1;

  // The entry, as AuditService answers it.
  AuditEntry entry = 2;

  // Its encoded form, the bytes folded into the chain.
  bytes encoded = 3;

  // The chain's value after it, h(seq): 32 bytes.
  bytes chain = 4;
}

// ExportAuditResponse is one message of an export.
message ExportAuditResponse {
  // Which it is. Exactly one is set: the header first, then entries and
  // checkpoints.
  oneof kind {
    // What checks the rest; the first message.
    AuditExportHeader header = 1;

    // A sealed entry.
    SealedAuditEntry entry = 2;

    // A checkpoint, after the last entry it covers.
    AuditCheckpoint checkpoint = 3;
  }
}

// GetAuditPublicKeyRequest asks for the audit public keys. It has no
// fields.
message GetAuditPublicKeyRequest {}

// GetAuditPublicKeyResponse is the audit public keys.
message GetAuditPublicKeyResponse {
  // This installation's id.
  string installation_id = 1;

  // This installation's keys, one per version of its installation key,
  // oldest first, the current one marked; then, once a tenant import
  // exists, those imports brought, ordered by installation id and version.
  repeated AuditPublicKey public_keys = 2;
}

// AuditSealStatus is how far a log is sealed, for a status.
message AuditSealStatus {
  // The seq of the last entry sealed; 0 for none.
  int64 last_seq = 1;

  // When the last checkpoint was made. Absent for a log never sealed.
  google.protobuf.Timestamp last_seal_time = 2;

  // The digest of the last checkpoint: 32 bytes; empty for none.
  bytes last_digest = 3;

  // The entries written and not sealed yet.
  int64 unsealed_entries = 4;
}
