syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package nopacs.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// SenderService adds, reads, changes, removes and tests a tenant's senders.
// A sender is a way for archived data to leave a tenant: one named
// destination, the peer (a PACS, an Orthanc, another archive), and how to
// reach it. What a sender sends, and when, is a job (JobService): a person
// asks for a subject, a session or a scan to be sent, or a receiver that
// names the sender in its forward_to sends each reception it completes. A
// sender sends nothing by itself.
//
// This version has two types. A DIMSE sender opens associations with the
// peer (PS3.8 upper layer, PS3.7 message exchange) and sends each instance
// by C-STORE (PS3.4 Annex B); it answers nothing the peer asks. A stow
// sender stores instances over HTTP into the peer's DICOMweb service
// (STOW-RS, PS3.18 10.5). Both send the archived bytes as they are stored:
// a DIMSE sender sends the data set in the transfer syntax its file names,
// on a presentation context that offers that one syntax; a stow sender
// sends the whole file (PS3.10 7.1). Nothing is decoded or re-encoded, so an
// instance whose syntax the peer does not take is refused for it, never
// sent in another syntax. Every byte sent is checked against the SHA-256
// and the length the catalog holds, and the last piece of an instance is
// held back until both match: an instance whose stored bytes are not what
// was archived never reaches the peer whole (JobFailureCode).
//
// Where a sender may send is the installation's to decide, not the
// tenant's, since a sender moves patient data out of the archive and a
// tenant's admin must not be able to use the server to reach into the
// network it sits in. Installation-only settings (SettingsService) hold
// it:
//
//   - sender.destinations: the destinations a tenant's sender may reach, one
//     per line: a host name, compared in lowercase, or a range of addresses
//     in CIDR form (RFC 4632, RFC 4291), then, separated by spaces,
//     "ports=" and the ports allowed, as ports and ranges separated by
//     commas ("ports=104,11112-11120"; every port when left out), and
//     "private-address" when a host name may resolve to a loopback,
//     link-local or private address (RFC 1918, RFC 4193, RFC 6598). Such as
//     "pacs.lab.example ports=4242" or "10.20.0.0/24 ports=104". Empty by
//     default, so no sender can be added until the installation's admin
//     fills it. A host is allowed when its name is listed, or when it is
//     an address a listed range holds; a range lists its addresses
//     explicitly, loopback, link-local and private ones included. Every
//     time a sender connects, the server resolves its host again and
//     connects only to an address the entry allows: a host name listed
//     without "private-address" that resolves to a loopback, link-local or
//     private address is refused, so a name that later resolves elsewhere,
//     such as to a cloud's metadata address, cannot carry the server's
//     connections into its own network. A value that would take away a
//     destination a sender of any tenant uses is refused (precondition),
//     and so is unsetting it; the sender is changed or removed first.
//   - sender.allow-plain-http: "true" to allow a stow sender's URL to be
//     http rather than https, "false" otherwise. Built-in default "false":
//     over http every instance and the sender's credential cross the
//     network unencrypted.
//   - sender.max-associations: the most associations (for a stow sender,
//     requests) all senders of all tenants hold open at once, from 1 to
//     1024. Built-in default "32". It bounds the server's own connections,
//     which tenants share.
//
// And one setting set on a tenant by the installation's admin only:
//
//   - sender.tenant-max-associations: the most associations (or requests)
//     the senders of one tenant hold open at once, from 1 to 1024; the
//     installation's value is the default for every tenant. Built-in
//     default "8". A sender's own max_associations is a bound within it.
//
// A rule that depends on what the installation allows is answered
// "precondition" when it fails: the same request may succeed once the
// installation allows it.
//
// A sender's health (SenderHealth) is the server's view of its peer: after
// three connections in a row that fail, the sender is down, and no work of
// its jobs is attempted while it is, so a peer down overnight uses none of
// a job's attempts; the server tries the peer again (C-ECHO, PS3.4 Annex A,
// or the stow probe of TestSender) after a wait that doubles from 10
// seconds to an hour, and the sender is up at the first answer. Each change
// of health is an event (EVENT_TYPE_SENDER_HEALTH).
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE. No
// answer of this service speaks of another tenant.
service SenderService {
  // AddSender adds a sender to a tenant. Adding connects to nothing:
  // TestSender tries the peer.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the sender's name as its
  // object, and its type and destination (host and port, or the URL's host
  // with its port when the URL names one) in details; never its credential.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), conflict (the tenant has a sender with that name, or a removed
  // sender of that name is still named by jobs), precondition (a host or
  // port sender.destinations does not allow; an http URL while
  // sender.allow-plain-http is false), unavailable (the tenant's database
  // does not answer, or the tenant is not ready).
  rpc AddSender(AddSenderRequest) returns (AddSenderResponse);

  // GetSender answers one sender of a tenant, with its health now. Its
  // credential is never answered: the answer says only whether one is set.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the sender's name as its
  // object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no sender with that name; a tenant that does
  // not exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc GetSender(GetSenderRequest) returns (GetSenderResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListSenders answers the senders of a tenant, ordered by name, each with
  // its health now and without its credential. A removed sender is not
  // listed.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc ListSenders(ListSendersRequest) returns (ListSendersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetSender changes some fields of a sender: those its update_mask names,
  // and no other. A credential the mask does not name is kept as it is, so
  // a change of max_associations does not need the credential sent again.
  // The change and its audit entry are written together or not at all. A
  // change applies to the next association or request; one open goes on
  // under the configuration it was opened with, and a work unit in flight
  // finishes its instance first. A change of the destination (a DIMSE
  // sender's host, port or TLS, a stow sender's URL or TLS) makes the
  // sender's health unknown until its next connection.
  //
  // A sender's type cannot change: a mask that names the other type's
  // configuration is invalid. A stow sender's credential is never sent to
  // a place it was not given for: a mask that names stow.url or
  // stow.authentication names stow.credential too, unless the
  // authentication becomes none, which clears the held credential. A mask
  // that breaks this rule is invalid.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the sender's name as its
  // object and the mask's paths in details; never a value of the
  // credential.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also an empty mask, a path that names no field, a read-only field or a
  // type's whole message, a path into the other type's configuration, a
  // URL or authentication without the credential, and every rule AddSender
  // checks on a field), not found (the tenant has no sender with that name;
  // a tenant that does not exist, for a caller who may list every tenant),
  // precondition (every precondition AddSender checks), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc SetSender(SetSenderRequest) returns (SetSenderResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RemoveSender removes a sender's configuration and its sealed
  // credential. It is refused while a receiver names it in forward_to, and
  // while a job to it is queued or running unless cancel_jobs is set: then
  // those jobs are canceled in the same transaction, as CancelJob cancels
  // one, and an association or request in flight ends within one batch (at
  // most 64 instances or one second). Its jobs stay, ended, and its name
  // stays held, and cannot be given to a new sender, while any job names
  // it, so a name in a record always means one sender. A repeated call
  // finds no sender and is answered NOT_FOUND; it removes nothing more.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the sender's name as its
  // object, and its type and the number of jobs canceled in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no sender with that name; a tenant that does
  // not exist, for a caller who may list every tenant), precondition (a
  // receiver forwards to it; a job to it is queued or running and
  // cancel_jobs is not set; the message says which), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc RemoveSender(RemoveSenderRequest) returns (RemoveSenderResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // TestSender tries the sender's peer as a send would reach it, and
  // reports each step; it sends no instance. A DIMSE sender: its host
  // resolved and checked against sender.destinations, a connection, the TLS
  // handshake when it has TLS, an association that proposes the
  // Verification SOP Class (PS3.4 Annex A), a C-ECHO, and the release. A
  // stow sender: its host resolved and checked, a connection, the TLS
  // handshake for https, and a request that stores nothing: a search for
  // studies, GET <url>/studies?limit=1 with Accept application/dicom+json
  // (QIDO-RS, PS3.18 10.6), which a DICOMweb service answers 200 or 204. It
  // passes only on a 2xx answer: a redirect fails it (it is not followed),
  // 404 fails it as a URL that does not name a DICOMweb service, 401, 403
  // and 407 as a credential the peer does not take, and a 5xx as a peer
  // failing. The step's detail names the HTTP status. A sender that
  // fails a step is a result, not an error: the method succeeds and the
  // failed step says why, from a fixed list; the steps after it are
  // answered skipped, except the release, which is tried whenever an
  // association was made. The test is the same for a disabled sender. It
  // changes nothing: not the sender's health, not its jobs, and it writes
  // no event.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the sender's name as its
  // object and whether every step passed in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no sender with that name; a tenant that does
  // not exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  // Limits: the whole test is bounded by the call's deadline; a step that
  // has not finished when it passes is answered failed, unreachable.
  rpc TestSender(TestSenderRequest) returns (TestSenderResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Sender is one destination a tenant's archived data may be sent to, and
// how to reach it. It never carries a secret in an answer.
message Sender {
  // The sender's name, unique in its tenant, and its id in this API. It
  // does not change. 1 to 57 characters, lowercase ASCII letters, digits and
  // hyphens, starting with a letter, and none of the device names Windows
  // reserves (con, prn, aux, nul, com0 to com9, lpt0 to lpt9): the rule of a
  // tenant's name, six characters shorter, since the server names the work
  // of the sender's jobs "send-<name>" within the 63 characters a kind of
  // work may have. A removed sender's name is not given to another while a
  // job names it.
  string name = 1;

  // The sender's type and the configuration of its protocol. Exactly one is
  // set; a sender with none is refused as invalid. A type added in a later
  // version is a new field of this oneof: a client that finds none of the
  // fields it knows set is reading a sender of a type it does not know, and
  // shows it as such.
  oneof type {
    // A DICOM peer reached by C-STORE.
    DimseSender dimse = 2;

    // A DICOMweb service reached by STOW-RS.
    StowSender stow = 3;
  }

  // Whether the sender sends. False, the default, keeps it stopped: its
  // jobs are queued and wait, using none of their attempts, until it is
  // enabled. So a sender sends only once it is enabled in so many words.
  bool enabled = 4;

  // The most associations (for a stow sender, requests) the sender holds
  // open at once, each sending one scan of a job at a time: 1 to 16. Zero
  // in AddSender means the default, 2, which is stored as the sender's
  // value. The tenant's sender.tenant-max-associations and the
  // installation's sender.max-associations bound all senders together.
  int32 max_associations = 5;

  // The most bytes per second the sender sends, over all its associations
  // or requests together, as an average over a few seconds: from 65536
  // (64 KiB/s) to 2^40. Zero for no bound of its own.
  int64 max_bytes_per_second = 6;

  // How long the server waits for a connection, the TLS handshake and, for
  // a DIMSE sender, the answer to its association request (the ARTIM timer,
  // PS3.8 9.1.5), before it counts the attempt as failed: a whole number of
  // seconds from 1 second to 5 minutes. Absent in AddSender means the
  // default, 30 seconds, which is stored as the sender's value.
  google.protobuf.Duration connect_timeout = 7;

  // How long the server waits for the peer's answer to one C-STORE, or to
  // one STOW-RS request once its body is sent, before it counts the
  // attempt as failed: a whole number of seconds from 5 seconds to 1 hour.
  // Absent in AddSender means the default, 5 minutes, which is stored as
  // the sender's value. A peer that takes longer is cut off, and what it
  // had not answered is sent again by the next attempt.
  google.protobuf.Duration response_timeout = 8;

  // Whether the sender reaches its peer now, and why not. Answered by the
  // server; ignored in a request.
  SenderHealth health = 9;

  // When the sender was added. Answered by the server; ignored in a
  // request.
  google.protobuf.Timestamp create_time = 10;

  // When its configuration last changed: its create_time until the first
  // SetSender. Answered by the server; ignored in a request.
  google.protobuf.Timestamp update_time = 11;
}

// DimseSender is a DICOM peer the server opens associations with, as the
// requester (PS3.8 7.1), and sends instances to by C-STORE. Each association
// proposes one presentation context for each pair of SOP class and stored
// transfer syntax among the instances of the scan it sends, each with that
// one syntax (PS3.8 9.3.2.2). An instance whose context the peer rejects is
// refused for it (JOB_FAILURE_CODE_CLASS_NOT_ACCEPTED or
// JOB_FAILURE_CODE_SYNTAX_NOT_ACCEPTED); the others are sent. DIMSE user
// identity (PS3.7 D.3.3.7) is not offered: without TLS it crosses the
// network in clear.
message DimseSender {
  // The peer's host: a DNS name of 1 to 253 bytes (RFC 1123), or an IPv4
  // address in dotted form or an IPv6 address in the form of RFC 5952,
  // without a zone or brackets. Required. It and port must be allowed by
  // the installation's sender.destinations, or it is a precondition
  // failure; a name is resolved again at each connection and checked again.
  string host = 1;

  // The peer's TCP port, from 1 to 65535. Required.
  int32 port = 2;

  // The peer's AE title: the Called AE Title of each association (PS3.8
  // 9.3.2). Required; 1 to 16 characters of printable ASCII other than
  // backslash, not only spaces (PS3.5 6.2, value representation AE).
  // Leading and trailing spaces are not significant and are removed.
  string called_ae_title = 3;

  // The AE title the server calls with: the Calling AE Title of each
  // association (PS3.8 9.3.2), which the peer commonly admits by. Required;
  // the same rule as called_ae_title.
  string calling_ae_title = 4;

  // TLS for the sender's associations (PS3.15 B.9, BCP 195). Absent for
  // none: associations are then in plain TCP, and every instance crosses
  // the network unencrypted, which is fit only for a network the site
  // trusts. With TLS a DIMSE sender's ca_file is required.
  SenderTls tls = 5;
}

// StowSender is a DICOMweb service the server stores instances into by
// STOW-RS (PS3.18 10.5): a POST of multipart/related;
// type="application/dicom" (PS3.18 10.5.1.1.1) to <url>/studies, each part
// one archived file as it is stored, the body streamed as it is read. A
// request carries instances of one scan of a job, at most
// max_instances_per_request of them and at most max_request_bytes, except
// that an instance larger than that is sent alone in its own request.
//
// The answer (PS3.18 10.5.3) is read instance by instance: one listed in
// its Referenced SOP Sequence (0008,1199) is sent, with a warning when it
// has a Warning Reason (0008,1196); one listed in its Failed SOP Sequence
// (0008,1198) is refused, with its Failure Reason (0008,1197); one listed
// in neither is sent once more later in the same scan's sending, and then
// refused as JOB_FAILURE_CODE_PEER_UNACCOUNTED. A 5xx answer, 408, 429, a
// connection cut or a timeout is a failure of the whole request, tried
// again later (JobService).
//
// An answer of 401, 403 or 407 says the peer does not take the
// credential: it refuses no instance, and is a connection that failed
// (SENDER_FAULT_REJECTED), counted toward the sender's health like one
// that could not be made, so a credential that is mended sends what was
// held back. An answer of 404 says the URL names no DICOMweb service, and
// a redirect is not followed: each is likewise a failure of the sender
// (SENDER_FAULT_WRONG_ANSWER), never a refusal of the instances, so a
// mistyped URL that is mended sends what was held back. Another 4xx
// answer to the whole request, with no account of each instance, refuses
// its instances as JOB_FAILURE_CODE_PEER_REFUSED with the HTTP status.
message StowSender {
  // The base URL of the peer's DICOMweb service, such as
  // "https://pacs2.lab.example/dicom-web"; requests go to <url>/studies.
  // Required; at most 2048 bytes; https, or http only while the
  // installation's sender.allow-plain-http is true (a precondition failure
  // otherwise); no user information, query or fragment, which are refused
  // as invalid. Its host and port (443 or 80 when it names none) must be
  // allowed by sender.destinations, or it is a precondition failure; the
  // host is resolved again at each connection and checked again. A
  // redirect in an answer is not followed: it fails the request.
  string url = 1;

  // How each request proves who sends it. Required: STOW_AUTHENTICATION_NONE
  // is stated in so many words, never what an absent value means.
  StowAuthentication authentication = 2;

  // The user name of basic authentication (RFC 7617): 1 to 256 bytes of
  // printable ASCII without a colon. Required with
  // STOW_AUTHENTICATION_BASIC, and empty otherwise. It names the
  // credential and is not a secret: it is answered.
  string username = 3;

  // The name of the header field that carries the credential with
  // STOW_AUTHENTICATION_HEADER, such as "X-Api-Key": 1 to 64 characters of
  // a field name's token (RFC 9110 5.1), not one the server writes itself
  // or one that frames the request (Authorization, Host, Content-Type,
  // Content-Length, Transfer-Encoding, Connection, Accept, Cookie, and any
  // starting with "Proxy-"), compared without case. Required with that
  // authentication, and empty otherwise. Not a secret: it is answered.
  string header_name = 4;

  // SECRET. The credential: the password of basic authentication, the
  // token of bearer authentication (RFC 6750, sent as "Authorization:
  // Bearer <token>"), or the value of the named header; 1 to 4096 bytes of
  // visible ASCII and spaces, not starting or ending with a space. Required
  // by AddSender with an authentication other than none, and empty with
  // none. It only comes in: the server seals it with the installation key,
  // and no answer, log, event, error or audit entry ever holds it; it is
  // always empty in an answer, and credential_set says whether one is held.
  // SetSender keeps the held credential unless its mask names
  // stow.credential, and then the new one must not be empty, unless the
  // authentication becomes none. The debug_redact mark is read by the
  // server's redactor; the protobuf library itself still prints the field.
  string credential = 5 [debug_redact = true];

  // Whether the server holds a credential for this sender. Answered by the
  // server; ignored in a request.
  bool credential_set = 6;

  // The TLS settings of an https URL. Absent: the peer's certificate is
  // verified against the server's system roots, and no client certificate
  // is offered. Refused as invalid with an http URL.
  SenderTls tls = 7;

  // The most instances in one request: 1 to 1000. Zero in AddSender means
  // the default, 64, which is stored as the sender's value.
  int32 max_instances_per_request = 8;

  // The most bytes of files in one request, from 1048576 (1 MiB) to 2^36
  // (64 GiB). Zero in AddSender means the default, 2^28 (256 MiB), which is
  // stored as the sender's value. An instance larger than this is sent
  // alone.
  int64 max_request_bytes = 9;
}

// StowAuthentication is how a stow sender's requests prove who sends them.
// A kind added in a later version is a new value.
enum StowAuthentication {
  // Not a kind; refused as invalid.
  STOW_AUTHENTICATION_UNSPECIFIED = 0;

  // No credential is sent.
  STOW_AUTHENTICATION_NONE = 1;

  // Basic authentication (RFC 7617): username and the credential as its
  // password.
  STOW_AUTHENTICATION_BASIC = 2;

  // A bearer token (RFC 6750): the credential.
  STOW_AUTHENTICATION_BEARER = 3;

  // The credential as the value of the header field header_name names.
  STOW_AUTHENTICATION_HEADER = 4;
}

// SenderTls is how a sender verifies its peer, and the certificate it shows
// when the peer asks for one. The peer's certificate is always verified:
// turning verification off is not offered; a private authority is named in
// ca_file instead. Each file is one the server reads; no file's content
// ever crosses the API. Each is named by a file name in the tenant's TLS
// directory on the server, <data directory>/tls/<tenant>/, which a person
// with access to the server fills, so a tenant's admin cannot point TLS at
// files nobody placed there: 1 to 255 bytes of ASCII letters, digits, ".",
// "_" and "-", not starting with a dot. A file that cannot be read or does
// not hold what it should fails the connection with
// SENDER_FAULT_TLS_FAILED.
message SenderTls {
  // The file of the certificates of the authorities the peer's certificate
  // must chain to, in PEM form. Required for a DIMSE sender. Empty for a
  // stow sender: the server's system roots.
  string ca_file = 1;

  // The file of the certificate chain the server shows the peer, in PEM
  // form, its own certificate first. Empty for none; given with
  // private_key_file or not at all.
  string certificate_file = 2;

  // The file of that certificate's private key, in PEM form. Empty for
  // none; given with certificate_file or not at all.
  string private_key_file = 3;

  // The name the peer's certificate must be issued for (RFC 6125). Empty
  // for the host of the sender (a DIMSE sender's host, a stow sender's
  // URL's host); given for a host written as an address whose certificate
  // names it otherwise. At most 253 bytes, a DNS name.
  string server_name = 4;
}

// SenderState is whether a sender reaches its peer now.
enum SenderState {
  // Never answered by the server. A client that reads it was built against
  // an older contract than the server's.
  SENDER_STATE_UNSPECIFIED = 0;

  // The server has not connected to the peer since the sender was added,
  // its destination changed or the server started. Its jobs' work is
  // attempted as for an up sender.
  SENDER_STATE_UNKNOWN = 1;

  // The last connection succeeded.
  SENDER_STATE_UP = 2;

  // No work of its jobs is attempted; the down reason says why.
  SENDER_STATE_DOWN = 3;
}

// SenderDownReason is why a sender is down. A reason added in a later
// version is a new value; a client shows a value it does not know as down
// for a reason it cannot name, with the health's detail.
enum SenderDownReason {
  // Not down, or never answered for a down sender.
  SENDER_DOWN_REASON_UNSPECIFIED = 0;

  // Its enabled field is false.
  SENDER_DOWN_REASON_DISABLED = 1;

  // Three connections in a row failed, the last for the fault in the
  // health's fault. The server tries the peer again after a wait
  // (next_try_time).
  SENDER_DOWN_REASON_PEER_FAILING = 2;

  // The tenant is not ready, so nothing sent could be recorded. It is up
  // again, or unknown, when the tenant is ready.
  SENDER_DOWN_REASON_TENANT_NOT_READY = 3;

  // The server is stopping.
  SENDER_DOWN_REASON_STOPPING = 4;

  // A cause none of the others names; the detail says what.
  SENDER_DOWN_REASON_OTHER = 5;
}

// SenderFault is why a connection to a sender's peer, or a step of
// TestSender, failed, from a fixed list. The peer's own words are never
// answered: a sender pointed at an address that is not a DICOM or DICOMweb
// peer cannot be used to read what that address says. A fault added in a
// later version is a new value.
enum SenderFault {
  // No fault. Answered for a step or a connection that did not fail.
  SENDER_FAULT_UNSPECIFIED = 0;

  // The peer could not be reached in time: the name did not resolve, no
  // connection, or no answer within the sender's timeouts.
  SENDER_FAULT_UNREACHABLE = 1;

  // The host resolved to an address the installation's sender.destinations
  // does not allow; nothing was sent to it.
  SENDER_FAULT_ADDRESS_NOT_ALLOWED = 2;

  // The TLS handshake failed: the peer's certificate does not verify or is
  // not issued for the name, it refused the server's certificate, or a TLS
  // file of the sender cannot be read or does not hold what it should.
  SENDER_FAULT_TLS_FAILED = 3;

  // The peer rejected the association (A-ASSOCIATE-RJ, PS3.8 9.3.4), such
  // as for an AE title it does not know; the detail names the reason the
  // peer gave, in the words of PS3.8 9.3.4. For a stow sender, the
  // peer answered 401, 403 or 407: it does not take the credential.
  SENDER_FAULT_REJECTED = 4;

  // The peer accepted the association but none of the presentation
  // contexts proposed (PS3.8 9.3.3.2), or it answered C-ECHO with a status
  // other than success.
  SENDER_FAULT_NOT_ACCEPTED = 5;

  // The peer answered something the protocol does not allow, aborted the
  // association (A-ABORT, PS3.8 9.3.8), or, for a stow sender, answered a
  // 5xx, a redirect, 404 (the URL names no DICOMweb service) or a body that
  // is not what PS3.18 10.5.3 describes.
  SENDER_FAULT_WRONG_ANSWER = 6;
}

// SenderHealth is whether a sender reaches its peer now, and why not.
message SenderHealth {
  // Its state.
  SenderState state = 1;

  // Why it is down. SENDER_DOWN_REASON_UNSPECIFIED unless state is down.
  SenderDownReason down_reason = 2;

  // The fault of the last connection that failed, while the sender is down
  // for it or the connections since have failed too.
  // SENDER_FAULT_UNSPECIFIED after a connection that succeeded.
  SenderFault fault = 3;

  // More about the state, in words for a person, from a fixed set of
  // phrases the server has for each reason and fault, such as "certificate
  // expired" or "called-AE-title-not-recognized"; at most 256 bytes. Empty
  // when it is up. It is never the peer's, the operating system's or a
  // library's own text, and never holds a secret or a path.
  string detail = 4;

  // When it entered this state with this reason.
  google.protobuf.Timestamp since = 5;

  // The connections in a row that failed, up to now: 0 after one that
  // succeeded.
  int32 failed_connections = 6;

  // When the server tries a down peer again. Absent unless the down reason
  // is SENDER_DOWN_REASON_PEER_FAILING.
  google.protobuf.Timestamp next_try_time = 7;

  // When a connection to the peer last succeeded. Absent when none has
  // since the server started.
  google.protobuf.Timestamp last_success_time = 8;
}

// SenderTestStep is one step of TestSender.
enum SenderTestStep {
  // Not a step. Never answered by the server.
  SENDER_TEST_STEP_UNSPECIFIED = 0;

  // The host is resolved and each address checked against the
  // installation's sender.destinations.
  SENDER_TEST_STEP_RESOLVE = 1;

  // A TCP connection is opened.
  SENDER_TEST_STEP_CONNECT = 2;

  // The TLS handshake. Answered skipped for a sender without TLS.
  SENDER_TEST_STEP_TLS = 3;

  // A DIMSE sender's association is requested, proposing the Verification
  // SOP Class. Answered skipped for a stow sender.
  SENDER_TEST_STEP_ASSOCIATE = 4;

  // A DIMSE sender's C-ECHO, or a stow sender's request that stores
  // nothing.
  SENDER_TEST_STEP_REQUEST = 5;

  // A DIMSE sender's association is released (A-RELEASE, PS3.8 7.2).
  // Answered skipped for a stow sender.
  SENDER_TEST_STEP_RELEASE = 6;
}

// SenderTestOutcome is how one step of TestSender ended.
enum SenderTestOutcome {
  // Never answered by the server.
  SENDER_TEST_OUTCOME_UNSPECIFIED = 0;

  // The step did what it should.
  SENDER_TEST_OUTCOME_PASSED = 1;

  // The step did not; the result's fault says why.
  SENDER_TEST_OUTCOME_FAILED = 2;

  // The step was not tried, because a step it needs failed, or it does not
  // apply to the sender's type or configuration.
  SENDER_TEST_OUTCOME_SKIPPED = 3;
}

// SenderTestResult is the outcome of one step of TestSender.
message SenderTestResult {
  // The step.
  SenderTestStep step = 1;

  // How it ended.
  SenderTestOutcome outcome = 2;

  // How long it took. Absent for a skipped step.
  google.protobuf.Duration duration = 3;

  // Why a failed step failed. SENDER_FAULT_UNSPECIFIED for another outcome.
  SenderFault fault = 4;

  // More about the outcome, from a fixed set of phrases as in
  // SenderHealth.detail: for a rejected association its reason (PS3.8
  // 9.3.4), for contexts not accepted their result (PS3.8 9.3.3.2), for a C-ECHO its status in hexadecimal (PS3.7 Annex C), for a stow
  // request its HTTP status. At most 256 bytes; empty when there is no
  // more to say.
  string detail = 5;
}

// AddSenderRequest is the sender to add.
message AddSenderRequest {
  // The tenant to add it to, by name. Required.
  string tenant = 1;

  // The sender. Its name and type are required, with what its type's
  // message requires; health, create_time, update_time and credential_set
  // are ignored.
  Sender sender = 2;
}

// AddSenderResponse is the sender added.
message AddSenderResponse {
  // The sender, as stored, with every default filled in, without its
  // credential, and its health now.
  Sender sender = 1;
}

// GetSenderRequest names a sender.
message GetSenderRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The sender's name. Required.
  string name = 2;
}

// GetSenderResponse is the sender named.
message GetSenderResponse {
  // The sender, without its credential, with its health now.
  Sender sender = 1;
}

// ListSendersRequest asks for a page of a tenant's senders.
message ListSendersRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The most senders to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 2;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant other than the
  // one it was made with.
  string page_token = 3;
}

// ListSendersResponse is a page of senders.
message ListSendersResponse {
  // The senders of this page, without their credentials, each with its
  // health now.
  repeated Sender senders = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// SetSenderRequest is the change to a sender.
message SetSenderRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The sender with the new values of the fields update_mask names. Its
  // name is required and names the sender to change; it is not itself
  // changed. Fields the mask does not name are ignored.
  Sender sender = 2;

  // The fields to change, as paths of Sender, such as "enabled" or
  // "max_associations", or a field of the sender's type joined to it by a
  // dot, such as "dimse.host", "dimse.tls" or "stow.credential". A path that
  // names a type's whole message ("dimse", "stow") is refused: its fields
  // are named one by one, so a credential is never replaced by leaving it
  // out; so is a field of another type than the sender's, since a sender's
  // type does not change. "stow.url" and "stow.authentication" are each
  // named with "stow.credential", unless the authentication becomes none.
  // Required and not empty; "*" is refused, so every field a call changes
  // is named. A named field is set to the value given, its zero value
  // included ("dimse.tls" with tls absent turns TLS off, and
  // "max_bytes_per_second" with zero removes the bound), except the
  // credential, which must not be empty while an authentication needs it.
  // A duration, max_associations or a size of a stow sender named with no
  // value is refused as invalid; it is not reset to the default.
  google.protobuf.FieldMask update_mask = 3;
}

// SetSenderResponse is the sender as changed.
message SetSenderResponse {
  // The sender, as stored, without its credential, and its health now.
  Sender sender = 1;
}

// RemoveSenderRequest names the sender to remove.
message RemoveSenderRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The sender's name. Required.
  string name = 2;

  // Whether to cancel the sender's jobs that are queued or running, in the
  // same transaction as the removal. False refuses the removal while any
  // is (precondition), so a removal never ends a send that nobody asked
  // to end.
  bool cancel_jobs = 3;
}

// RemoveSenderResponse is the configuration that was removed.
message RemoveSenderResponse {
  // The sender as it was, without its credential.
  Sender sender = 1;

  // How many of its jobs the removal canceled: 0 unless cancel_jobs was
  // set.
  int64 jobs_canceled = 2;
}

// TestSenderRequest names the sender to test.
message TestSenderRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The sender's name. Required.
  string name = 2;
}

// TestSenderResponse is the outcome of each step of the test.
message TestSenderResponse {
  // Whether every step that applies to the sender passed.
  bool passed = 1;

  // One result per step, in the order the steps ran: resolve, connect, TLS,
  // associate, request, release.
  repeated SenderTestResult results = 2;
}
