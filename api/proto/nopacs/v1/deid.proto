syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package nopacs.v1;

import "google/protobuf/timestamp.proto";
import "nopacs/v1/job.proto";
import "nopacs/v1/profile.proto";

// DeidService reaches what a tenant's de-identification keeps that is
// keyed by an original value: the codes the tenant's naming key gives a
// value (the keyed hash a naming rule's {#X} and a profile's hash action
// write), and its lookup tables, from the keyed hash of a value to the
// code a lookup action writes in its place.
//
// The archive holds no map back from a code to the value it replaces:
// labels and hashed values are keyed hashes, and a lookup table is keyed
// by the keyed hash of each value, never the value. What this service
// gives is the forward way only: from a value a caller already has (a
// Patient ID, from a person who withdraws consent) to where that value's
// data is in the archive. Even so, each answer joins an identity to its
// pseudonym, so it is for an admin alone, one value at a time, at a
// bounded rate, and every call is in the audit log, without the value: its
// entry is written before the answer is sent, and a call whose entry
// cannot be written is refused. No method of this service that takes a
// value is served over HTTP GET, so a value never travels in a URL.
//
// The service also holds the tenant's coverage report, the elements of
// archived files that no rule of a profile named, which holds no value.
//
// A value given to this service is the caller's own data: each is marked
// debug_redact, and no log line, audit entry, event or error carries one.
// Every method acts inside one tenant, named by the request's tenant
// field, so a request into a tenant that is not ready is answered
// UNAVAILABLE.
service DeidService {
  // Code answers the codes the archive gives one value of one attribute:
  // the keyed hash of the value under the tenant's naming key (what a
  // naming rule's {#X} puts in a label and a profile's hash action
  // writes); for each receiver whose naming rule makes the subject label
  // from that attribute's keyed hash alone, the subject label it gives the
  // value and whether the catalog holds a subject of that label; and, for
  // each lookup table of the tenant that holds a code for the value, that
  // code. It is how a person finds a subject's data from its Patient ID,
  // for a withdrawal of consent, without the archive keeping a way back.
  //
  // A Patient ID is unique only within its issuer (PS3.3 C.7.1.1), so for
  // attribute PatientID what is hashed is the subject identity: the
  // Patient ID with the issuer the request gives, or, with none, with a
  // namespace (Receiver.namespace). A Patient ID with no issuer under the
  // default namespace hashes as its value alone. A receiver whose subject
  // label is the default {#SubjectIdentity} is answered with the label it
  // gives that identity, under its own namespace when no issuer is given;
  // one whose rule a site wrote with {#PatientID} with the keyed hash of
  // the Patient ID alone.
  //
  // The value is read as a file's element would be: its padding removed
  // as PS3.5 6.2 says for the attribute's VR (trailing spaces and NULs,
  // and leading spaces for the VRs whose leading spaces are not
  // significant), then hashed (HMAC-SHA-256 under the naming key, its
  // first 80 bits in lower case base32). A value with a character set
  // other than UTF-8 in the file is given as its UTF-8 text.
  //
  // One value per call, and at most 60 calls a minute by one key, for
  // every tenant together, and 60 a minute into one tenant, by every key
  // together (each a bucket of 60 that fills again at one a second), so a
  // bulk re-identification is slow and stands out in the log; past either
  // the call is refused as exhausted, and counts again once the bucket has
  // filled. A call refused for its bound spends nothing.
  //
  // Not served over HTTP GET (it has no idempotency level), since a GET
  // carries its request in the URL, which proxies log and browsers repeat.
  //
  // A masked key (Key.masked) is refused, whatever its role: the answer
  // joins an identity to its pseudonym.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the attribute's tag as its
  // object and, in details, the number of subject labels and lookup codes
  // answered; never the value. The entry of every call into a ready tenant,
  // answered or refused, is written before the answer, as a change's is,
  // never batched or dropped; a call whose entry cannot be written is
  // answered unavailable, without its codes.
  // Errors: unauthenticated, permission denied (no grant; also a tenant
  // that does not exist, for a caller who may not list every tenant),
  // invalid (an attribute that is not a keyword or tag of a standard
  // element; a value empty after its padding is removed, or longer than
  // 1024 bytes, or not UTF-8; a value of a UID attribute that is not a
  // UID), not found (a tenant that does not exist, for a caller who may
  // list every tenant), exhausted (the key's 60 calls a minute, or the tenant's, are used),
  // unavailable (the tenant's database does not answer, or the tenant is
  // not ready, or the audit entry cannot be written).
  rpc Code(CodeRequest) returns (CodeResponse);

  // ImportLookupCodes fills a lookup table with codes a person chose: for
  // each entry, the code that replaces its value wherever a lookup action
  // of that table meets it. Each value is stored as its keyed hash under
  // the tenant's naming key, never as given, with its padding removed as
  // for an LO value (trailing spaces and NULs, and leading spaces). The
  // table is made by its first code.
  //
  // All or nothing: every entry is stored, in one transaction, or none.
  // An entry whose value the table already gives the same code is counted
  // unchanged. Refused, storing nothing: a code not of a code's form; a
  // value given twice with two codes, or a code given to two values (each
  // the request's own fault, named by the entry's position from 1); and
  // entries that conflict with the table: a value it already gives another
  // code, or a code it already gives another value. A conflict is answered
  // by how many entries conflict, never which, so an import is no way to
  // learn whether a given value is in the table. A code a table later
  // assigns in order on first sight passes over every code it holds, so an
  // imported code is never given again.
  //
  // At most 10 imports an hour by one key (a bucket of 10 that fills again
  // at one each 6 minutes), whether they store or not; past it the call is
  // refused as exhausted.
  //
  // A masked key (Key.masked) is refused, whatever its role: an import of
  // one entry tells whether the table holds its value.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the table as its object and,
  // in details, the number of entries, how many were added and how many
  // were unchanged, or how many conflicted; never a value or a code. The
  // entry of an import that stores is written with the codes; the entry of
  // one refused after its tenant was found is written before the answer,
  // never batched or dropped; an import whose entry cannot be written is
  // answered unavailable.
  // Errors: unauthenticated, permission denied (no grant; also a tenant
  // that does not exist, for a caller who may not list every tenant),
  // invalid (a malformed table; no entry, or more than 10000; a value
  // empty after its padding is removed, longer than 1024 bytes or not
  // UTF-8; a code that is not 1 to 16 of A-Z, 0-9 and "_"; a value given
  // twice with two codes, or a code given to two values; each names the
  // entry by its position, from 1), not found (a tenant that does not
  // exist, for a caller who may list every tenant), precondition (entries
  // conflict with the table, answered by their count), exhausted (the
  // key's 10 imports an hour are used), unavailable (the tenant's database
  // does not answer, the tenant is not ready, or the audit entry cannot be
  // written).
  rpc ImportLookupCodes(ImportLookupCodesRequest) returns (ImportLookupCodesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListLookupTables answers a tenant's lookup tables, by name in byte
  // order, each with how many codes it holds; no value and no code.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log.
  // Errors: unauthenticated, permission denied (no grant; also a tenant
  // that does not exist, for a caller who may not list every tenant),
  // invalid, not found (a tenant that does not exist, for a caller who may
  // list every tenant), unavailable (the tenant's database does not
  // answer, or the tenant is not ready).
  rpc ListLookupTables(ListLookupTablesRequest) returns (ListLookupTablesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetCoverage answers the tenant's coverage report: every public element
  // and every private element (by its private creator and its element
  // within the creator's block) that files archived by a receiver that
  // de-identifies held, as received, and that no rule of the profile named,
  // so the profile's default decided it (a private element removed, any
  // other as the profile's unnamed says). For each, its VR as the file gave
  // it, how many instances held it and how many times in all. It is what a
  // profile never decided, the private elements a vendor writes among them,
  // and a person reads it to name the ones that matter.
  //
  // The report holds no value of any file, and nothing a value could be
  // read from but a private creator, which is a vendor's name written in
  // the file. A creator that is not printable ASCII of at most 64 bytes, or
  // that holds a value the profile removed from the file or a term of its
  // text lists, is never given: its elements are counted under
  // creator_withheld. For that reason a masked key may read the report.
  //
  // It is made by RefreshCoverage, from what each instance's metadata line
  // records; the answer is the report of the latest job that ended, with
  // when it ended and what it read, and the job that is making the next one
  // when there is one. An instance archived before the line recorded this,
  // or as received, is counted in the report's instances but not in
  // instances_recorded, and contributes no element. Elements are in order
  // of tag, then creator, then VR.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log.
  // Errors: unauthenticated, permission denied (no grant; also a tenant
  // that does not exist, for a caller who may not list every tenant),
  // invalid (a page_size that is negative or past 1000, a page_token that
  // is not one of this call), not found (a tenant that does not exist, for
  // a caller who may list every tenant), unavailable (the tenant's database
  // does not answer, or the tenant is not ready).
  rpc GetCoverage(GetCoverageRequest) returns (GetCoverageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RefreshCoverage makes the job (kind deid_coverage) that builds the
  // coverage report again: it reads each scan's metadata file once, line by
  // line within the reader's bounds, and counts the elements each line
  // records as unnamed, then replaces the stored report when it ends. It
  // writes the tenant's database only; it reads storages, never writes one,
  // and never reads an instance's file. A scan whose metadata cannot be
  // read is counted skipped, and the job ends partial. A restart goes on
  // after the last page of scans written, so no scan is counted twice.
  // One runs at a time for a tenant, and none while a rebuild runs. As for
  // every job, the operator role is enough.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant
  // that does not exist, for a caller who may not list every tenant), not
  // found (a tenant that does not exist, for a caller who may list every
  // tenant), precondition (a coverage job not ended; a rebuild running),
  // unavailable (the tenant's database does not answer, or the tenant is
  // not ready).
  rpc RefreshCoverage(RefreshCoverageRequest) returns (RefreshCoverageResponse);

  // AddPixelTemplates stores pixel templates in the tenant: for a device
  // (manufacturer and model, compared with case folded) and an image size
  // (rows and columns, exactly) and, optionally, a SOP class, the rectangles
  // of the image that burned-in text is drawn in. A pixel rule of a profile
  // whose action is redact_by_template fills the rectangles of the template
  // that fits the file's header as received, and holds an image at risk of
  // burned-in text that no template fits (deid_failed, cause
  // "no_pixel_template"). The table is empty until an admin fills it: the
  // server ships none, since which rectangles hold text is for the site to
  // know of its own devices.
  //
  // All or nothing: every template is stored in one transaction, or none.
  // Refused, storing nothing: a template whose manufacturer or model is
  // empty after its padding, is longer than 256 bytes or not UTF-8 without
  // control characters; rows or columns not 1 to 65535; a SOP class that is
  // not a UID; no rectangle or more than 64; a rectangle with a negative
  // position, a side not 1 to 65535, or reaching past the image's size,
  // measured from the edge it names; two templates of one device, size and
  // SOP class in the request, or one the tenant already holds (precondition:
  // remove it first), each named by its position from 1. A tenant holds at
  // most 10000 templates, and a request carries 1 to 1000.
  //
  // A masked key (Key.masked) is refused, whatever its role: a template is
  // part of what removes identity from images, and is changed only by a
  // person who may see them.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the number of templates in
  // its details, written with the templates; an entry of a request refused
  // after its tenant was found is written before the answer.
  // Errors: unauthenticated, permission denied (no grant, a masked key; also
  // a tenant that does not exist, for a caller who may not list every
  // tenant), invalid, not found (a tenant that does not exist, for a caller
  // who may list every tenant), precondition (a template held already; the
  // bound of 10000 passed), unavailable (the tenant's database does not
  // answer, the tenant is not ready, or the audit entry cannot be written).
  rpc AddPixelTemplates(AddPixelTemplatesRequest) returns (AddPixelTemplatesResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RemovePixelTemplate removes the template of one device, size and SOP
  // class. Images that matched it are held (cause "no_pixel_template") when
  // they are at risk of burned-in text, from the next file on.
  //
  // A masked key is refused, as for AddPixelTemplates.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the template's key as its
  // object.
  // Errors: unauthenticated, permission denied (no grant, a masked key),
  // invalid (a key that names no template: no manufacturer or model, rows or
  // columns not 1 to 65535, a SOP class that is not a UID), not found (the
  // tenant has no such template; also a tenant that does not exist, for a
  // caller who may list every tenant), unavailable.
  rpc RemovePixelTemplate(RemovePixelTemplateRequest) returns (RemovePixelTemplateResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListPixelTemplates answers a page of the tenant's pixel templates, in
  // order of manufacturer, model, rows, columns and SOP class, each as it was
  // written.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log.
  // Errors: unauthenticated, permission denied (no grant; also a tenant
  // that does not exist, for a caller who may not list every tenant),
  // invalid, not found (a tenant that does not exist, for a caller who may
  // list every tenant), unavailable.
  rpc ListPixelTemplates(ListPixelTemplatesRequest) returns (ListPixelTemplatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// PixelTemplate is the part of an image of one device and size to fill.
message PixelTemplate {
  // Manufacturer (0008,0070) of the device, as written; compared with case
  // folded and the padding of a DICOM value removed. Required.
  string manufacturer = 1;

  // Manufacturer's Model Name (0008,1090), compared as the manufacturer is.
  // Required.
  string model = 2;

  // The image's Rows (0028,0010), matched exactly: 1 to 65535.
  int32 rows = 3;

  // The image's Columns (0028,0011), matched exactly: 1 to 65535.
  int32 columns = 4;

  // The SOP Class UID the template is for, or empty for any class. A
  // template of the file's class is used before one for any class.
  string sop_class = 5;

  // What is filled, in every frame: 1 to 64 rectangles, each inside the
  // image's size.
  repeated PixelRectangle rectangles = 6;
}

// AddPixelTemplatesRequest is the templates to store.
message AddPixelTemplatesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The templates: 1 to 1000.
  repeated PixelTemplate templates = 2;
}

// AddPixelTemplatesResponse says what was stored.
message AddPixelTemplatesResponse {
  // How many templates were stored.
  int32 added = 1;
}

// RemovePixelTemplateRequest names the template to remove by its match
// keys.
message RemovePixelTemplateRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The template's manufacturer, compared with case folded. Required.
  string manufacturer = 2;

  // The template's model, compared with case folded. Required.
  string model = 3;

  // The template's rows, 1 to 65535.
  int32 rows = 4;

  // The template's columns, 1 to 65535.
  int32 columns = 5;

  // The template's SOP class, or empty for the template of any class.
  string sop_class = 6;
}

// RemovePixelTemplateResponse is empty: the template is gone.
message RemovePixelTemplateResponse {}

// ListPixelTemplatesRequest asks for a page of a tenant's pixel templates.
message ListPixelTemplatesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The most templates to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 2;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant other than the
  // one it was made with.
  string page_token = 3;
}

// ListPixelTemplatesResponse is a page of pixel templates.
message ListPixelTemplatesResponse {
  // The templates of this page.
  repeated PixelTemplate templates = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// GetCoverageRequest asks for a page of the coverage report.
message GetCoverageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The most elements to answer: zero means 500; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 2;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant other than the
  // one it was made with.
  string page_token = 3;
}

// GetCoverageResponse is a page of the coverage report.
message GetCoverageResponse {
  // What the report was made from. Absent when no job has ended yet.
  CoverageReport report = 1;

  // The job that is making the next report, while one is not ended. Absent
  // otherwise.
  Job refreshing = 2;

  // The elements of this page, in order of tag, then creator, then VR.
  repeated CoverageElement elements = 3;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 4;
}

// CoverageReport says what a coverage report was made from.
message CoverageReport {
  // The id of the job that made it.
  string job_id = 1;

  // When the job ended.
  google.protobuf.Timestamp end_time = 2;

  // How many scans the job read.
  int64 scans_read = 3;

  // How many scans it could not read (their metadata was missing or not in
  // its form), which make the report partial.
  int64 scans_skipped = 4;

  // How many instances' lines it read.
  int64 instances = 5;

  // How many of those lines recorded their unnamed elements.
  int64 instances_recorded = 6;

  // How many of those recorded only the first 1024 distinct ones (the rest
  // are counted, not listed, in elements_not_listed).
  int64 instances_capped = 7;

  // How many occurrences of elements the job could not list: those past a
  // line's 1024 distinct elements, and those of a distinct element past the
  // 100,000 the report holds.
  int64 elements_not_listed = 8;

  // How many distinct elements the report lists, all pages together.
  int64 distinct_elements = 9;
}

// CoverageElement is one element no rule named, in files of the tenant.
message CoverageElement {
  // The element's tag as "gggg,eeee" in upper case hexadecimal; for a
  // private element its group and its element within its creator's block,
  // as "gggg,xxee": the block number, which a file chooses (PS3.5 7.8.1),
  // is written xx.
  string tag = 1;

  // Whether it is a private element (an odd group).
  bool private = 2;

  // The private creator of a private element's block, without padding;
  // empty for a standard element, for a private element whose block has no
  // creator, and when creator_withheld.
  string private_creator = 3;

  // Whether the creator is not given: it was not printable ASCII of at most
  // 64 bytes, or held a value the profile removed from the file or a term of
  // its text lists. The elements of every such creator are counted together
  // for one tag and VR.
  bool creator_withheld = 4;

  // The VR as the file gave it ("UN" for a private element of a file in
  // Implicit VR).
  string vr = 5;

  // How many instances held it.
  int64 instances = 6;

  // How many times they held it in all, at any depth of sequences.
  int64 occurrences = 7;
}

// RefreshCoverageRequest asks for a new coverage report.
message RefreshCoverageRequest {
  // The tenant, by name. Required.
  string tenant = 1;
}

// RefreshCoverageResponse is the job made.
message RefreshCoverageResponse {
  // The job, queued, of kind deid_coverage.
  Job job = 1;
}

// CodeRequest is one value whose codes are asked for.
message CodeRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The attribute the value is of: a keyword of PS3.6, such as
  // "PatientID", or a tag of eight hexadecimal digits, such as
  // "00100020". Empty means PatientID. Its VR decides which padding is
  // removed from the value; a UID attribute's value must be a UID.
  string attribute = 2;

  // The value, as a file's element holds it, as UTF-8 text. Required; at
  // most 1024 bytes.
  string value = 3 [debug_redact = true];

  // The issuer of the Patient ID, for attribute PatientID only: the
  // subject identity is the Patient ID with its issuer (PatientIDIssuer),
  // and two issuers' patients of one Patient ID are two subjects. Absent
  // for a Patient ID that comes with no issuer. Set with another attribute,
  // invalid.
  PatientIDIssuer issuer = 4;

  // The namespace of a Patient ID that comes with no issuer
  // (Receiver.namespace), for code and lookups: empty is the tenant's
  // default namespace. Each subject label is answered under its receiver's
  // own namespace, as that receiver names a file with no issuer, so this
  // does not choose the receivers. Ignored when issuer is set, since an
  // issuer names the population itself. Set with another attribute than
  // PatientID, invalid. Otherwise empty or 1 to 63 characters under the
  // rule of a tenant's name.
  string namespace = 5;
}

// PatientIDIssuer is who gave a Patient ID (PS3.3 C.7.1.1, and its Issuer
// of Patient ID Macro, Table 10-18): the Issuer of Patient ID (0010,0021)
// and the values of the Issuer of Patient ID Qualifiers Sequence
// (0010,0024) that name an issuer, each as a file's element holds it, as
// UTF-8 text, its padding removed as for its VR, at most 1024 bytes. A
// field left empty is one the file does not have; an issuer with every
// field empty is no issuer. Each must be given as the files give it: a
// value written differently (another case, another spelling) is another
// issuer, and so another subject.
message PatientIDIssuer {
  // Issuer of Patient ID (0010,0021), LO.
  string issuer = 1 [debug_redact = true];

  // Universal Entity ID (0040,0032), UT.
  string universal_entity_id = 2 [debug_redact = true];

  // Universal Entity ID Type (0040,0033), CS, such as "ISO".
  string universal_entity_id_type = 3 [debug_redact = true];

  // Identifier Type Code (0040,0035), CS, such as "MR".
  string identifier_type_code = 4 [debug_redact = true];

  // The Assigning Facility Sequence (0040,0036): its Local Namespace
  // Entity ID (0040,0031), Universal Entity ID and its type.
  IssuerDesignator assigning_facility = 5;

  // The Assigning Jurisdiction Code Sequence (0040,0039).
  IssuerCode assigning_jurisdiction = 6;

  // The Assigning Agency or Department Code Sequence (0040,003A).
  IssuerCode assigning_agency = 7;
}

// IssuerDesignator is an HL7v2 hierarchic designator (PS3.3 Table 10-17).
message IssuerDesignator {
  // Local Namespace Entity ID (0040,0031), UT.
  string local_namespace_entity_id = 1 [debug_redact = true];

  // Universal Entity ID (0040,0032), UT.
  string universal_entity_id = 2 [debug_redact = true];

  // Universal Entity ID Type (0040,0033), CS.
  string universal_entity_id_type = 3 [debug_redact = true];
}

// IssuerCode is a coded entry's identifying values (PS3.3 Table 8.8-1a);
// its Code Meaning is not one, since two senders may word one code two
// ways.
message IssuerCode {
  // Code Value (0008,0100), SH.
  string code_value = 1 [debug_redact = true];

  // Coding Scheme Designator (0008,0102), SH.
  string coding_scheme_designator = 2 [debug_redact = true];

  // Long Code Value (0008,0119), UC.
  string long_code_value = 3 [debug_redact = true];

  // URN Code Value (0008,0120), UR.
  string urn_code_value = 4 [debug_redact = true];
}

// CodeResponse is what the archive gives the value.
message CodeResponse {
  // The attribute's tag, eight hexadecimal digits in upper case.
  string attribute = 1;

  // The keyed hash of the value under the tenant's naming key: 16
  // characters of lower case base32, as a {#X} placeholder writes it (a
  // hash action writes it in upper case in a CS element). For attribute
  // PatientID, the keyed hash of the subject identity (the request's
  // issuer, or its namespace), as a lookup table keys it and as a profile's
  // hash action writes a file's Patient ID.
  string code = 2;

  // For each receiver whose naming rule makes its subject label from this
  // attribute's keyed hash and fixed text alone, the label it gives the
  // value, by receiver name. A receiver whose subject label reads another
  // attribute, a pattern, or the value as it is, is not listed.
  repeated SubjectLabelCode subjects = 3;

  // For each lookup table that holds a code for the value, by table name,
  // that code. A table that holds none is not listed.
  repeated LookupTableCode lookups = 4;
}

// SubjectLabelCode is the subject label one receiver gives a value.
message SubjectLabelCode {
  // The receiver's name.
  string receiver = 1;

  // The subject label its naming rule makes from the value.
  string subject_label = 2;

  // Whether the tenant's catalog holds a subject of that label now.
  bool held = 3;
}

// LookupTableCode is the code one lookup table holds for a value.
message LookupTableCode {
  // The table's name.
  string table = 1;

  // The code.
  string code = 2;
}

// ImportLookupCodesRequest is the codes to put in one table.
message ImportLookupCodesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The table's name, under the rule of a tenant's name. Required.
  string table = 2;

  // The entries: 1 to 10000.
  repeated LookupEntry entries = 3;
}

// LookupEntry is one value and the code that replaces it.
message LookupEntry {
  // The value, as UTF-8 text. Required; at most 1024 bytes.
  string value = 1 [debug_redact = true];

  // The code: 1 to 16 of A-Z, 0-9 and "_", which fits every text VR
  // (PS3.5 6.2: CS's repertoire is the narrowest).
  string code = 2;

  // The issuer of the value, when it is a Patient ID that comes with one:
  // the entry is then stored by the keyed hash of the subject identity
  // (CodeRequest.issuer), which a lookup action on the Patient ID of a file
  // from that issuer meets. Absent for a value with no issuer, stored by
  // its own keyed hash, as every value of any other attribute.
  PatientIDIssuer issuer = 3;

  // The namespace of a Patient ID that comes with no issuer
  // (Receiver.namespace): set, the entry is stored by the keyed hash of
  // the subject identity under that namespace, which a lookup action on
  // the Patient ID of a file with no issuer through a receiver of that
  // namespace meets. Empty, the default namespace: stored by the value's
  // own keyed hash. Ignored when issuer is set. Otherwise 1 to 63
  // characters under the rule of a tenant's name.
  string namespace = 4;
}

// ImportLookupCodesResponse says what the import stored.
message ImportLookupCodesResponse {
  // The table.
  string table = 1;

  // How many entries were added.
  int32 added = 2;

  // How many entries the table already held with the same code; an entry
  // given twice with the same code counts once.
  int32 unchanged = 3;

  // How many codes the table holds now.
  int64 codes = 4;
}

// ListLookupTablesRequest asks for a page of a tenant's lookup tables.
message ListLookupTablesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The most tables to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 2;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant other than the
  // one it was made with.
  string page_token = 3;
}

// ListLookupTablesResponse is a page of lookup tables.
message ListLookupTablesResponse {
  // The tables of this page.
  repeated LookupTable tables = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// LookupTable is a lookup table in a list.
message LookupTable {
  // The table's name.
  string name = 1;

  // How many codes it holds: imported and assigned together.
  int64 codes = 2;
}
