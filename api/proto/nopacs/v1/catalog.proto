syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package nopacs.v1;

import "google/protobuf/timestamp.proto";

// CatalogService reads what a tenant holds: its subjects, their sessions
// and the scans of each session, the three levels every archived file is
// placed under (a subject is a person or an animal studied, a session one
// visit of it, one DICOM study; a scan one series of the session). It
// reads the tenant's database alone, never a storage, so an answer costs
// the same whether the files are on a disk or in a bucket, and a storage
// that does not answer does not stop the catalog.
//
// A subject, a session and a scan are named by their labels, the archive's
// own names, made by the receiver's naming rule when they were first
// archived: a subject by its label, unique in the tenant; a session by its
// subject's label and its own, unique in the subject; a scan by those two
// and its own, unique in the session. A label is 1 to 128 bytes of A-Z,
// a-z, 0-9, ".", "_" and "-", and is compared exactly: two labels at one
// level never differ only in the case of their letters, so a label asked
// for in another case is not found rather than taken as another's. A
// label can change, by a relabel (CorrectionService.Relabel); the UIDs
// never do. A Get by a label a relabel moved is answered not found; to a
// caller with operator or more on the tenant, with the reason RELABELED,
// naming the relabel and the label the data has now (access.proto, the
// error kinds).
//
// What a reader reads. Until a later version de-identifies files at
// reception, the archive holds what the senders sent, and a reader of a
// tenant reads it as it was received, identifying data included: the UIDs
// this service answers are the ones received, and a study date or a series
// description is the sender's. When identifiers are replaced at reception,
// the archive's own UIDs will be separate fields. No method filters by a
// UID: no index of the catalog serves such a search, and DICOMweb's search
// will be the place for one.
//
// Lists and indexes. A list is paged as every list of the package is, in
// the order CatalogOrder names, and answers only the combinations of
// filters and order that an index of the tenant's database serves in that
// order, which each list request names; any other combination is refused
// as invalid, with a message that names the ones served, rather than
// answered by reading the table. So a page costs about the same at ten
// thousand rows as at a hundred million, and a client learns at once what
// cannot be asked rather than waiting for it. A label prefix is compared
// with the labels' folded form (ASCII letters in lower case), the form the
// catalog keeps unique at each level, so a prefix is served by the same
// index that keeps labels unique.
//
// Counts. A list answers how many rows match only when a running total
// gives that number without counting rows (total_count); otherwise the
// number is absent, which means not known, never zero. The counts and
// sizes on a subject, a session and a scan are such running totals, kept
// in the transaction that archives each file, so they are read, never
// counted, and equal a count of the files after each archive.
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE.
service CatalogService {
  // ListSubjects answers a page of a tenant's subjects, newest first or by
  // label, filtered by label or by when they were first archived.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the filters and the order in
  // details; a label prefix that is not the start of a valid label is
  // recorded as "invalid".
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a combination of filters and order no index serves), not found
  // (a tenant that does not exist, for a caller who may list every tenant),
  // unavailable (the tenant's database does not answer, or the tenant is
  // not ready).
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetSubject answers one subject.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the subject's label as its
  // object, or "invalid" for a value that is not a valid label.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no subject with that label; a tenant that
  // does not exist, for a caller who may list every tenant), unavailable
  // (the tenant's database does not answer, or the tenant is not ready).
  rpc GetSubject(GetSubjectRequest) returns (GetSubjectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListSessions answers a page of a tenant's sessions, newest first, by
  // label or by study date, of one subject or of every subject, filtered
  // as ListSessionsRequest says.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the subject's label as its
  // object when one is given, and the filters and the order in details; a
  // label or a label prefix that is not valid is recorded as "invalid".
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a combination of filters and order no index serves), not found
  // (the tenant has no subject with the label given; a tenant that does not
  // exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetSession answers one session.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the session's path,
  // "<subject>/<session>", as its object; a label that is not valid is
  // written "invalid" in it.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no such subject, or the subject no session
  // with that label; a tenant that does not exist, for a caller who may
  // list every tenant), unavailable (the tenant's database does not answer,
  // or the tenant is not ready).
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListScans answers a page of a tenant's scans, newest first, by label
  // or by series description, of one session, of one subject or of every
  // subject, filtered as ListScansRequest says.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the path of the subject or
  // session given as its object, and the filters and the order in details;
  // a label or a label prefix that is not valid is recorded as "invalid",
  // and a series description prefix only as present.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a session label without a subject label, and a combination of
  // filters and order no index serves), not found (the tenant has no such
  // subject, or the subject no such session; a tenant that does not exist,
  // for a caller who may list every tenant), unavailable (the tenant's
  // database does not answer, or the tenant is not ready).
  rpc ListScans(ListScansRequest) returns (ListScansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetScan answers one scan.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the scan's path,
  // "<subject>/<session>/<scan>", as its object; a label that is not valid
  // is written "invalid" in it.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no such subject, the subject no such session,
  // or the session no scan with that label; a tenant that does not exist,
  // for a caller who may list every tenant), unavailable (the tenant's
  // database does not answer, or the tenant is not ready).
  rpc GetScan(GetScanRequest) returns (GetScanResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// CatalogOrder is the order a catalog list answers in. Each order ends
// with a key unique among the rows it orders, so it is total, and the page
// token carries the position of the last row answered: a page resumes
// exactly after it even while new rows are archived, and a row archived
// after the first page appears on a later page only if it sorts after the
// rows already answered.
enum CatalogOrder {
  // Newest first, as CATALOG_ORDER_NEWEST.
  CATALOG_ORDER_UNSPECIFIED = 0;

  // Newest first by archive_time, and among rows archived at the same
  // instant by the server's own id of the row, highest first: what arrived
  // lately is on the first page. The id is internal to the tenant's
  // database and is never answered; the page token carries it.
  CATALOG_ORDER_NEWEST = 1;

  // Parent first, the order a person reads a tree in: by the folded label
  // of the subject, then of the session, then of the scan, down to the
  // level listed, each in byte order (digits, then letters, with "-", "."
  // and "_" where their bytes place them). Folded labels are unique at each
  // level, so the order is total.
  CATALOG_ORDER_LABEL = 2;

  // Sessions only: by study_date, latest first, then by the server's id of
  // the session, highest first. Sessions with no study date are not listed
  // in this order.
  CATALOG_ORDER_STUDY_DATE = 3;

  // Scans only: by the folded form of series_description (ASCII letters in
  // lower case), in byte order, then by the server's id of the scan,
  // lowest first. Scans with no series description are not listed in this
  // order.
  CATALOG_ORDER_SERIES_DESCRIPTION = 4;
}

// Subject is a person or an animal studied, as the catalog holds it.
message Subject {
  // Its label, unique in the tenant.
  string label = 1;

  // How many sessions it has.
  int64 session_count = 2;

  // How many instances (one file each) its sessions hold.
  int64 instance_count = 3;

  // The bytes of those files, as archived: each file's DICOM file header
  // and data set.
  int64 size_bytes = 4;

  // When its first file was archived: when the subject was cataloged.
  google.protobuf.Timestamp archive_time = 5;

  // When a file was last archived into it. Equal to archive_time until a
  // later reception adds to it.
  google.protobuf.Timestamp update_time = 6;
}

// Session is one study of a subject, as the catalog holds it.
message Session {
  // The label of its subject.
  string subject_label = 1;

  // Its label, unique in its subject.
  string label = 2;

  // Its Study Instance UID (0020,000D), as received (PS3.3 C.7.2.1),
  // unique in the tenant.
  string study_instance_uid = 3;

  // Its Study Date (0008,0020), as received, in the form of the DICOM DA
  // value representation, "YYYYMMDD" (PS3.5 6.2). Empty when its files did
  // not hold one, or held a value that is not a valid date.
  string study_date = 4;

  // The Modality (0008,0060) values of its scans, each once, in byte
  // order, such as ["MR", "SR"].
  repeated string modalities = 5;

  // How many scans it has.
  int64 scan_count = 6;

  // How many instances its scans hold.
  int64 instance_count = 7;

  // The bytes of those files, as archived.
  int64 size_bytes = 8;

  // The name of the storage its files are on. Every file of a session is on
  // one storage.
  string storage = 9;

  // The name of the receiver whose reception first archived into it. A
  // removed receiver keeps its name here.
  string receiver = 10;

  // When its first file was archived.
  google.protobuf.Timestamp archive_time = 11;

  // When a file was last archived into it.
  google.protobuf.Timestamp update_time = 12;

  // True when this answer leaves out the values read from its files:
  // study_instance_uid, study_date and modalities are empty. It is set for
  // a masked key (a key made for an AI agent) reading a session a receiver
  // that keeps files as received archived, where those values are the
  // sender's originals and are in no de-identified form. An empty value
  // with this false means the files held none.
  bool values_withheld = 13;
}

// Scan is one series of a session, as the catalog holds it.
message Scan {
  // The label of its subject.
  string subject_label = 1;

  // The label of its session.
  string session_label = 2;

  // Its label, unique in its session.
  string label = 3;

  // Its Series Instance UID (0020,000E), as received (PS3.3 C.7.3.1),
  // unique in the tenant.
  string series_instance_uid = 4;

  // Its Modality (0008,0060), as received, such as "MR". Empty when its
  // files did not hold one.
  string modality = 5;

  // Its Series Description (0008,103E), as received; at most 64
  // characters (the LO value representation, PS3.5 6.2). Empty when its
  // files did not hold one.
  string series_description = 6;

  // Its Series Number (0020,0011), as received. Absent when its files did
  // not hold one, or held a value that is not an integer.
  optional int32 series_number = 7;

  // How many instances it holds.
  int64 instance_count = 8;

  // The bytes of those files, as archived.
  int64 size_bytes = 9;

  // The name of the storage its files are on, its session's.
  string storage = 10;

  // The SHA-256 of its manifest as last written, in lowercase hexadecimal,
  // 64 characters. The manifest is the list, kept on the storage beside the
  // scan's files, of every file of the scan with its key, size and SHA-256.
  // It changes only when the scan's files do, so a client that holds a copy
  // of the scan knows from this alone whether its copy is still whole.
  string manifest_sha256 = 11;

  // The name of the receiver whose reception first archived into it.
  string receiver = 12;

  // When its first file was archived.
  google.protobuf.Timestamp archive_time = 13;

  // When a file was last archived into it.
  google.protobuf.Timestamp update_time = 14;

  // True when this answer leaves out the values read from its files:
  // series_instance_uid, modality, series_description and series_number
  // are empty or absent. It is set for a masked key (a key made for an AI
  // agent) reading a scan a receiver that keeps files as received
  // archived, where those values are the sender's originals and are in no
  // de-identified form. An empty value with this false means the files
  // held none.
  bool values_withheld = 15;
}

// ListSubjectsRequest asks for a page of a tenant's subjects. The
// combinations an index serves:
//
//   - order newest (or unspecified), with start_time and end_time or
//     without them;
//   - order label, with label_prefix or without it.
//
// Any other combination is invalid.
message ListSubjectsRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // Only the subjects whose folded label starts with the folded form of
  // this. Empty for every label; when given, a label or the start of one,
  // under the label rule. Order label only.
  string label_prefix = 2;

  // Only the subjects first archived at or after this time. Absent for no
  // lower bound. Order newest only.
  google.protobuf.Timestamp start_time = 3;

  // Only the subjects first archived before this time. Absent for no upper
  // bound. Must be after start_time when both are set. Order newest only.
  google.protobuf.Timestamp end_time = 4;

  // The order of the answer: newest or label.
  CatalogOrder order = 5;

  // The most subjects to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 6;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant, filters or an
  // order other than those it was made with.
  string page_token = 7;
}

// ListSubjectsResponse is a page of subjects.
message ListSubjectsResponse {
  // The subjects of this page, in the order asked for.
  repeated Subject subjects = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;

  // How many subjects match the request, on every page alike. Answered
  // only when no filter is given, from the tenant's running total of its
  // subjects; absent, meaning not known, when a filter is given, since
  // only a count of the rows could tell.
  optional int64 total_count = 3;
}

// GetSubjectRequest names a subject.
message GetSubjectRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The subject's label. Required.
  string subject_label = 2;
}

// GetSubjectResponse is the subject named.
message GetSubjectResponse {
  // The subject.
  Subject subject = 1;
}

// ListSessionsRequest asks for a page of a tenant's sessions. The
// combinations an index serves:
//
//   - order newest (or unspecified), with at most one of subject_label,
//     modality and receiver, and with start_time and end_time or without
//     them;
//   - order label, with subject_label or without it, and label_prefix
//     only with subject_label;
//   - order study date, with subject_label or without it, and with
//     study_date_start and study_date_end or without them.
//
// Any other combination is invalid: a study date range comes with the
// study date order, a time range with the newest order, and two of
// subject, modality and receiver together are not served.
message ListSessionsRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // Only the sessions of the subject with this label. Empty for every
  // subject.
  string subject_label = 2;

  // Only the sessions whose folded label starts with the folded form of
  // this. Empty for every label; when given, a label or the start of one,
  // under the label rule. Order label with subject_label only.
  string label_prefix = 3;

  // Only the sessions whose study_date is on or after this date, in the
  // form "YYYYMMDD". Empty for no lower bound. Order study date only.
  string study_date_start = 4;

  // Only the sessions whose study_date is on or before this date, in the
  // form "YYYYMMDD": both bounds are inclusive, as a DICOM date range is
  // (PS3.4 C.2.2.2.5). Empty for no upper bound. Must not be before
  // study_date_start when both are given. Order study date only.
  string study_date_end = 5;

  // Only the sessions with a scan of this Modality (0008,0060), compared
  // exactly, such as "MR": 1 to 16 characters of A-Z, 0-9, "_" and space
  // (the CS value representation, PS3.5 6.2). Empty for every modality.
  // Order newest only.
  string modality = 6;

  // Only the sessions first archived through the receiver of this name.
  // Empty for every receiver. A name no receiver holds is not invalid: a
  // removed receiver's sessions keep its name. Order newest only.
  string receiver = 7;

  // Only the sessions first archived at or after this time. Absent for no
  // lower bound. Order newest only.
  google.protobuf.Timestamp start_time = 8;

  // Only the sessions first archived before this time. Absent for no upper
  // bound. Must be after start_time when both are set. Order newest only.
  google.protobuf.Timestamp end_time = 9;

  // The order of the answer: newest, label or study date.
  CatalogOrder order = 10;

  // The most sessions to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 11;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant, filters or an
  // order other than those it was made with.
  string page_token = 12;
}

// ListSessionsResponse is a page of sessions.
message ListSessionsResponse {
  // The sessions of this page, in the order asked for.
  repeated Session sessions = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;

  // How many sessions match the request, on every page alike. Answered
  // only in the newest or label order with no filter but subject_label:
  // from the tenant's running total of its sessions with no filter, and
  // from the subject's session_count with subject_label. Absent, meaning
  // not known, otherwise.
  optional int64 total_count = 3;
}

// GetSessionRequest names a session.
message GetSessionRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The label of the session's subject. Required.
  string subject_label = 2;

  // The session's label. Required.
  string session_label = 3;
}

// GetSessionResponse is the session named.
message GetSessionResponse {
  // The session.
  Session session = 1;
}

// ListScansRequest asks for a page of a tenant's scans. The combinations
// an index serves:
//
//   - order newest (or unspecified), with at most one of a session
//     (subject_label and session_label), modality and receiver, and with
//     start_time and end_time or without them;
//   - order label, with a subject, a session or neither, and label_prefix
//     only with a session;
//   - order series description, with series_description_prefix or without
//     it, and no other filter.
//
// Any other combination is invalid: a subject alone comes with the label
// order, a time range with the newest order, a description prefix with
// the series description order.
message ListScansRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // Only the scans of the subject with this label. Empty for every
  // subject.
  string subject_label = 2;

  // Only the scans of the session with this label, in the subject named by
  // subject_label, which it needs. Empty for every session.
  string session_label = 3;

  // Only the scans whose folded label starts with the folded form of this.
  // Empty for every label; when given, a label or the start of one, under
  // the label rule. Order label with a session only.
  string label_prefix = 4;

  // Only the scans of this Modality (0008,0060), compared exactly: 1 to 16
  // characters of A-Z, 0-9, "_" and space. Empty for every modality. Order
  // newest only.
  string modality = 5;

  // Only the scans whose Series Description (0008,103E), folded (ASCII
  // letters in lower case), starts with the folded form of this; at most
  // 64 characters. Empty for every description. A start, not a part
  // anywhere in the text: an index finds a start, and only a reading of
  // every row finds a part. Order series description only.
  string series_description_prefix = 6;

  // Only the scans first archived through the receiver of this name. Empty
  // for every receiver. Order newest only.
  string receiver = 7;

  // Only the scans first archived at or after this time. Absent for no
  // lower bound. Order newest only.
  google.protobuf.Timestamp start_time = 8;

  // Only the scans first archived before this time. Absent for no upper
  // bound. Must be after start_time when both are set. Order newest only.
  google.protobuf.Timestamp end_time = 9;

  // The order of the answer: newest, label or series description.
  CatalogOrder order = 10;

  // The most scans to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 11;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant, filters or an
  // order other than those it was made with.
  string page_token = 12;
}

// ListScansResponse is a page of scans.
message ListScansResponse {
  // The scans of this page, in the order asked for.
  repeated Scan scans = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;

  // How many scans match the request, on every page alike. Answered only
  // in the newest or label order with no filter, from the tenant's running
  // total of its scans, or with a session alone, from the session's
  // scan_count. Absent, meaning not known, otherwise, a subject alone
  // included: a subject keeps no count of its scans.
  optional int64 total_count = 3;
}

// GetScanRequest names a scan.
message GetScanRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The label of the scan's subject. Required.
  string subject_label = 2;

  // The label of the scan's session. Required.
  string session_label = 3;

  // The scan's label. Required.
  string scan_label = 4;
}

// GetScanResponse is the scan named.
message GetScanResponse {
  // The scan.
  Scan scan = 1;
}
