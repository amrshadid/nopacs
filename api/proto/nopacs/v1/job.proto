syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package nopacs.v1;

import "google/protobuf/timestamp.proto";
import "nopacs/v1/quarantine.proto";

// JobService makes, reads, cancels and retries a tenant's jobs. A job is a
// piece of work a person or a rule asks for, kept in the tenant's database
// until it ends, so it survives a restart of the server midway and goes on
// from where it was. A job has a kind: send, the archived instances of a
// subject, a session or a scan sent to one of the tenant's senders
// (SenderService); or deid, the archived instances of a subject, a session,
// a scan or the whole tenant read and judged against a de-identification
// profile version, changing nothing (DeidJob); scrub, every stored object of
// the tenant read again and compared with what the catalog and the scan's
// manifest say it should be (ScrubJob); or rebuild, the catalog made again
// from what the tenant's storages hold (RebuildJob); or import, the files of
// a directory under one of the installation's roots handed to an import
// receiver (ImportJob); or replicate, what a primary storage holds copied to
// a replica (ReplicateJob); or repair, objects a scrub found missing or
// damaged on a primary put back from a replica (RepairJob); or dispose, a
// retention rule's due sessions deleted (DisposeJob). A replicate or repair
// job is made by ReplicaService or by the server, and a dispose job by
// RetentionService.Dispose or the server's daily retention pass, never by
// CreateJob; once made it is read and canceled by these methods like any
// other, and retried too, but for a dispose job, which a new preview
// replaces. A kind added later is a new member of Job's kind, served
// by these same methods.
//
// What a send job sends. The instances the catalog held for its target when
// the job was made: each instance archived at or before the job's
// create_time. An instance archived later into the same session is sent by
// its own forward or by a new job, never by this one. An archive that began
// before create_time and ended after the job listed its scan is the job's
// all the same: it is sent, and the counts grow by it when it is. A job
// made by a receiver's forward_to (Receiver) sends exactly the instances
// one reception archived, and names that reception and its receiver; the
// server makes one such job per sender the receiver names when the
// reception reaches done, in the same transaction, and never two for the
// same reception and sender, so a step run again makes nothing twice.
// Forwarding never delays a reception or changes how it ends.
//
// How a send job runs. Its work is one unit per scan of its target, each
// sending the scan's instances in the catalog's order on one association
// (for a stow sender, a series of requests). A unit records how far the
// peer has answered, in batches of at most 64 instances or one second; a
// unit taken over after a crash or a lost lease goes on after the last
// instance recorded. So a send is at least once: an instance the job counts
// as sent was answered by the peer, and after a crash at most the instances
// answered since the last record, one batch per unit, are sent again. An
// instance a stow peer leaves unaccounted does not hold the record back:
// the unit moves past it and keeps it owed, tries it once more by name, and
// only then refuses it as JOB_FAILURE_CODE_PEER_UNACCOUNTED; a crash in
// between still sends at most one batch again. Every peer seen treats the
// same SOP Instance UID with the same bytes as a repeat; a peer that keeps
// both copies would keep both.
//
// What the peer's answer means, for each instance. A DIMSE sender reads the
// C-STORE response's status (PS3.4 B.2.3, PS3.7 Annex C): 0000 is sent;
// B000, B006 and B007 (coerced, elements discarded, data set does not match
// its SOP class) are sent with a warning, counted apart, because the peer
// changed what it keeps; A7xx (out of resources) is a temporary failure of
// the unit, which keeps its place and is tried again later; any other
// status, A9xx, Cxxx, 0122 (SOP class not supported) and 0124 (not
// authorized) among them, refuses the instance, which is listed with its
// status (ListJobFailures), and the unit goes on. A stow sender reads the
// answer as StowSender says. A connection that fails, an association that
// is aborted, a timeout, or a stow request answered 408, 429 or a 5xx, is a
// temporary failure of the unit.
//
// Attempts. A unit that fails for a temporary cause is tried again after a
// wait that doubles from 10 seconds to an hour; it has 30 attempts, about a
// day at the longest wait. While its sender is down or disabled, no attempt
// is made and none is used, so a peer down overnight does not fail a job. A
// unit whose attempts run out ends with its instances not sent, and its job
// ends failed once its other units end. When the unit that lists the job's
// scans runs out, the job ends failed at once with its units that have not
// started, and a unit still sending records nothing more: a job's counts
// are final once it ends failed. RetryJob sends what was not sent; it may
// send again at most one batch of each unit that was still sending.
//
// How a job ends. Done: every instance sent, with or without a warning.
// Partial: some refused, every other one sent. Failed: some instances not
// sent because attempts ran out. Canceled: CancelJob, or the removal of
// its sender with cancel_jobs. Each state is reached in one transaction
// with its event (EVENT_TYPE_JOB_STEP); while a job runs, its counts are
// reported at most once every 10 seconds (EVENT_TYPE_JOB_PROGRESS). Events
// carry ids, labels, counts and the peer's status codes, never a UID or a
// value read from a file.
//
// How much is kept of each job's failures is the setting job.failures-kept
// (SettingsService): the refused instances, and those sent with a warning,
// a job lists, from 100 to 1000000; an ordinary setting, whose
// installation value the installation's admin sets and a tenant's admin
// may override for the tenant; built-in default "10000". Past it, each is
// still counted, in the job's counts and failures_not_listed, and not
// listed.
//
// What a deid job does. Its work is the same as a send job's: a listing
// unit, then one unit per scan, each reading the scan's instances in the
// catalog's order after its cursor, every byte checked against the length
// and SHA-256 the catalog holds as a send reads it, and recording how far
// it got in batches of at most 64 instances or one second; a cancel takes
// effect within one batch, a crash judges again at most one batch per unit,
// and RetryJob judges again what was refused or never judged. Its counts
// read: sent, the instances that passed; warned, those that passed with a
// note (JobFailureCode says which); refused, those that did not pass. A
// deid job's attempts, states and events are a send job's, and its
// failures are listed by ListJobFailures. It changes nothing: no catalog
// row, no stored byte, no lookup table, no reception. A deid job never
// waits for a sender; the server runs at most 2 of its units at once, and
// at most 1 of one tenant's, each holding one file of at most 64 MiB in
// memory with its de-identified copy (a larger file is not judged and
// passes with the note JOB_FAILURE_CODE_TOO_LARGE), and its reads count in
// the server's bound on reads of archived bytes. Its counts per rule and per reason are answered
// by GetJob (Job.tallies): names of rules, actions, reasons, causes,
// element tags and SOP classes, never a value read from a file. The modes:
//
// A rule's conditions read the instance's reception as kept: its receiver,
// its calling AE title when its files came with exactly one, and the
// called AE title of its receiver as configured now. A condition on an
// element of the file (Modality, SOP Class UID, Manufacturer, Model Name,
// Software Versions) reads the archived file, which says what the file
// said only where the version that archived it kept the element.
//
//   - A dry run (DEID_JOB_MODE_DRY_RUN) runs a profile version over each
//     archived file in memory, as a trial run does (ProfileService
//     TryProfile): the engine under keys made for the job and never the
//     tenant's, its lookups answering every value unassigned, then the
//     check after; it answers what the version would archive and what it
//     would hold and why. It judges de-identification alone: no
//     receiver's checks run. An image a pixel rule decodes is bounded by
//     the lower of the tenant's deid.pixel-limit and 256 MiB.
//   - A check (DEID_JOB_MODE_CHECK) verifies each archived file against
//     the profile version the catalog records for it, by what that version
//     would leave of each element of the archived file: no element it
//     removes (a private element it does not keep among them); no value in
//     an element it empties; for an element it removes or empties unless
//     the IOD requires it, nothing but what the IOD keeps (the element as
//     it is, or the version's dummy); Patient Identity Removed (0012,0062)
//     YES; De-identification Method (0012,0063) naming the version; and no
//     UID outside the standard's registry that is a Study, Series or SOP
//     Instance UID the catalog holds for an archived file as received, or
//     the tenant's keyed remapping of one it holds de-identified (a lookup
//     that answers only whether it was found; a UID the remapping itself
//     made, as in de-identified data received again, is no finding). Only
//     those UIDs are recognized: an original Frame of Reference UID, or a
//     Referenced UID of an instance never archived, is not. An element
//     whose decision rests on a condition the archive cannot answer (a
//     fact of the reception not known, or an element the version removed
//     or changed) is no finding: the file passes with the note
//     JOB_FAILURE_CODE_UNDECIDED, tallied check|undecidable|<tag>. An
//     instance archived as received records no version and is passed with
//     a note (JOB_FAILURE_CODE_NOT_DEIDENTIFIED).
//
// What a scrub job does. A storage is the archive's truth, and a byte can
// change on it without anyone writing it (a failing disk, an operator's
// mistake, a bucket edited by hand); a scrub finds such a change before a
// reader does. Its work is a unit per scan, which reads each instance of
// the scan in full and compares its length and SHA-256 (FIPS 180-4) with
// the catalog's, and the manifest's SHA-256 with the one the catalog holds
// and its lines with the catalog's rows; and a unit that lists each
// storage's keys one level at a time, for objects no scan names. A storage
// that does not answer that listing is passed over and tallied
// "unreadable|storage"; the others are listed and every scan is read. What
// a reception has put and not yet committed (a scan's next manifest, a new
// scan's files) is never a finding. A correction (CorrectionService) not
// yet purged is checked against what it is doing, so its work is never a
// finding: a delete's objects kept for its grace (neither orphans nor
// missing, and not read for damage, since the catalog no longer serves
// them and the purge removes them), a relabel's copies under the new
// labels while it copies and the old tree after its publish until the
// purge, and a replace's new revision (with the manifest and metadata
// naming it, before the publish) and the revision it superseded until the
// purge. An object beside them that none of this names is still an
// orphan. The tenant's database says which corrections are pending; a
// correction record on a storage whose correction has no row is tallied
// "correction|record_only" and explains only objects that scan's own
// manifest names, never a difference. An object the storage answers as not online (held in
// a tier it cannot read at once) is tallied "unreadable|not_online", never
// a finding and never a mark: not readable now is not missing. Every
// difference is read a second time before it is
// believed, then recorded as a finding (ListScrubFindings) of one of five
// kinds (ScrubFindingKind), with an EVENT_TYPE_SCRUB_FINDING event; a
// damaged or missing instance is marked so that every read of it answers
// data loss at once instead of streaming bytes that are not what was
// archived. A finding read good by a later scrub is cleared, and the
// clearing is recorded. A scrub reports and marks only: it never deletes,
// moves, rewrites or repairs a stored object. Repair is a repair job from
// a replica (ReplicaService.Repair), or a replace from a file sent again
// (CorrectionService.Replace). It reads at most the
// tenant's setting scrub.rate per storage (bytes per second, such as
// "64MiB"; built-in default "64MiB"), and its reads count in the server's
// bound on reads of archived bytes, behind reception. A scrub does not
// verify the tenant's audit log; AuditSealService.VerifyAudit does. The
// server makes one of each storage by itself one scrub.interval after the
// storage's last scrub ended, and at once for a storage never scrubbed, so
// a change of the setting moves the next scrub and never starts one by
// itself (a period such as "30d", from "1d" to "3650d", or "0" for never;
// a tenant setting; built-in default "30d"), and a person makes one
// with CreateJob. Its counts read: sent, the instances read good; refused,
// those with a finding; and its tallies, "finding|<kind>" for the findings
// recorded, "cleared" for those cleared, "orphan_objects" for the objects
// no scan names, "unreadable|not_online" for the objects not online,
// "sidecar|missing" for the scans whose metadata file is not on their
// storage (a scan archived before metadata files were written has none;
// no finding), and "unreadable|storage" for the storages whose keys could
// not be listed in this job, and "correction|record_only" for the
// correction records on a storage whose correction the database holds no
// row of, and "correction|unauthenticated" for those of them whose MAC is
// missing or does not verify, which explain nothing. A damaged or missing instance read whole
// again is cleared, and its mark removed, by that read.
//
// A scrub reads a replica (StorageService) as it reads a primary: each
// object against the catalog's size and SHA-256 and each manifest against
// the catalog's digest, its findings recorded with the replica's name
// (ScrubFinding.replica_of says it is one). A finding on a replica marks
// the replica's copy, never the instance, whose reads keep going to the
// primary, and the server copies the object again from the primary,
// verified, unasked. A scan still pending on a replica (its copy not yet
// made) is not read there, and nothing of it is called missing. On a
// storage of the archive tier, an object that cannot be read now is
// checked by presence: listed, its size compared, and the store's own
// SHA-256 compared where the store keeps one (HeadObject), tallied
// "presence|checked"; a key missing from the listing is a finding as on
// any storage. Bytes are read there only for objects online, and for a
// share of the others the tenant's setting scrub.archive-sample recalls on
// purpose (a percentage such as "0.5%", from "0%" to "100%"; an ordinary
// setting, a tenant may override it; built-in default "0%", since each
// recall costs the site), tallied "presence|sampled".
//
// What a rebuild job does. It reads the correction records on each of the
// tenant's storages first, then lists their "meta/" keys and reads each
// scan's manifest and metadata, and opens no DICOM file. In both modes it
// builds a shadow catalog, in a scratch database of the tenant's database
// type, scan by scan, each write fenced by its unit's attempt, so a crash
// or a lost lease goes on from the last scan written to the shadow
// (RetryJob likewise) and the catalog in use is never touched while it is
// built: it keeps answering reads and sends. A scan under a committed
// delete is left out and tallied; a correction record whose row the
// tenant's database lacks is applied fail-closed (a delete as committed)
// and tallied, and the correction listed as unresolved for an admin; a
// scan whose metadata names a profile version the tenant does not have is
// left out and tallied, never cataloged as archived as received; two
// storages holding one Series Instance UID is a tally, not a choice the
// job makes, except a relabel's two trees, which its record resolves. In
// compare mode it tallies each difference from the catalog in use and
// drops the shadow. In replace mode the tenant's receivers refuse new data
// from the moment the job is queued until it ends, however it ends (a
// transient refusal the sender tries again, as when a storage is nearly
// full; cancel the job to lift it at once), and the build starts only once
// the tenant's receptions and correction requests in flight have ended, so
// nothing lands that the shadow would miss. While any rebuild is queued or
// running, corrections and every step of a purge are refused, and a purge
// goes on once the job has ended. While the receptions or corrections do
// not stop for its build, each attempt fails and is tried again, about a
// day in all at worst. A replace that ends partial removes from the catalog
// in use the scans it left out, whose files stay on the storage; once the
// build is complete
// (every key listed, every manifest read, the counts adding up) one
// transaction makes the shadow the catalog in use, with an
// EVENT_TYPE_CATALOG_REBUILT event, so every read sees the whole old
// catalog or the whole new one, never part of either. Its counts read:
// sent, the instances cataloged (or compared); refused, those left out.
// Its tallies, each counting scans: "left_out|profile_unknown" (its
// metadata names a profile version the tenant does not have),
// "left_out|deleted" (a delete's correction record hides it, whole or
// in part), "left_out|unreadable" (its manifest or metadata cannot be
// read, is of a form older than the one a catalog is made from, or says
// another thing of an instance than the other), "left_out|label_conflict"
// (its labels are held by another scan the shadow already has),
// "series_on_two_storages" (a scan of another storage holds its series or
// one of its instances); "left_out|held_elsewhere" (another scan of the
// same storage holds its series or one of its instances);
// "unresolved_correction", counting the delete
// records applied with no row in the tenant's database to confirm them;
// "unauthenticated_correction", counting the correction records whose MAC
// is missing or does not verify under the installation key for the
// tenant, each of which hides nothing;
// "differs|<table>|<added|removed|changed>" for a compare; and
// "activated" once a replace made its shadow the catalog in use. A unit
// whose attempts run out ends the job failed ("attempts ran out") and its
// shadow is removed. A primary and its replica
// holding one Series Instance UID is what a replica is, never that tally:
// a rebuild reads primaries, and compares replicas. A compare that names
// from_storage builds its shadow from that one storage alone, as if it
// were the only one the tenant had, and compares it with the catalog's
// scans on that storage, or, for a replica, on its primary: the check
// before a switch (ReplicaService), which must find no difference.
//
// What a replicate job does. It copies to one replica every object of its
// primary the replica does not hold verified: each scan's current objects,
// the superseded revisions not yet purged, the correction records and the
// hold records, by the same copy as the server's own (ReplicaService), one
// unit per scan, each put verified and its manifest and metadata put last.
// The server makes one when a replica is attached to a primary that holds
// data; BackfillReplica makes one on a person's word. It never copies what
// a delete hid, and it reads at most the tenant's replica.rate, behind
// reception. Its counts read: sent, the instances copied or found held
// verified; refused, those it could not read whole from the primary
// (JOB_FAILURE_CODE_DAMAGED_IN_STORAGE); its tallies "copied",
// "already_held", "records" (correction and hold records copied). A unit
// whose replica does not answer is a temporary failure, tried again as a
// send's is.
//
// What a repair job does. It puts back on a primary the objects its scrub
// findings name, each read whole from a replica in step for the object's
// scan and checked against the catalog's length and SHA-256, and put at the
// same key after the damaged object's size and found SHA-256 are recorded
// (ReplicaService.Repair says each step). Its counts read: sent, the
// objects repaired; refused, those no replica holds good
// (JOB_FAILURE_CODE_DAMAGED_IN_STORAGE, the detail "no good copy"); its
// tallies "repaired", "no_good_copy"
// and "already_good" (an object a new read found whole, whose finding is
// cleared). A replica's object not online is recalled, and the unit waits
// with the reason "recalling".
//
// What a dispose job does. It deletes the sessions a disposal listed
// (RetentionService.Dispose, or the daily pass for a delete rule), one at
// a time, oldest due first, each through CorrectionService's ordinary
// delete with origin retention, the rule's name, and the admin's reason
// (Dispose) or the server's "retention rule <rule>, due <date>" (the daily
// pass); the confirm token of a Dispose is recorded in the transaction
// that makes the job, so a Dispose sent again with that token answers
// this job and deletes nothing twice. Before each session it checks the
// session again: one held, deleted already, no longer due since the
// preview, or, for the daily pass, exempt after a person undid its
// retention delete, is skipped and counted refused, never deleted. Its
// counts read: instances and bytes, those of the sessions listed; sent,
// the instances of the sessions deleted; refused, those of the sessions
// skipped; scans and scans_done count sessions. Its tallies: "deleted",
// "skipped|held", "skipped|not_due", "skipped|already_deleted",
// "skipped|undone". A cancel stops it within one session; the deletes made
// stay, each undone by UndoCorrection during its grace. While the
// tenant's retention is paused for a clock jump, a dispose job the daily
// pass made waits with the reason "clock jumped". The daily pass queues no
// dispose job for a rule that has one queued or running.
//
// What an import job does. It reads the directory its path names under its
// receiver's root (ImportReceiver) and hands each DICOM file in it to the
// receiver, one at a time, as a file that arrived; it never writes, moves
// or deletes anything in the root. For example, a tree kept as
// <study>/<session>/series/<scan>/<file>, with a map from (study, session)
// to subject, is read by an import receiver with the pattern layout
// "^(?P<study>[^/]+)/(?P<session>[^/]+)/series/(?P<scan>[^/]+)/[^/]+$",
// unit depth 2 (one unit per session folder), map_key_columns naming the
// map's study and session columns, map_key_parts ["study", "session"],
// map_value_column its subject column and map_gives "subject", and the
// naming rule "{study}_{subject}", "{study}_{session}",
// "{scan}". Its work is a listing unit and one unit
// per folder. The listing unit lists the folders at the layout's unit depth
// under the job's path, a page at a time, and queues one unit per folder
// (one unit for a path at or below that depth); it also judges every file
// it meets above that depth (skipped as outside the layout, not DICOM and
// so on, or handed in when the layout matches it), and ListImportUnits
// shows it as a unit of its own, its folder the job's path. Each unit walks
// its folder one directory at a time, in the order of its paths compared
// segment by segment, each segment byte by byte, so a directory's whole
// subtree comes before the next name of that directory ("a/b/c" before
// "a/b.d", which plain byte order of whole paths would reverse, "/" being
// below "."); its cursor is a path in that order. A directory is read as
// names only, at most the installation's setting import.max-dir-entries of
// them (a whole number from 1000 to 10000000; installation-only, since it
// bounds the server's memory; built-in default "200000", about 16 MiB of
// 60-byte names and up to 54 MiB of 255-byte ones): the bound is on
// reading one directory, not on the walk, which holds one directory's
// names whole and at most 64 KiB of the names of each directory above it,
// reading a directory above again when those run out. A directory with more is not read
// further and is skipped whole as IMPORT_SKIP_CODE_DIRECTORY_TOO_WIDE, so
// raising the setting (it applies at the next directory read, no restart)
// and retrying imports it. An entry whose path is longer than 2048 bytes
// is skipped as IMPORT_SKIP_CODE_PATH_TOO_LONG, and one whose name breaks
// the rule of a segment as IMPORT_SKIP_CODE_BAD_NAME, a directory without
// being entered. Each path segment is opened without following a
// link (no-follow open, the type read without following, as lstat does), so
// a link, wherever it is in the tree, is skipped as
// IMPORT_SKIP_CODE_NOT_REGULAR and nothing outside the root is ever opened.
// Before a file is handed in, its first 132 bytes are read: one without the
// Part 10 preamble and "DICM" (PS3.10 7.1) is skipped as
// IMPORT_SKIP_CODE_NOT_PART10 and never reaches quarantine, so a tree's
// notes, images, archives and index files do not fill it.
//
// A unit writes each file's record (its arrival, or the row of its skip)
// in the same transaction as its cursor and its counts found, skipped and
// handed_in, fenced by its attempt. After a crash or a lost lease it goes
// on after its cursor, and no file is handed in twice, so handed_again is
// always 0 in this version; it is kept for a later version that batches
// these writes. The copy a hand-off lands in the incoming area is named by
// the arrival's id, never by its path, and the arrival's record carries
// the path, in the tenant's database. A unit stops with its place kept,
// using no attempt, while the receiver is disabled, the archive cannot
// take files (the incoming area or the storage below its reserve, the
// tenant at its incoming.limit or not ready), the tenant is restoring,
// moved or fenced, or a rebuild that replaces the catalog runs (whose
// receivers refuse new data); a tenant restored from a backup resumes each
// unit from the cursor the backup holds. The tenant runs at most its
// setting import.max-units of import units at once (a whole number from 1
// to 64; set on a tenant by the installation's admin only, whose
// installation value is the default for every tenant; built-in default
// "4"), and the server at most import.server-max-units of every tenant's
// together (a whole number from 1 to 256; installation-only; built-in
// default "8"), so an import never takes the pipeline from live receivers.
// A unit whose root no longer resolves to the directory it resolved to
// when the job was made (a link in its path changed), or cannot be opened,
// ends failed at once with the reason "root unavailable"; that is not a
// skip of any file.
//
// An import is done when every file it found has an outcome. A hand-off
// returns once the file is in the server's incoming area, before it is
// identified, de-identified, archived or quarantined; each file handed in
// carries the job and its unit as its arrival's source, kept with the
// received file and with any reception RetryReception makes for it, and
// the pipeline adds its outcome to the job's counts in the transaction
// that decides it: archived, already held, quarantined (by reason), lost,
// failed (its reception failed) or discarded (its reception discarded,
// ReceptionService.DiscardReception). RetryReception moves a failed file
// back to processing; a quarantined file later released keeps its first
// outcome, quarantined, and the release is the quarantine's record, not
// the job's. So the counts reconcile, per job and per unit (ImportCounts,
// ListImportUnits): found plus handed again equals skipped plus handed in,
// and handed in equals archived plus already held plus quarantined plus
// lost plus failed plus discarded plus processing.
//
// The archive as it is now decides a file's outcome. A file whose SOP
// Instance UID the tenant holds and whose received checksum equals that of
// any revision the instance has had counts already held (tallied
// "superseded_revision" when it is not the current one), so a tree read
// again after a correction does not bring an old version back. A file of a
// target deleted from the archive (CorrectionService.Delete) is
// quarantined as QUARANTINE_REASON_WAS_DELETED, as from any receiver, and
// makes the job partial. A route condition on an AE title never holds for
// a file an import hands in, since none came by association.
//
// After its last unit's walk the job stays running, with the reason
// "settling", until processing is zero, and only then ends. A job whose
// files are still in a reception an hour past the receiver's max_open_time
// after the last walk ended ends partial, with the reason "settling timed
// out" and the files left in processing counted. Its counts keep moving
// after it ended until processing is zero, and EVENT_TYPE_JOB_PROGRESS
// events go on for it until then; its state does not change. Its states:
// done, every file found has an outcome and none was quarantined, lost,
// failed or discarded, or skipped as unreadable, too large, as a
// directory too wide or as a path too long (files skipped by design, not
// DICOM, outside the layout, of an unmapped session, or not regular files,
// leave it done); partial, otherwise; failed, a unit's attempts ran out or
// its root was unavailable, with what it had handed in still counted and
// still settling; canceled, by CancelJob, which withdraws nothing already
// handed in: those files go on to their outcome and are counted. Each file
// skipped, quarantined, lost, failed or discarded is
// listed, with its path, to an operator by ListImportFiles, up to
// job.failures-kept. A job made again over the same tree finds the files
// added since as new and the others as already held. Events carry counts
// only (JobCounts), never a path; the audit records the receiver's root by
// name and the job's id.
//
// A path can hold what identifies a person (a folder named after a
// patient), so a path is kept only in the tenant's database (a unit's
// cursor and folder, a skipped file's row, an arrival's record, a
// quarantined file's record), answered only to an operator or more on the
// tenant, and never written to a log, an event or an audit entry; and so
// is a map, inline or read from a file.
//
// A job meets the archive as it is now, before each instance: an instance
// deleted since the job was made is counted refused
// (JOB_FAILURE_CODE_DELETED_IN_ARCHIVE), one marked damaged is read from a
// replica in step for its scan when the tenant has one and fails as data
// loss otherwise, and a replaced one is sent or read at its current revision, which
// its outcome records. An instance whose transfer had started when a
// correction committed finishes, since a store cannot be taken back, and
// is tallied "superseded_during_send". A job belongs to the tenant, not to
// the key that made it: revoking that key does not stop it; CancelJob
// does. While the tenant is restoring, moved or fenced, its units stop
// with their place kept, and the job's reason says "tenant restoring",
// "tenant moved" or "tenant fenced". A unit that meets an object an
// archive-tier storage answers not online asks for the object's recall
// (ReplicaService) and waits with its place kept, spending no attempt, the
// job's reason "recalling"; it goes on once the object is online, and
// counts the instance refused as JOB_FAILURE_CODE_NOT_ONLINE only when the
// tenant's setting recall.wait passes first. On an online-tier storage, an
// object answered not online is a temporary failure of the unit, tried
// again until its attempts run out.
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE. No
// answer of this service speaks of another tenant.
service JobService {
  // CreateJob makes a job and queues its work. A send job names a sender
  // the tenant has, enabled or not (a disabled sender's jobs wait), and a
  // subject, a session of it or a scan of that, by labels. A deid job names
  // its mode, a profile version for a dry run, and a subject, a session of
  // it, a scan of that, or none for the whole tenant. A scrub job names a
  // storage, or none for every storage. A rebuild job names its mode; one
  // that replaces the catalog also needs admin on the tenant, checked after
  // the requirement below, since it empties the catalog and fills it again,
  // and is answered permission denied to an operator; a rebuild may name
  // from_storage only in compare mode. An import job that sets
  // retention_start needs admin on the tenant likewise, since it decides
  // when retention counts from (RetentionService). An import job names
  // an import receiver of the tenant, a path under its root and optionally
  // a map (a file under the root, or inline); the root is resolved, the
  // path opened and the map read and checked before the job is made, so a
  // tree that is not there or a map that names two values for one key is
  // refused here, not found out later. The map is kept with the
  // job as it was read then, so a map file changed later changes nothing
  // of the job or of a retry of it. A refusal of a map names the line it
  // found at fault by number only, never a cell, the header or a path. An
  // import job of a disabled receiver is made and waits, its units queued,
  // until the receiver is enabled, as a send job waits for its sender. Two
  // import jobs of one receiver never read the same files at once: a job
  // whose path equals, lies under or contains (segment by segment, so "a"
  // contains "a/b" and not "ab") the path of a queued or running import job
  // of the same receiver is refused.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the new job's id as its
  // object, and its kind, its sender and the path of labels of its target
  // in details; for a scrub, its storage; for a rebuild, its mode; for an
  // import, its receiver and its root's name, never its path or map file.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also no kind, a label that does not pass the label rule, a level named
  // without the one above it, and a reception given, which only the
  // server sets; for an import, a path or map file that breaks the path
  // rule, both a map file and an inline map, an inline map past 3 MiB,
  // counts given, which only the server sets, and a map configuration
  // given in part or that breaks its rule), not found (the tenant holds no subject, session or scan
  // with those labels; the tenant has no profile version of that name and
  // number; a tenant that does not exist, for a caller who may list every
  // tenant), precondition (a sender the tenant does not have; a scrub of a
  // storage the tenant does not have, or while another scrub of it is
  // queued or running; a rebuild while another rebuild is queued or
  // running, or whose scratch_schema does not exist, holds a table, is the
  // tenant's own schema or is on its search_path, or whose from_storage the
  // tenant does not have; for an import, a
  // receiver the tenant does not have or that is not an import receiver,
  // a retention_start after the job's create_time or before 1970,
  // a root import.roots no longer names or import.allowed-roots no longer
  // allots to the tenant, a root whose path now resolves to another
  // directory than when it was set (a link in it changed), a path that is
  // not a directory under the root, a map file that cannot be read, is
  // larger than 3 MiB, is not UTF-8, lacks a configured column or names
  // two values for one key, a map with no map configuration (the job's or
  // the receiver's), a map key part the layout does not give or a
  // map_gives part it already gives, a receiver whose naming rule uses the
  // part a map gives with no map, or a queued or running
  // import job of the same receiver whose path overlaps this one's by
  // segment; for every kind, a tenant moved or fenced,
  // with ErrorInfo reason TENANT_MOVED or TENANT_FENCED), unavailable (the tenant's database does not answer, or the
  // tenant is not ready; for an import, the file system under the root
  // does not answer the job's check within 30 seconds, or the receiver or
  // its root changed while the job was checked, and the same request may
  // be sent again).
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);

  // GetJob answers one job, with its counts now and, for a deid job, its
  // tallies.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListJobs answers a tenant's jobs, newest first by their create_time,
  // filtered by state, sender and time.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the filters in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CancelJob ends a queued or running job as canceled. Its units that have
  // not started are ended in the same transaction; a unit sending ends
  // within one batch (at most 64 instances or one second), and what the
  // peer answered for that batch is still counted, since the peer holds it.
  // A job already canceled is answered as it stands, so a repeated call
  // ends nothing more. An import job's walk stops within one file; what it
  // already handed in is not withdrawn and goes on to its outcome, counted.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), precondition (the job
  // has ended done, partial or failed; a tenant moved or fenced, with
  // ErrorInfo reason TENANT_MOVED or TENANT_FENCED), unavailable (the tenant's database
  // does not answer, or the tenant is not ready).
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RetryJob sends again what an ended job did not send: its refused
  // instances and those it never sent, once their cause is mended (a peer
  // that takes the SOP class now, say). The ended job stays as it is, with
  // retry_job naming the new one: a new job of the same kind, sender and
  // target, with retry_of set, whose instances are exactly those, and no
  // instance archived since. A job already retried is answered as it
  // stands, so a repeated call starts nothing more.
  //
  // For an import job, the new job has the same receiver, path, map (the
  // one kept with the ended job, checked again) and map configuration,
  // and its units are the ended job's units that failed or were canceled,
  // and those with a file lost, or skipped as unreadable, too large or in
  // a directory too wide; each walks its folder again from the start, so
  // what is already held counts as already held. A file quarantined,
  // failed or discarded is not retried: it is released, retried or sent
  // again through QuarantineService, ReceptionService or the source. The
  // retry of an import job is not served yet: it is answered
  // UNIMPLEMENTED, and a new import job over the same path stands for it,
  // counting what is held as already held.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the ended job's id as its
  // object and the new job's id in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), precondition (the job
  // is queued or running, or ended done with nothing to send again; its
  // sender has been removed; for an import, its receiver has been removed
  // or its root, layout, path pattern or unit depth changed since the job
  // was made, every precondition CreateJob checks of an import, or no unit
  // to walk again; a dispose job, which a new preview and Dispose replace;
  // for every kind, a tenant moved or fenced, with ErrorInfo
  // reason TENANT_MOVED or TENANT_FENCED), unavailable (the tenant's database does not
  // answer, or the tenant is not ready), unimplemented (an import job,
  // whose retry is not served yet).
  rpc RetryJob(RetryJobRequest) returns (RetryJobResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListJobFailures answers the instances a job's peer refused, or that
  // were refused before they reached it, each with its reason; and, with
  // include_warnings, those sent with a warning. Ordered by subject label,
  // session label, scan label, then SOP Instance UID, each compared byte by
  // byte. At most job.failures-kept are kept per job; the job's
  // failures_not_listed counts the others. An import job's files are listed
  // by ListImportFiles, to an operator, since they are named by path; this
  // method answers none for it.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc ListJobFailures(ListJobFailuresRequest) returns (ListJobFailuresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListImportFiles answers the files of an import job that did not reach
  // the archive, each by its path under the root, with why: those skipped
  // (by IMPORT_SKIP_CODE), those
  // quarantined (with the quarantined file's id and reason), those lost,
  // failed or discarded. Ordered by path in the walk's order (segment by segment, each byte by
  // byte). At most job.failures-kept are kept per job; the job's
  // failures_not_listed counts the others. A page never passes 4 MB, so it
  // may hold fewer files than page_size, or none; only an empty
  // next_page_token means the last page.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object;
  // no path is recorded.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), precondition (the job is
  // not an import job), unavailable (the tenant's database does not answer,
  // or the tenant is not ready).
  rpc ListImportFiles(ListImportFilesRequest) returns (ListImportFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListImportUnits answers the units of an import job, each with its
  // folder under the root, its state and its counts, so the job's
  // reconciliation can be checked folder by folder; the listing unit is
  // one of them, its folder the job's path. Ordered by folder in the walk's
  // order. A page never passes 4 MB, so it may hold fewer units than
  // page_size, or none; only an empty next_page_token means the last page.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the job's id as its object;
  // no path is recorded.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no job with that id; a tenant that does not
  // exist, for a caller who may list every tenant), precondition (the job is
  // not an import job), unavailable (the tenant's database does not answer,
  // or the tenant is not ready).
  rpc ListImportUnits(ListImportUnitsRequest) returns (ListImportUnitsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// JobState is where a job is. A job goes forward only; done, partial,
// failed and canceled are ends that nothing leaves. A state added in a
// later version is a new value, and a client shows a state it does not know
// as one in progress.
enum JobState {
  // Never answered by the server. As a filter, it is refused as invalid.
  JOB_STATE_UNSPECIFIED = 0;

  // Made; none of its work has started yet, as while its sender is down or
  // disabled, or the server's bounds on associations are taken; for an
  // import, while its receiver is disabled or the bounds on import units
  // are taken.
  JOB_STATE_QUEUED = 1;

  // Some of its work has started. An import stays running, with the reason
  // "settling", after its walks end until every file it handed in has an
  // outcome.
  JOB_STATE_RUNNING = 2;

  // Ended. Every instance was sent, some perhaps with a warning; for a
  // deid job, every instance passed, some perhaps with a note; for an
  // import, every file found has an outcome and none was quarantined,
  // lost, failed, discarded, or skipped for a cause that may hide DICOM
  // (unreadable, too large, a directory too wide).
  JOB_STATE_DONE = 3;

  // Ended. Some instances were refused; every other one was sent. For a
  // deid job: some did not pass. For an import: some files were
  // quarantined, lost, failed, discarded or skipped for such a cause, or
  // settling timed out with files still processing.
  JOB_STATE_PARTIAL = 4;

  // Ended without finishing: attempts ran out with instances not sent. The
  // job's reason says why. RetryJob sends what it did not. For an import:
  // a unit's attempts ran out or its root was unavailable; what it handed
  // in still goes on to its outcome, counted.
  JOB_STATE_FAILED = 5;

  // Ended by CancelJob, or by the removal of its sender with cancel_jobs.
  // An import's files already handed in are not withdrawn.
  JOB_STATE_CANCELED = 6;
}

// JobCounts are a job's instances and bytes so far. An instance counts in
// exactly one of sent, sent with a warning, refused and remaining: instances
// equals instances_sent + instances_warned +
// instances_refused + instances_remaining at every answer, and the same
// for bytes. Bytes are those of the archived files: the DICOM file header
// and the data set. The counts are totals, never changes since the last
// answer, so a client that sees one event twice counts nothing twice.
//
// For an import job they count files met, from ImportCounts: instances is
// found plus handed_again (a file handed in twice counts twice);
// instances_sent is archived plus already_held; instances_refused is
// skipped plus quarantined plus lost plus failed plus discarded;
// instances_remaining is processing;
// instances_warned is 0; so the identity above holds at every answer. Its
// bytes are 0 (ImportCounts.bytes_handed_in has them); scans and
// scans_done count its units; listed says every unit is queued.
message JobCounts {
  // The instances of the job's target. It grows while the job lists its
  // scans, a page at a time, and by an instance whose archive ended after
  // its scan was listed; listed says when every scan is listed.
  int64 instances = 1;

  // The bytes of those instances.
  int64 bytes = 2;

  // Instances the peer answered success for.
  int64 instances_sent = 3;

  // Bytes of the instances sent.
  int64 bytes_sent = 4;

  // Instances the peer kept with a warning: it changed what it keeps.
  int64 instances_warned = 5;

  // Bytes of the instances sent with a warning.
  int64 bytes_warned = 6;

  // Instances refused, by the peer or before they reached it
  // (JobFailureCode).
  int64 instances_refused = 7;

  // Bytes of the instances refused.
  int64 bytes_refused = 8;

  // Instances not sent yet; in an ended job, those it never sent.
  int64 instances_remaining = 9;

  // Bytes of the instances not sent.
  int64 bytes_remaining = 10;

  // The scans of the job's target, one unit of work each.
  int64 scans = 11;

  // The scans whose unit has ended, whatever it sent.
  int64 scans_done = 12;

  // Whether every scan of the target is listed, so scans is final;
  // instances and bytes are too, but for an archive that ended after its
  // scan was listed.
  bool listed = 13;
}

// SendJob is a job that sends archived instances to one sender: those of a
// subject, of a session of it, or of a scan of that; or, for a job a
// receiver's forward made, those one reception archived.
message SendJob {
  // The name of the tenant's sender it sends to. Required. A sender
  // removed later keeps its name here, and no other sender is given that
  // name while a job names it.
  string sender = 1;

  // The label of the subject whose instances it sends. Required.
  string subject_label = 2;

  // The label of the session of the subject whose instances it sends.
  // Empty for every session of the subject.
  string session_label = 3;

  // The label of the scan of the session whose instances it sends. Empty
  // for every scan of the session; needs session_label.
  string scan_label = 4;

  // The id of the reception whose archived instances it sends, for a job a
  // receiver's forward_to made; then subject_label and session_label are
  // that reception's. Answered by the server; must be empty in CreateJob.
  string reception = 5;

  // The name of the receiver whose forward_to made the job, with
  // reception. Answered by the server; must be empty in CreateJob.
  string receiver = 6;
}

// DeidJobMode is what a deid job does with each archived instance.
enum DeidJobMode {
  // Never answered by the server; refused in CreateJob.
  DEID_JOB_MODE_UNSPECIFIED = 0;

  // Run a profile version over each archived file in memory, under keys
  // made for the job, and judge what it would archive and what it would
  // hold and why.
  DEID_JOB_MODE_DRY_RUN = 1;

  // Verify each archived file against the profile version the catalog
  // records for it.
  DEID_JOB_MODE_CHECK = 2;
}

// DeidJob is a job that judges archived instances against a
// de-identification profile version, changing nothing: those of a subject,
// of a session of it, of a scan of that, or of the whole tenant.
message DeidJob {
  // What it does. Required.
  DeidJobMode mode = 1;

  // For a dry run, the name of the tenant's profile whose version it runs;
  // empty runs over each instance the version the catalog records for it,
  // and passes one archived as received with a note. Empty for a check,
  // which always verifies against the version each instance records.
  string profile = 2;

  // The version of profile: 0 in CreateJob for its latest, which the job
  // fixes when it is made and answers here. 0 when profile is empty.
  int32 profile_version = 3;

  // The label of the subject whose instances it judges. Empty, with the
  // session and scan empty, for every instance of the tenant.
  string subject_label = 4;

  // The label of the session of the subject whose instances it judges.
  // Empty for every session of the subject.
  string session_label = 5;

  // The label of the scan of the session whose instances it judges. Empty
  // for every scan of the session; needs session_label.
  string scan_label = 6;
}

// ScrubJob is a job that reads every stored object of the tenant, or of
// one of its storages, and compares it with what the catalog and the
// scan's manifest say it should be, changing no stored byte.
message ScrubJob {
  // The name of the tenant's storage it reads. Empty for every storage of
  // the tenant.
  string storage = 1;

  // Whether the server made it by itself, every scrub.interval, rather
  // than a person with CreateJob. Answered by the server; must be false in
  // CreateJob.
  bool scheduled = 2;
}

// RebuildJobMode is what a rebuild job does with the catalog it builds.
enum RebuildJobMode {
  // Never answered by the server; refused in CreateJob.
  REBUILD_JOB_MODE_UNSPECIFIED = 0;

  // Build a shadow catalog and tally each difference from the one in use,
  // which is not touched; then drop the shadow.
  REBUILD_JOB_MODE_COMPARE = 1;

  // Build a shadow catalog, then make it the catalog in use in one
  // transaction; the catalog in use serves until then, and the tenant's
  // receivers refuse new data from the moment the job is queued until it
  // ends. Needs admin on the tenant; an operator is answered permission
  // denied. The activation is refused, and the job ends failed, while a
  // job not ended names a scan the rebuilt catalog removes or changes.
  REBUILD_JOB_MODE_REPLACE = 2;
}

// RebuildJob is a job that makes a tenant's catalog again from the
// manifests and metadata its storages hold, with no help from the
// catalog it replaces or compares with.
message RebuildJob {
  // What it does. Required.
  RebuildJobMode mode = 1;

  // On a tenant whose database is Postgres, the schema of that database
  // the shadow catalog is built in, in either mode: one the database's own
  // administrator made for this, and that the job empties again when it
  // ends. It must hold no table when the job starts, and must be neither
  // the schema the tenant's own tables live in nor one on the tenant's
  // connection's search_path, so the shadow can never be taken for the
  // catalog in use; otherwise CreateJob is refused as precondition. 1 to 63 bytes of a-z, 0-9 and "_", starting with a
  // letter (a Postgres identifier that needs no quoting). Required then;
  // must be empty on SQLite, where the shadow is a file the server makes in
  // its data directory and removes when the job ends.
  string scratch_schema = 2;

  // For a compare, the name of the one storage the shadow is built from,
  // as if the tenant had no other: its correction records, manifests and
  // metadata alone. It is compared with the catalog's scans on that
  // storage, or, for a replica, on its primary, so an empty difference
  // shows the storage alone could stand for the catalog. Empty to read
  // every storage of the tenant; must be empty in replace mode (invalid
  // otherwise).
  string from_storage = 3;
}

// ReplicateJobMode is what a replicate job copies. A mode added in a later
// version is a new value.
enum ReplicateJobMode {
  // Never answered by the server.
  REPLICATE_JOB_MODE_UNSPECIFIED = 0;

  // Every object of the primary the replica does not hold verified: what
  // the primary held before the replica was attached, or what a replica
  // restored from elsewhere lacks.
  REPLICATE_JOB_MODE_BACKFILL = 1;
}

// ReplicateJob is a job that copies what a primary storage holds to one of
// its replicas. Made by ReplicaService or by the server, never by
// CreateJob.
message ReplicateJob {
  // The name of the replica it copies to. A replica detached later keeps
  // its name here; its job is canceled.
  string replica = 1;

  // The name of its primary when the job was made.
  string primary = 2;

  // What it copies.
  ReplicateJobMode mode = 3;

  // Whether the server made it by itself, when the replica was attached,
  // rather than a person with BackfillReplica.
  bool scheduled = 4;
}

// RepairJob is a job that puts back on a primary storage the objects scrubs
// found missing or damaged there, read from a replica. Made by
// ReplicaService.Repair, or by the server when the tenant's setting
// replica.repair is "auto"; never by CreateJob.
message RepairJob {
  // The name of the primary it repairs.
  string storage = 1;

  // The name of the replica it reads from, when one was named; empty for
  // any replica in step for each object's scan.
  string from = 2;

  // The ids of the findings it mends (ListScrubFindings); empty when it
  // mends every finding that held when it was made.
  repeated string findings = 3;

  // Whether it mends every finding that held on the storage when it was
  // made.
  bool all = 4;

  // Whether the server made it by itself, under replica.repair "auto",
  // rather than a person.
  bool automatic = 5;
}

// DisposeJob is a job that deletes a retention rule's due sessions, as a
// disposal listed them. Made by RetentionService.Dispose, or by the
// server's daily pass for a rule whose action is delete; never by
// CreateJob.
message DisposeJob {
  // The name of the rule whose due sessions it deletes. A rule removed
  // later keeps its name here.
  string rule = 1;

  // The reason each delete carries: the admin's, for Dispose; empty for
  // the daily pass, whose deletes each carry one the server writes,
  // "retention rule <rule>, due <date>" (Correction.created_by_key_id).
  // Never a value read from a file.
  string reason = 2;

  // The sessions it was made to delete.
  int64 sessions = 3;

  // Whether the server's daily pass made it, rather than an admin's
  // Dispose.
  bool scheduled = 4;
}

// ImportJob is a job that hands the files of a directory under an import
// receiver's root to that receiver (ImportReceiver).
message ImportJob {
  // The name of the tenant's import receiver the files are handed to.
  // Required. A receiver removed later keeps its name here, and no other
  // receiver is given that name while a job names it.
  string receiver = 1;

  // The directory read, by its path relative to the receiver's root, its
  // segments joined by "/": each 1 to 255 bytes of UTF-8, none "." or
  // "..", none holding "\", ":" or NUL (a separator or a drive on another
  // system); no empty segment, no leading or trailing "/"; at most 2048
  // bytes, the longest path the server keeps in an index of its database;
  // empty for the whole root. Each segment is opened under the root
  // without following a link, and the last must be a directory. A path can
  // hold what identifies a person, so it is answered only to an operator or
  // more on the tenant, and empty to a reader, and never written to a log,
  // an event or an audit entry.
  string path = 2 [debug_redact = true];

  // The map file, by its path relative to the receiver's root, under the
  // rules of path; it must be inside that root. Empty, with map_csv empty,
  // uses the receiver's (ImportReceiver.map_file), and none when it has
  // none. At most one of map_file and map_csv is given. The file is read
  // when the job is made and kept with it in map_csv's place, so it is at
  // most 3 MiB, as map_csv is; a larger file is refused by its size before
  // it is read. Answered and kept as path is.
  string map_file = 3 [debug_redact = true];

  // Number 4 was a switch that took the subject from one fixed attribute
  // for one fixed layout. A label from a file's header is the naming
  // rule's (a template such as "{project}_{PatientName}"), so nothing
  // replaces it here.
  reserved 4;
  reserved "subject_from_headers";

  // What became of the files it found so far. Answered by the server; must
  // be absent in CreateJob.
  ImportCounts counts = 5;

  // The map itself, inline, in the form ImportReceiver describes, for a map
  // that is not in the root: at most 3 MiB. Kept with the job as given.
  // It holds subjects' labels as the source system kept them, which can be
  // names, so it is answered only to an operator or more on the tenant, in
  // GetJob alone (empty in every other answer, and to a reader), and never
  // written to a log, an event or an audit entry.
  bytes map_csv = 6 [debug_redact = true];

  // The map configuration for this job's map, under the rules of
  // ImportReceiver's fields of the same names, replacing the receiver's
  // whole: the four are given together or not at all (invalid otherwise),
  // and empty uses the receiver's. map_gives must be the part the
  // receiver's naming rule takes from a map, since the rule was checked
  // against it when the receiver was set.
  repeated string map_key_columns = 7;

  // The map's column whose value fills map_gives (ImportReceiver).
  string map_value_column = 8;

  // The layout's parts whose values form a file's key, in the order of
  // map_key_columns (ImportReceiver).
  repeated string map_key_parts = 9;

  // The part the map fills (ImportReceiver).
  string map_gives = 10;

  // When retention counts from for every session this job archives
  // (RetentionService), in place of the time the server archives it: an
  // older archive's own date of archiving, as its keeper recorded it.
  // Absent for the time of archiving, by the server's clock. Never read
  // from a file's header: no DICOM date sets it. Setting it needs admin on
  // the tenant (CreateJob), and it is recorded in the job's audit entry;
  // it must lie from 1970-01-01T00:00:00Z to the job's create_time
  // (a precondition failure otherwise). A session the tenant held before keeps its own
  // start. A session that takes its start from here is never due before
  // the time it was archived plus the tenant's retention.shorten-notice,
  // so an old date cannot make an import due the night it lands.
  google.protobuf.Timestamp retention_start = 11;
}

// ImportSkipCode is why an import job did not hand a file in. A code added
// in a later version is a new value; a client shows a code it does not
// know as skipped for a reason it cannot name.
enum ImportSkipCode {
  // Never answered by the server.
  IMPORT_SKIP_CODE_UNSPECIFIED = 0;

  // Its first 132 bytes are not a Part 10 preamble followed by "DICM"
  // (PS3.10 7.1): not a DICOM file, or a data set written without its file
  // header, which carries no transfer syntax to read it by.
  IMPORT_SKIP_CODE_NOT_PART10 = 1;

  // Its path does not match the receiver's layout.
  IMPORT_SKIP_CODE_OUTSIDE_LAYOUT = 2;

  // Its key (its values of the parts map_key_parts names) is not a row of
  // the job's map; most often a session folder its source no longer lists.
  IMPORT_SKIP_CODE_UNMAPPED_SESSION = 3;

  // A directory holding more entries than the setting
  // import.max-dir-entries, skipped whole without reading its files; it
  // counts once, as one entry found. Raising the setting and retrying the
  // job imports it.
  IMPORT_SKIP_CODE_DIRECTORY_TOO_WIDE = 4;

  // A file or directory the server could not open or read through (no
  // permission, an input or output error, removed while the unit ran).
  IMPORT_SKIP_CODE_UNREADABLE = 5;

  // Not a regular file or directory: a symbolic link, which an import never
  // follows, a device, a socket or a named pipe. On systems that report
  // them, also a file with more than one hard link, whose other names may
  // lie outside the root, and a file or directory on another file system
  // than the root's (a mount point and what lies under it), which the
  // root's owner may not have meant to expose.
  IMPORT_SKIP_CODE_NOT_REGULAR = 6;

  // Larger than the receiver's max_file_bytes. It is not copied, so it does
  // not take room in the incoming area or a quarantine record; it makes the
  // job partial, since it may be DICOM the archive lacks.
  IMPORT_SKIP_CODE_TOO_LARGE = 7;

  // Number 8 was one other system's index file, read as a check; the check
  // is removed, and such a file is skipped as IMPORT_SKIP_CODE_NOT_PART10
  // like any file that is not DICOM. The number and name are not used
  // again.
  reserved 8;
  reserved "IMPORT_SKIP_CODE_CATALOG_FILE";

  // A file or directory whose path relative to the root is longer than
  // 2048 bytes (ImportJob.path), the longest path the server keeps in an
  // index of its database. It is not handed in, and a directory is not
  // entered; each such entry counts once, as one entry found, and is listed
  // (ImportFile) under the deepest folder above it whose path fits, which
  // the entries too long of one folder share. It makes the job partial,
  // since it may be DICOM the archive lacks; moving or renaming the tree
  // to shorten its paths and making a job again imports it.
  IMPORT_SKIP_CODE_PATH_TOO_LONG = 9;

  // A file or directory whose name breaks the rule of a path segment: it
  // holds "\" or ":" (a separator or a drive on Windows), is not valid
  // UTF-8, or is longer than 255 bytes. Such a name can be kept in no row
  // nor read back the same on every system, so it is not handed in, and a
  // directory is not entered. Each such entry counts once, as one entry
  // found, and is listed (ImportFile) under the folder that holds it, which
  // the entries of one folder with such names share; the name itself is
  // never stored, logged or answered. It makes the job partial, since it may
  // be DICOM the archive lacks; renaming the entry and making a job again
  // imports it.
  IMPORT_SKIP_CODE_BAD_NAME = 10;
}

// ImportSkipCount is how many files an import job skipped for one reason.
message ImportSkipCount {
  // The reason.
  ImportSkipCode code = 1;

  // How many.
  int64 count = 2;
}

// ImportQuarantineCount is how many files an import job handed in were
// quarantined for one reason.
message ImportQuarantineCount {
  // The reason.
  QuarantineReason reason = 1;

  // How many.
  int64 count = 2;
}

// ImportCounts are what became of the files an import job, or one of its
// units, found so far. Totals, never changes since the last answer. They
// reconcile at every answer:
//
//   found + handed_again = skipped + handed_in
//   handed_in = archived + already_held + quarantined + lost + failed
//               + discarded + processing
//
// where skipped and quarantined are the sums of their counts by reason.
// label_differs stands beside these and is in none of the sums. found,
// skipped and handed_in are
// written with each file's record and the unit's cursor in one
// transaction, and each outcome in the transaction that decides it, so
// the identities hold at every answer, across a crash too.
message ImportCounts {
  // The entries the walk met that it judged: each file, and each directory
  // it skipped whole. Directories walked are not counted.
  int64 found = 1;

  // The files skipped, by reason, most first; a reason with none is not
  // listed.
  repeated ImportSkipCount skipped = 2;

  // The files handed to the receiver, each landed in the incoming area.
  int64 handed_in = 3;

  // The files handed in a second time after a unit went on from its cursor
  // following a crash or a lost lease. Always 0 in this version, which
  // writes each hand-off with the cursor; kept so that a later version
  // that batches those writes can count what it hands in again.
  int64 handed_again = 4;

  // The files archived: a new instance in the catalog.
  int64 archived = 5;

  // The files the tenant already held: the same SOP Instance UID with the
  // same checksum as received (for a receiver that de-identifies, the same
  // keyed checksum) as the instance has or had at any revision, so nothing
  // new was stored. One matching a revision a correction replaced is
  // tallied "superseded_revision" in the job's tallies.
  int64 already_held = 6;

  // The files quarantined, by reason, most first.
  repeated ImportQuarantineCount quarantined = 7;

  // The files whose copy in the incoming area was gone before the pipeline
  // read it (QUARANTINE_REASON_INCOMING_LOST). The source in the root is
  // untouched, so a retry hands it in again.
  int64 lost = 8;

  // The files handed in that the pipeline has not decided yet. The job
  // ends only when it is zero, or settling times out.
  int64 processing = 9;

  // The bytes of the files handed in, as read from the root.
  int64 bytes_handed_in = 10;

  // The files archived or already held into a session whose label differs
  // from the one their path would make: a session keeps the label it was
  // first given.
  int64 label_differs = 11;

  // Numbers 12, 13, 14 and 19 counted a check against one other system's
  // index files, which is removed; they are not used again.
  reserved 12, 13, 14, 19;
  reserved "listed_not_found", "found_not_listed", "digest_differs", "catalogs_not_checked";

  // The job's units: the listing unit, and one per folder at the layout's
  // unit depth. For a unit's own counts, 1.
  int64 units = 15;

  // The units whose walk has ended, whatever it found.
  int64 units_walked = 16;

  // The files whose reception failed (ReceptionService), their bytes kept
  // in the incoming area. RetryReception moves them back to processing.
  int64 failed = 17;

  // The files whose reception a person discarded
  // (ReceptionService.DiscardReception).
  int64 discarded = 18;
}

// JobTally is one count of what a deid job found, under a key of fixed
// words and the profile's names, never a value read from a file. A key is
// its kind, then its parts, joined by "|":
//
//   - "rule|<rule>|<action>": the elements a rule of the version decided
//     with that action, in a dry run; <rule> is the rule's name, or "rule
//     <n>" for one without a name (its position from 1), or "default".
//   - "hold|<reason>|<cause>": the files the version would hold for that
//     quarantine reason and cause, in a dry run.
//   - "class|<SOP Class UID>|passed" and "class|<SOP Class UID>|refused":
//     the files of a class that passed and that did not.
//   - "check|<finding>" and "check|<finding>|<tag>": the files a check
//     found that in, and the elements by tag (eight hexadecimal digits),
//     such as "check|removed_element|00100030". The findings:
//     removed_element, private_element, kept_value, identity_not_removed,
//     method_missing, received_uid, engine_refused, unreadable; and the
//     notes check|undecidable, check|as_received, check|too_large.
//   - "other": the counts of keys past the 1000 a job keeps.
message JobTally {
  // The key.
  string key = 1;

  // How many.
  int64 count = 2;
}

// Job is one piece of work in a tenant, and how far it got.
message Job {
  // The job's id, made by the server, unique in the tenant. Opaque, at most
  // 64 bytes.
  string id = 1;

  // The job's kind and what it acts on. Exactly one is set. A client that
  // finds none of the fields it knows set is reading a kind added later,
  // and shows its state and counts alone.
  oneof kind {
    // Archived instances sent to a sender.
    SendJob send = 2;

    // Archived instances judged against a de-identification profile
    // version.
    DeidJob deid = 14;

    // Stored objects read again and compared with the catalog.
    ScrubJob scrub = 16;

    // The catalog made again from the storages.
    RebuildJob rebuild = 17;

    // The files of a directory handed to an import receiver. Named
    // import_job, not import, since import is a keyword of Python.
    ImportJob import_job = 18;

    // What a primary holds copied to a replica.
    ReplicateJob replicate = 19;

    // Damaged or missing objects of a primary put back from a replica.
    RepairJob repair = 20;

    // A retention rule's due sessions deleted.
    DisposeJob dispose = 21;
  }

  // Where it is.
  JobState state = 3;

  // Its instances and bytes so far.
  JobCounts counts = 4;

  // Why it is not moving, or why it ended as it did, in words for a
  // person, from a fixed set of phrases the server has, such as "sender
  // down", "sender disabled" or "attempts ran out"; for an import job
  // also "receiver disabled", "root unavailable", "settling" (running,
  // every walk ended, some files without an outcome yet) and "settling
  // timed out" (ended partial with files still processing); for a unit
  // waiting for an object's recall, "recalling"; for a dispose job of the
  // daily pass while retention is paused, "clock jumped"; at most 256
  // bytes. Empty while nothing holds it back, and for a job done.
  // It never holds a secret, a path or the peer's own words.
  string reason = 5;

  // The id of the key that made it; empty when the local operator or a
  // receiver's forward_to did (SendJob.receiver says which).
  string created_by_key_id = 6;

  // When it was made: also the moment whose catalog it sends.
  google.protobuf.Timestamp create_time = 7;

  // When its first work started. Absent until then.
  google.protobuf.Timestamp start_time = 8;

  // When it reached its state.
  google.protobuf.Timestamp state_time = 9;

  // When it ended. Absent while it is queued or running.
  google.protobuf.Timestamp end_time = 10;

  // The id of the ended job whose unsent instances this one sends. Empty
  // unless RetryJob made it.
  string retry_of = 11;

  // The id of the job RetryJob made from this one. Empty unless it was
  // retried.
  string retry_job = 12;

  // The refused instances, and those sent with a warning, that are counted
  // and not listed by ListJobFailures, past the setting job.failures-kept.
  int64 failures_not_listed = 13;

  // Its counts per rule, reason, finding or difference so far, most first
  // and then by key; at most 1001 (JobTally, and the tallies JobService
  // names for a scrub, a rebuild, a replicate, a repair, a send's
  // "superseded_during_send" and an
  // import's "superseded_revision").
  // Answered by GetJob alone; empty in every other answer.
  repeated JobTally tallies = 15;
}

// JobFailureCode is why an instance of a job was refused, or that it was
// sent with a warning. A code added in a later version is a new value; a
// client shows a code it does not know as refused for a reason it cannot
// name.
enum JobFailureCode {
  // Never answered by the server.
  JOB_FAILURE_CODE_UNSPECIFIED = 0;

  // The peer refused it: a DIMSE peer answered its C-STORE with a failure
  // status, in peer_status (PS3.4 B.2.3); a stow peer listed it in the
  // Failed SOP Sequence, its Failure Reason (0008,1197) in peer_status
  // (PS3.18 Table I.2-2), or refused the whole request with a 4xx other
  // than 401, 403, 407, 408 and 429.
  JOB_FAILURE_CODE_PEER_REFUSED = 1;

  // Sent, and the peer kept it with a warning: a DIMSE peer answered
  // B000, B006 or B007 in peer_status; a stow peer gave a Warning Reason
  // (0008,1196) in peer_status. Listed only with include_warnings.
  JOB_FAILURE_CODE_PEER_WARNING = 2;

  // Not sent: the DIMSE peer rejected every presentation context of the
  // instance's SOP class (PS3.8 9.3.3.2, abstract syntax not supported).
  JOB_FAILURE_CODE_CLASS_NOT_ACCEPTED = 3;

  // Not sent: the DIMSE peer accepts the instance's SOP class, but not in
  // the transfer syntax it is stored in (PS3.8 9.3.3.2, transfer syntaxes
  // not supported). The server does not convert it to another syntax.
  JOB_FAILURE_CODE_SYNTAX_NOT_ACCEPTED = 4;

  // Sent twice to a stow peer whose answer listed it neither as stored nor
  // as failed (PS3.18 10.5.3), so whether the peer holds it is not known.
  JOB_FAILURE_CODE_PEER_UNACCOUNTED = 5;

  // Not sent whole: its bytes on the storage are missing or are not what
  // was archived (their SHA-256 or length differ from the catalog's). For
  // a repair job, the object was not repaired: no replica in step for its
  // scan holds a copy that reads whole with the catalog's length and
  // SHA-256 (the detail "no good copy"). A
  // DIMSE association was aborted (A-ABORT, PS3.8 9.3.8) before its last
  // fragment, and a stow request was cut before its part ended, so the peer
  // never held a whole instance. Reported as data loss, as a read of it
  // reports it (DataService).
  JOB_FAILURE_CODE_DAMAGED_IN_STORAGE = 6;

  // Not sent: its file meta information (PS3.10 7.1) cannot be read, so the
  // transfer syntax of its data set, or where the data set begins, is not
  // known; or it names another SOP class or instance than the data set's
  // own (0008,0016) and (0008,0018). Its bytes are what was archived.
  JOB_FAILURE_CODE_META_UNREADABLE = 7;

  // A deid job's dry run: the version would hold the file. The detail is
  // the quarantine reason and its cause, "<reason>/<cause>".
  JOB_FAILURE_CODE_WOULD_HOLD = 8;

  // A deid job's check: the archived file does not hold to the version it
  // records. The detail is the first finding (JobTally's check findings).
  JOB_FAILURE_CODE_CHECK_FAILED = 9;

  // A deid job passed the file with a note: a dry run's verdict depends on
  // a lookup table, which a dry run never reads; or a check could not
  // judge an element, its decision resting on a condition the archive
  // cannot answer. Listed only with include_warnings.
  JOB_FAILURE_CODE_UNDECIDED = 10;

  // A deid job passed the file with a note: it was archived as received,
  // so it records no profile version to judge it by. Listed only with
  // include_warnings.
  JOB_FAILURE_CODE_NOT_DEIDENTIFIED = 11;

  // A deid job passed the file with a note, not judging it: it is larger
  // than the 64 MiB a deid job reads into memory. Listed only with
  // include_warnings.
  JOB_FAILURE_CODE_TOO_LARGE = 12;

  // Not sent, or not judged: the instance was deleted from the archive by
  // a correction (CorrectionService.Delete) after the job was made. A job
  // never sends or reads data a person has asked to delete, so a consent
  // withdrawn while a job runs takes effect within one batch; the unit
  // counts the instance refused and goes on.
  JOB_FAILURE_CODE_DELETED_IN_ARCHIVE = 13;

  // Not sent, or not judged: the storage answered the object not online
  // (held in a tier it cannot read at once), and no copy in step on
  // another storage was online. On an archive-tier storage, the unit asked
  // for the object's recall and waited, spending no attempt, until the
  // tenant's setting recall.wait passed with the object still not online;
  // or, on an online-tier storage, it was retried as a temporary failure
  // until its attempts ran out. The bytes are not missing, so this is
  // never data loss.
  JOB_FAILURE_CODE_NOT_ONLINE = 14;
}

// JobFailure is one instance of a job that was refused, or sent with a
// warning.
message JobFailure {
  // The instance's id in the tenant, as DataService names it.
  string instance_id = 1;

  // The label of its subject.
  string subject_label = 2;

  // The label of its session.
  string session_label = 3;

  // The label of its scan.
  string scan_label = 4;

  // Why it was refused, or that it was sent with a warning.
  JobFailureCode code = 5;

  // The peer's code for it: a DIMSE peer's C-STORE status (PS3.7 Annex C),
  // or a stow peer's Failure Reason or Warning Reason; for a stow request
  // refused whole, its HTTP status, and then peer_status_http is true. Zero
  // when the peer gave none.
  int32 peer_status = 6;

  // Its SOP Class UID (0008,0016), as received, so a class the peer does
  // not take can be told; it names a kind of object, not a person.
  string sop_class_uid = 7;

  // The Transfer Syntax UID it is stored and was offered in (PS3.5 Section
  // 10).
  string transfer_syntax_uid = 8;

  // More about it, in words for a person, from a fixed set of phrases the
  // server has, such as "not accepted: transfer syntax"; at most 256 bytes.
  // Never the peer's own text.
  string detail = 9;

  // When it was refused, or sent.
  google.protobuf.Timestamp time = 10;

  // Whether peer_status is an HTTP status (RFC 9110 15), of a stow request
  // the peer refused whole with no account of each instance, rather than a
  // DICOM status. A client shows an HTTP status in decimal and a DICOM
  // status in hexadecimal, so 404 is never read as 0194.
  bool peer_status_http = 11;

  // The revision of the instance that was sent, refused or judged
  // (ArchivedFile.revision); 0 when the instance was refused before a
  // revision was read, as one deleted in the archive.
  int32 revision = 12;
}

// CreateJobRequest is the job to make.
message CreateJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's kind and what it acts on. Exactly one is required.
  oneof kind {
    // Send a subject, a session or a scan to a sender. Its reception and
    // receiver must be empty.
    SendJob send = 2;

    // Judge a subject, a session, a scan or the whole tenant against a
    // de-identification profile version. Role: operator, as every job.
    DeidJob deid = 3;

    // Read the tenant's stored objects, or one storage's, and compare them
    // with the catalog. Its scheduled must be false.
    ScrubJob scrub = 4;

    // Make the catalog again from the storages, to compare or to replace.
    // For replace, admin on the tenant.
    RebuildJob rebuild = 5;

    // Hand the files of a directory under an import receiver's root to
    // it. Its counts must be absent.
    ImportJob import_job = 6;
  }
}

// CreateJobResponse is the job made.
message CreateJobResponse {
  // The job, queued.
  Job job = 1;
}

// GetJobRequest names a job.
message GetJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;
}

// GetJobResponse is the job named.
message GetJobResponse {
  // The job, with its counts now.
  Job job = 1;
}

// ListJobsRequest asks for a page of a tenant's jobs. Every filter given
// must hold for a job to be listed.
message ListJobsRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // Only the jobs in one of these states. Empty for every state; at most 16
  // values, none of them JOB_STATE_UNSPECIFIED.
  repeated JobState states = 2;

  // Only the jobs that have not ended (queued or running, or a state a
  // later version adds). False for every job.
  bool in_progress = 3;

  // Only the send jobs to the sender of this name. Empty for every sender.
  string sender = 4;

  // Only the jobs made at or after this time. Absent for no lower bound.
  google.protobuf.Timestamp start_time = 5;

  // Only the jobs made before this time. Absent for no upper bound. Must be
  // after start_time when both are set.
  google.protobuf.Timestamp end_time = 6;

  // The most jobs to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 7;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant or filters other
  // than those it was made with.
  string page_token = 8;
}

// ListJobsResponse is a page of jobs.
message ListJobsResponse {
  // The jobs of this page, newest first.
  repeated Job jobs = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// CancelJobRequest names the job to cancel.
message CancelJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;
}

// CancelJobResponse is the job canceled.
message CancelJobResponse {
  // The job, canceled.
  Job job = 1;
}

// RetryJobRequest names the ended job whose unsent instances to send.
message RetryJobRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The ended job's id. Required; at most 64 bytes.
  string id = 2;
}

// RetryJobResponse is the ended job and the one that sends what it did not.
message RetryJobResponse {
  // The ended job, with retry_job set.
  Job job = 1;

  // The new job, queued, with retry_of set.
  Job retry = 2;
}

// ListJobFailuresRequest asks for a page of a job's failures.
message ListJobFailuresRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;

  // Whether to list the instances sent with a warning too. False lists
  // only those refused.
  bool include_warnings = 3;

  // The most failures to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 4;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant, job or
  // include_warnings other than those it was made with.
  string page_token = 5;
}

// ListJobFailuresResponse is a page of a job's failures.
message ListJobFailuresResponse {
  // The failures of this page, by scan label, then instance id.
  repeated JobFailure failures = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// ImportFileKind is what an import job's listed file is listed for. A kind
// added in a later version is a new value; a client shows a kind it does
// not know as a file that did not reach the archive.
enum ImportFileKind {
  // Never answered by the server. As a filter, it is refused as invalid.
  IMPORT_FILE_KIND_UNSPECIFIED = 0;

  // Not handed in; skip_code says why.
  IMPORT_FILE_KIND_SKIPPED = 1;

  // Handed in and quarantined; quarantined_file and quarantine_reason say
  // which record and why.
  IMPORT_FILE_KIND_QUARANTINED = 2;

  // Handed in, and its copy in the incoming area was gone before the
  // pipeline read it.
  IMPORT_FILE_KIND_LOST = 3;

  // Numbers 4, 5 and 6 were the findings of a check against one other
  // system's index files, which is removed; they are not used again.
  reserved 4, 5, 6;
  reserved "IMPORT_FILE_KIND_LISTED_NOT_FOUND", "IMPORT_FILE_KIND_FOUND_NOT_LISTED", "IMPORT_FILE_KIND_DIGEST_DIFFERS";

  // Handed in, and its reception failed; RetryReception tries it again.
  IMPORT_FILE_KIND_FAILED = 7;

  // Handed in, and its reception was discarded by a person.
  IMPORT_FILE_KIND_DISCARDED = 8;
}

// ImportFile is one file of an import job that did not reach the archive.
message ImportFile {
  // Its path relative to the receiver's root, its segments joined by "/";
  // for IMPORT_SKIP_CODE_PATH_TOO_LONG, the deepest folder above the
  // entries too long whose path fits; for IMPORT_SKIP_CODE_BAD_NAME, the
  // folder that holds the entries so named (empty for the root). It can hold what identifies a
  // person: answered only to an operator or more on the tenant, never
  // written to a log, an event or an audit entry.
  string path = 1 [debug_redact = true];

  // What it is listed for.
  ImportFileKind kind = 2;

  // Why it was skipped, for IMPORT_FILE_KIND_SKIPPED;
  // IMPORT_SKIP_CODE_UNSPECIFIED otherwise.
  ImportSkipCode skip_code = 3;

  // The id of its quarantine record (QuarantineService), for
  // IMPORT_FILE_KIND_QUARANTINED; empty otherwise.
  string quarantined_file = 4;

  // Why it was quarantined, for IMPORT_FILE_KIND_QUARANTINED;
  // QUARANTINE_REASON_UNSPECIFIED otherwise.
  QuarantineReason quarantine_reason = 5;

  // The id of the unit that found it (ImportUnit.id).
  string unit = 6;

  // Its size in bytes as the walk saw it; 0 when it was not read, as a
  // directory skipped whole.
  int64 size_bytes = 7;

  // More about it, in words for a person, from a fixed set of phrases the
  // server has, such as "import.max-dir-entries" for a directory too wide;
  // at most 256 bytes. Never the operating system's own text, which can
  // repeat a path.
  string detail = 8;

  // When it was listed.
  google.protobuf.Timestamp time = 9;

  // The id of the reception it was handed into (ReceptionService), for a
  // file quarantined, failed or discarded, so a failed one can be retried
  // there; empty otherwise.
  string reception = 10;
}

// ImportUnitState is where one unit of an import job is. A unit goes
// forward only; walked waits for outcomes, and done, failed and canceled
// are ends.
enum ImportUnitState {
  // Never answered by the server.
  IMPORT_UNIT_STATE_UNSPECIFIED = 0;

  // Queued; its walk has not started, as while the tenant runs
  // import.max-units others or the server import.server-max-units.
  IMPORT_UNIT_STATE_QUEUED = 1;

  // Walking its folder and handing files in.
  IMPORT_UNIT_STATE_WALKING = 2;

  // Its walk has ended; some files it handed in have no outcome yet.
  IMPORT_UNIT_STATE_WALKED = 3;

  // Its walk has ended and every file it handed in has an outcome.
  IMPORT_UNIT_STATE_DONE = 4;

  // Its walk ended unfinished: its attempts ran out, or its root was
  // unavailable ("root unavailable"); reason says which. What it handed in
  // still goes on to its outcome and is counted.
  IMPORT_UNIT_STATE_FAILED = 5;

  // Ended by CancelJob before its walk ended.
  IMPORT_UNIT_STATE_CANCELED = 6;
}

// ImportUnit is one unit of an import job: one folder, walked and resumed
// on its own.
message ImportUnit {
  // The unit's id, made by the server, unique in the job. Opaque, at most
  // 64 bytes; it names no path.
  string id = 1;

  // Its folder relative to the receiver's root, its segments joined by "/".
  // It can hold what identifies a person: answered only to an operator or
  // more on the tenant, never written to a log, an event or an audit entry.
  string folder = 2 [debug_redact = true];

  // Where it is.
  ImportUnitState state = 3;

  // What became of the files it found so far; units is 1.
  ImportCounts counts = 4;

  // Why it is not moving, or why it failed, from the same fixed set of
  // phrases as Job.reason; at most 256 bytes. Never a path.
  string reason = 5;

  // The attempts it has used, of 30.
  int32 attempts = 6;

  // When its walk ended. Absent until then.
  google.protobuf.Timestamp walk_end_time = 7;
}

// ListImportFilesRequest asks for a page of an import job's files that did
// not reach the archive.
message ListImportFilesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;

  // Only the files of these kinds. Empty for every kind; at most 16
  // values, none of them IMPORT_FILE_KIND_UNSPECIFIED.
  repeated ImportFileKind kinds = 3;

  // Only the files of the unit with this id. Empty for every unit.
  string unit = 4;

  // The most files to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 5;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; a position it holds is sealed by the server, so a token a client
  // logs shows no path; at most 1 KiB; refused as invalid with a tenant,
  // job or filters other than those it was made with.
  string page_token = 6;
}

// ListImportFilesResponse is a page of an import job's files.
message ListImportFilesResponse {
  // The files of this page, by path.
  repeated ImportFile files = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// ListImportUnitsRequest asks for a page of an import job's units.
message ListImportUnitsRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The job's id. Required; at most 64 bytes.
  string id = 2;

  // Only the units in one of these states. Empty for every state; at most
  // 16 values, none of them IMPORT_UNIT_STATE_UNSPECIFIED.
  repeated ImportUnitState states = 3;

  // The most units to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 4;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; a position it holds is sealed by the server, so a token a client
  // logs shows no path; at most 1 KiB; refused as invalid with a tenant,
  // job or states other than those it was made with.
  string page_token = 5;
}

// ListImportUnitsResponse is a page of an import job's units.
message ListImportUnitsResponse {
  // The units of this page, by folder.
  repeated ImportUnit units = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}
