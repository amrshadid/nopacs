syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package nopacs.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// StorageService adds, reads, changes, removes and tests a tenant's storages:
// the places its archived files are written to, a directory on the server or
// a bucket of an S3 object store. A storage belongs to one tenant, and its
// configuration lives in that tenant's database. A storage's used and free
// space are answered by MonitorService.GetStatus, not here.
//
// Where a storage may be is the installation's to decide, not the tenant's:
// a directory storage lies under a root the installation names, inside that
// root's directory for the tenant, and an S3 storage uses an endpoint the
// installation lists. So no tenant can point a storage at another tenant's
// files, at the server's own files, or at an address inside the server's
// network that the installation did not list. Two installation-only
// settings (SettingsService), each empty by default so that no storage of
// its type can be added until the installation's admin fills it, hold this:
//
//   - storage.directory-roots: the roots of directory storages, one per
//     line, each "name=path": a name under the rule of a tenant's name, and
//     an absolute path on the server, such as "fast=/srv/archive". A
//     tenant's directories lie in <path>/<tenant>/ under a root. The server
//     follows every symbolic link in a root's path when the setting is set
//     and again whenever the root is used, and refuses two roots that are
//     one directory or one inside the other once followed (precondition):
//     the change of the setting is refused, and, should links change later,
//     every storage on either root is refused until the installation
//     corrects it. A root that does not exist yet is compared where it
//     would be once made. A caller who is not an admin on the installation
//     reads this setting as the roots' names alone, one per line, never
//     their paths.
//   - storage.s3-endpoints: the endpoints S3 storages may use, one per line:
//     the base URL, then, separated by spaces, "plain-http" when an http URL
//     is allowed and "private-address" when the host may resolve to a
//     loopback, link-local or private address, such as
//     "https://s3.eu-central-1.amazonaws.com" or
//     "http://minio.lab.example:9000 plain-http private-address". An S3
//     storage at an endpoint whose entry allows private addresses must
//     address its bucket in the path (S3Storage.path_style): in the host
//     name, a bucket's name would choose which host in the server's network
//     is reached.
//
// A rule that depends on what the installation allows is answered
// "precondition" when it fails: the same request may succeed once the
// installation allows it.
//
// Primaries and replicas. The storage a receiver or a route names, where a
// scan is archived first, is a primary. A replica is another storage of the
// same tenant, with replica_of naming its primary, that holds a
// byte-identical copy of the primary's objects under the same keys: the
// DICOM files, the manifests and metadata, the correction records and the
// hold records. So a replica read alone is a whole storage, which a rebuild
// can read and a switch can make the primary without rewriting a key. A
// primary has at most two replicas; a replica serves one primary, is never
// itself replicated, and is never named by a receiver or a route. Copying to
// a replica runs behind the reception, never in its way: what is not yet
// copied is the replica's lag (ReplicaService).
//
// Tiers. A storage of the online tier reads any of its objects at once. A
// storage of the archive tier may hold objects it must first bring back for
// a time before they can be read (an S3 bucket whose lifecycle rule moves
// objects to a cold storage class; bringing one back is a recall,
// RestoreObject in the S3 API). Only a replica may be of the archive tier:
// the reception, a relabel, a rebuild and a scrub read a primary at once.
// The server never sets a bucket's storage class or lifecycle: those are the
// bucket's.
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE. No
// answer of this service speaks of another tenant.
service StorageService {
  // AddStorage adds a storage to a tenant. For a directory storage the
  // server makes the directory, which must be absent or empty; for an S3
  // storage it touches nothing. TestStorage checks that the storage can be
  // written to, and GetStatus reports its space. A storage added with
  // replica_of is a replica from the start, and the server queues a
  // replicate job that copies what its primary already holds
  // (ReplicaService.AttachReplica says what is checked); the rules of a
  // replica below answer precondition when they fail. A masked key
  // (Key.masked) is refused it: where the archive's bytes are written is a
  // person's choice.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and its type in details; never its secret.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant; also a
  // masked key), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), conflict (the tenant has a storage with that name),
  // precondition (a root or an endpoint the installation does not list; a
  // directory that is not empty, has a symbolic link in its path, or
  // overlaps another storage of the tenant; a directory whose path on the
  // server would pass 1023 bytes; a root that lies at, inside or around
  // another root once their symbolic links are followed; an S3 location
  // that overlaps another storage of the tenant; an S3 storage that
  // addresses its bucket in the host name at an endpoint whose entry allows
  // private addresses; with replica_of, a primary the tenant does not
  // have, one that is itself a replica, of the archive tier, or that has
  // two replicas already; the archive tier without replica_of),
  // unavailable (the tenant's database does not answer, or the tenant is
  // not ready).
  rpc AddStorage(AddStorageRequest) returns (AddStorageResponse);

  // GetStorage answers one storage of a tenant. Its secret is never
  // answered: the answer says only whether one is set.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no storage with that name; a tenant that does
  // not exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  rpc GetStorage(GetStorageRequest) returns (GetStorageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListStorages answers the storages of a tenant, ordered by name, without
  // their secrets.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc ListStorages(ListStoragesRequest) returns (ListStoragesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetStorage changes some fields of a storage: those its update_mask
  // names, and no other. A secret the mask does not name is kept as it is,
  // so a change of the capacity does not need the secret sent again. The
  // change and its audit entry are written together or not at all.
  //
  // A storage's type cannot change: a mask that names the other type's
  // configuration is invalid. Once the storage holds an archived file, the
  // fields that say where its files are (a directory's root and path, an S3
  // storage's endpoint, bucket and prefix) cannot change, since the files
  // would no longer be where the catalog says. An S3 storage's access key
  // id and secret access key change together or not at all, and a mask
  // that names s3.endpoint names both: credentials given for one store are
  // never sent to another. A mask that breaks either rule is invalid.
  // ReplicaService.SwitchStorage is the one way the place of a storage that
  // holds files changes, and it changes no catalog row. replica_of is not
  // changed here (ReplicaService.AttachReplica and DetachReplica change
  // it): a mask that names it is invalid. A change of tier to archive is a
  // precondition failure on a storage that is not a replica: the archive
  // tier is only for a replica. A change of where the files are is a
  // precondition failure too for a replica and for a storage that has
  // replicas, whether or not it holds archived files yet, since a replica
  // holds its primary's keys and a switch swaps places. A masked key
  // (Key.masked) is refused it, as AddStorage.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and the mask's paths in details; never a value of a secret.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant; also a
  // masked key), invalid
  // (also an empty mask, a path that names no field, a read-only field or a
  // type's whole message, a path into the other type's configuration, one
  // of the two credentials without the other, the endpoint without both
  // credentials, and every rule AddStorage checks on a field), not found (the tenant has no storage with that
  // name; a tenant that does not exist, for a caller who may list every
  // tenant), precondition (a change of where the files are on a storage
  // that holds files, is a replica or has replicas; a change of tier to
  // archive on a storage that is not a replica; and every precondition
  // AddStorage checks: a directory
  // whose path on the server would pass 1023 bytes; a root that lies at,
  // inside or around another root once their symbolic links are followed;
  // an S3 storage that addresses its bucket in the host name at an endpoint
  // whose entry allows private addresses),
  // unavailable (the tenant's database does not answer, or the tenant is
  // not ready).
  rpc SetStorage(SetStorageRequest) returns (SetStorageResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RemoveStorage removes a storage's configuration from a tenant. It never
  // deletes a file: it is refused while the storage holds any archived file
  // or while a receiver names it as its storage, so the configuration of a
  // storage that holds data is never lost. It is refused too while the
  // storage is a replica (ReplicaService.DetachReplica first) or a primary
  // with a replica. A repeated call finds no storage and is answered
  // NOT_FOUND; it removes nothing more.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and its type in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no storage with that name; a tenant that does
  // not exist, for a caller who may list every tenant), precondition (the
  // storage holds archived files, a receiver names it, it is a replica, or
  // it is the primary of a replica; the message says which), unavailable
  // (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc RemoveStorage(RemoveStorageRequest) returns (RemoveStorageResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // TestStorage writes one small object of random bytes to the storage,
  // reads it back, compares its SHA-256 with what was written, and removes
  // it, and reports each step. The object's key is under a prefix no
  // archived file uses, so the test never touches data. A storage that
  // fails a step is a result, not an error: the method succeeds and the
  // failed step says why, from a fixed list. A step after a failed one is
  // answered skipped, except the removal, which is tried whenever the write
  // may have left an object. Repeating the test leaves the storage as it
  // was.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and whether every step passed in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (the tenant has no storage with that name; a tenant that does
  // not exist, for a caller who may list every tenant), unavailable (the
  // tenant's database does not answer, or the tenant is not ready).
  // Limits: the whole test is bounded by the call's deadline; a step that
  // has not finished when it passes is answered failed, unreachable.
  rpc TestStorage(TestStorageRequest) returns (TestStorageResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Storage is a place a tenant's archived files are written to. In this
// version its keys form two trees, data/<subject>/<session>/<scan>/ for the
// DICOM files, one object per instance, and meta/<subject>/<session>/<scan>/
// for each scan's manifest and metadata, with the records of corrections
// under meta/.corrections/ (CorrectionService) and of holds under
// meta/.holds/ (RetentionService); labels never start with a dot, so these
// are never a subject's tree. The catalog records each file's
// place as a key, an offset and a length, so a later version may pack files
// differently without changing what this API answers. It never carries a
// secret.
message Storage {
  // The storage's name, unique in its tenant, and its id in this API. It
  // does not change. 1 to 63 characters, lowercase ASCII letters, digits and
  // hyphens, starting with a letter, and none of the device names Windows
  // reserves (con, prn, aux, nul, com0 to com9, lpt0 to lpt9): the rule of a
  // tenant's name.
  string name = 1;

  // The storage's type and the configuration of that type. Exactly one is
  // set; a storage with neither is refused as invalid. A type added in a
  // later version is a new field of this oneof: a client that finds none of
  // the fields it knows set is reading a storage of a type it does not know,
  // and shows it as such.
  oneof type {
    // A directory on the server's file system, local or mounted.
    DirectoryStorage directory = 2;

    // A bucket of an object store that speaks the S3 API.
    S3Storage s3 = 3;
  }

  // The most bytes of archived files the storage may hold, for a storage
  // that cannot report its free space (an S3 bucket) or that must use less
  // than its disk has. Zero means no limit of the storage's own: a directory
  // is then bounded by its file system, and an S3 storage reports its free
  // space as unknown. When set, the free space reported is the smaller of
  // what is left under the limit and what the file system reports. At most
  // 2^62; negative is invalid.
  int64 capacity_bytes = 4;

  // When the storage was added. Answered by the server; ignored in a
  // request.
  google.protobuf.Timestamp create_time = 5;

  // When the storage's configuration last changed: its create_time until
  // the first SetStorage. Answered by the server; ignored in a request.
  google.protobuf.Timestamp update_time = 6;

  // The name of the primary this storage is a replica of; empty for a
  // storage that is not a replica. Set by AddStorage or
  // ReplicaService.AttachReplica, cleared by ReplicaService.DetachReplica,
  // and never changed by SetStorage. The primary is a storage of the same
  // tenant that is not itself a replica and has fewer than two replicas. A
  // replica is never named by a receiver or a route, so nothing is ever
  // archived to it first.
  string replica_of = 7;

  // Whether the storage reads every object at once or may hold some it
  // must first recall. STORAGE_TIER_UNSPECIFIED in a request is read as
  // online, and answered STORAGE_TIER_ONLINE; a value this version does not
  // know is invalid. A directory storage is always online: archive is
  // invalid for it. The archive tier is only for a replica: AddStorage
  // takes it only with replica_of, and SetStorage only on a storage that is
  // a replica; elsewhere it is a precondition failure. A replica detached
  // later keeps its tier, and since no receiver, route or release may name
  // an archive-tier storage, nothing is archived to it.
  StorageTier tier = 8;

  // How many switches (ReplicaService.SwitchStorage) have changed the
  // place this name names: a switch raises it on both its storages. It is
  // kept per tenant and name, and never reset: a name removed and added
  // again goes on from where it was, so a generation never names two
  // places. A switch's confirm token holds it, and a purge's disposition
  // and a scrub's finding record it, so what a storage did or showed is
  // always tied to the place it was at. Answered by the server; ignored in
  // a request.
  int64 switch_generation = 9;
}

// StorageTier is whether a storage can read each of its objects at once. A
// tier added in a later version is a new value; a client shows one it does
// not know as a tier that may not read at once.
enum StorageTier {
  // Not said. A request leaves it so, read as online; never answered.
  STORAGE_TIER_UNSPECIFIED = 0;

  // Every object reads at once. An object the store still answers as not
  // online (a bucket rule moved it) is unavailable, reason NOT_ONLINE,
  // never missing or damaged.
  STORAGE_TIER_ONLINE = 1;

  // Some objects may need a recall before they read (an S3 cold storage
  // class). For a replica only, and never for a directory. Reads turn to it only when the primary's
  // copy cannot be read, and a scrub that cannot read an object checks it
  // by presence (ScrubJob).
  STORAGE_TIER_ARCHIVE = 2;
}

// S3RecallTier is how fast, and at what cost, an archive-tier S3 store
// brings an object back, in the names of the S3 API's RestoreObject
// request (its Tier). A tier added later is a new value.
enum S3RecallTier {
  // Not said: read as standard, answered S3_RECALL_TIER_STANDARD.
  S3_RECALL_TIER_UNSPECIFIED = 0;

  // The store's ordinary speed and price.
  S3_RECALL_TIER_STANDARD = 1;

  // The slowest and cheapest, for a large recall that can wait.
  S3_RECALL_TIER_BULK = 2;

  // The fastest and dearest, where the store offers it for the object's
  // class; a store that does not refuses the recall, and the recall is
  // failed.
  S3_RECALL_TIER_EXPEDITED = 3;
}

// ReplicaStatus is how far one replica is from its primary. A replica is
// in step for a scan when it holds, verified, every object the scan's
// current manifest names, and that manifest; reads turn only to a replica
// in step for the scan they read. The counts are kept in the tenant's
// database with each copy, so they are not counted per call.
message ReplicaStatus {
  // The replica's name.
  string replica = 1;

  // The name of its primary.
  string primary = 2;

  // Its tier.
  StorageTier tier = 3;

  // The primary's scans it holds in step, at the manifest the catalog
  // holds now.
  int64 scans_in_step = 4;

  // The scans waiting to be copied to it: archived, replaced or relabeled
  // on the primary since it was last in step for them, or never copied.
  int64 scans_pending = 5;

  // The scans being copied to it now.
  int64 scans_copying = 6;

  // The scans for which a scrub found an object of the replica missing or
  // damaged; the server copies those objects again from the primary,
  // verified, unasked, since a replica is the server's own copy.
  int64 scans_damaged = 7;

  // The objects of the replica a scrub found missing or damaged and not
  // yet copied again.
  int64 objects_damaged = 8;

  // How long the oldest scan not in step has waited, measured by the
  // server's clock from the commit that made it pending; zero when every
  // scan is in step. Past the tenant's replica.lag-alert an
  // EVENT_TYPE_REPLICA_BEHIND event is made. Until a scan is in step its
  // only copy is the primary's.
  google.protobuf.Duration lag = 9;

  // When the oldest scan not in step became pending. Absent when every
  // scan is in step.
  google.protobuf.Timestamp oldest_pending_time = 10;

  // Whether the replica lies at the same S3 endpoint and in the same bucket
  // as its primary (under another prefix, as two storages of a tenant must
  // be). Allowed, and shown, since a copy in the same bucket survives
  // little that the primary would not.
  bool shares_bucket = 11;

  // Why the last copy to it, or read from it, failed, from a fixed list;
  // STORAGE_FAULT_UNSPECIFIED when the last one succeeded. A replica that
  // does not answer holds its scans pending: it never fails a reception.
  StorageFault last_fault = 12;

  // When last_fault was seen. Absent with no fault.
  google.protobuf.Timestamp last_fault_time = 13;

  // The id of its replicate job queued or running (JobService), copying
  // what the primary held before it was attached; empty when none is.
  string backfill_job = 14;

  // The objects of this replica being recalled now, of an archive-tier
  // replica: requested or in progress. Zero for an online replica.
  int64 recalls_in_progress = 15;
}

// DirectoryStorage is a directory on the server's file system, under one of
// the roots the installation names. The directory is <root's directory>/
// <tenant's name>/<path>: each tenant has its own directory under a root,
// so one tenant's storages can never reach another's. The root's own path
// on the server is the installation's and is never answered.
//
// The server resolves the directory's path when the storage is added and
// whenever it opens the directory, and refuses a path below the root that
// passes through a symbolic link. When added, the directory must not exist
// or must be empty, and it must not contain, lie inside or be another
// storage of the tenant; paths are compared after resolution and with case
// folded, so two spellings of one directory on a file system that ignores
// case are one directory.
message DirectoryStorage {
  // The name of the root, as the installation's setting
  // storage.directory-roots names it. Required; a name the setting does not
  // list is a precondition failure.
  string root = 1;

  // The directory below the tenant's directory in the root, as segments
  // joined by "/": at most 16 segments and 1024 bytes, each segment 1 to 128
  // characters of ASCII letters, digits, ".", "_" and "-", neither starting
  // nor ending with a dot (so neither "." nor ".." is a segment, and no
  // segment is one Windows would shorten), and not a device name Windows
  // reserves (con, prn, aux, nul, com0 to com9, lpt0 to lpt9, in any case,
  // with or without an extension), on every system. The directory on the
  // server, its root's path and the tenant's name included, is at most 1023
  // bytes once the root's links are followed, so every system the server
  // runs on can open it; a longer one is a precondition failure. Empty for
  // the tenant's directory itself. Not absolute: a leading "/" is invalid. It is not a
  // secret, and is answered to every caller who may read the storage.
  string path = 2;

  // The admin's statement that the volume under the directory encrypts what
  // it holds at rest (a disk or file system encryption the site set up).
  // The server cannot ask a directory, so its status shows this statement
  // as declared or not declared (StorageStatus.encryption_at_rest), never
  // as a fact it checked; image data is encrypted by the storage, not by
  // the server. False by default.
  bool encrypted_at_rest_declared = 3;
}

// EncryptionAtRest is what a storage's status says of whether the storage
// encrypts what it holds. An S3 storage is asked when the server opens it
// (the bucket's default encryption); a directory shows the admin's
// statement (DirectoryStorage.encrypted_at_rest_declared). The server does
// not encrypt image data itself, and makes no claim beyond what the storage
// or the admin said. A value added later is a new value; a client shows
// one it does not know as unknown.
enum EncryptionAtRest {
  // Never answered by the server.
  ENCRYPTION_AT_REST_UNSPECIFIED = 0;

  // An S3 storage that could not be asked, or would not say (credentials
  // that may not read the setting, a server without it), or one the server
  // has not opened yet.
  ENCRYPTION_AT_REST_UNKNOWN = 1;

  // An S3 storage that says it does not encrypt new objects by default.
  ENCRYPTION_AT_REST_NONE = 2;

  // An S3 storage that says it encrypts new objects by default, with
  // StorageStatus.encryption_algorithm.
  ENCRYPTION_AT_REST_ENCRYPTED = 3;

  // A directory whose admin declared its volume encrypts at rest.
  ENCRYPTION_AT_REST_DECLARED = 4;

  // A directory whose admin made no such statement.
  ENCRYPTION_AT_REST_NOT_DECLARED = 5;
}

// S3Storage is a bucket, or a part of one under a prefix, on an object store
// that speaks the S3 API, at an endpoint the installation lists. Its
// credentials are the storage's own: the server never falls back to
// credentials of its own environment (instance roles, shared credential
// files), which would let one tenant reach what another tenant's
// credentials guard.
//
// Every time it connects, the server checks the address the endpoint's host
// name resolves to: a loopback, link-local or private address (RFC 1918, RFC
// 4193, RFC 6598) is refused unless the installation's entry for the
// endpoint allows it, so a name that later resolves elsewhere cannot carry
// the server's requests into its own network.
message S3Storage {
  // The store's base URL, such as "https://s3.eu-central-1.amazonaws.com".
  // Required; at most 2048 bytes; no user information, query or fragment. It
  // must be one of the endpoints the installation's setting
  // storage.s3-endpoints lists, compared after the scheme and host are put
  // in lowercase and a final "/" removed; an endpoint it does not list is a
  // precondition failure. An http URL is accepted only when its entry allows
  // plain http, since then every request and every archived file crosses
  // the network unencrypted.
  string endpoint = 1;

  // The region the bucket is in, as the store names it, such as
  // "eu-central-1". Required, also for a store that ignores it (which
  // accepts any value, commonly "us-east-1"); at most 64 bytes of lowercase
  // ASCII letters, digits and hyphens.
  string region = 2;

  // The bucket's name. Required; 3 to 63 characters of lowercase ASCII
  // letters, digits, "." and "-", starting and ending with a letter or a
  // digit, as the S3 API names a bucket. The bucket exists before the
  // storage is added: the server never makes or removes a bucket.
  string bucket = 3;

  // The prefix under which every key of the storage is written, so several
  // storages can share one bucket. Empty for the whole bucket. At most 128
  // bytes of ASCII letters, digits, ".", "_", "-" and "/", not starting with
  // "/", ending with "/", and with no empty, "." or ".." part; so
  // "nopacs/lab-a/" is valid and "nopacs/lab-a" is not. The bound keeps
  // every object's key within the 1024 bytes S3 allows: the longest key the
  // server writes under a prefix is 896 bytes. Two storages of one tenant on
  // the same endpoint and bucket must not have prefixes of which one starts
  // with the other: that is a precondition failure.
  string prefix = 4;

  // Whether the bucket is addressed in the URL's path
  // (https://endpoint/bucket/key) rather than in its host name
  // (https://bucket.endpoint/key). Most stores other than AWS S3 need true;
  // AWS S3 needs false. It must be true at an endpoint whose installation
  // entry allows private addresses; false there is a precondition failure.
  bool path_style = 5;

  // The access key id of the credentials the server uses, as the store
  // issued it; at most 128 bytes of printable ASCII. Required. It names the
  // credentials and is not a secret: it is answered, so a person can tell
  // which credentials a storage uses when they are rotated. SetStorage
  // changes it only together with secret_access_key.
  string access_key_id = 6;

  // SECRET. The secret access key that goes with access_key_id; at most 128
  // bytes of printable ASCII. Required by AddStorage. It only comes in: the
  // server seals it with the installation key, and no answer, log or audit
  // entry ever holds it; it is always empty in an answer, and
  // secret_access_key_set says whether one is held. SetStorage keeps the
  // held secret unless its mask names s3.secret_access_key, and then the
  // new one must not be empty and the mask must name s3.access_key_id too.
  // The debug_redact mark is read by the server's redactor; the protobuf
  // library itself still prints the field.
  string secret_access_key = 7 [debug_redact = true];

  // Whether the server holds a secret access key for this storage. Answered
  // by the server; ignored in a request.
  bool secret_access_key_set = 8;

  // Whether a purge of a correction on a versioned bucket also deletes
  // every older version of each object, delete markers included, by its
  // version id, so the bytes are gone and not only hidden behind a delete
  // marker. Absent means true. Off, or without the permission to list and
  // delete versions, a purge on a versioned bucket leaves the older
  // versions and says so (ObjectDisposition HIDDEN). A bucket's object
  // lock may still retain a version whatever this says (RETAINED).
  optional bool purge_versions = 9;

  // For a storage of the archive tier, how many days a recalled object
  // stays readable before the store moves it back to its cold class (the
  // Days of RestoreObject): 1 to 365; 0 means 7. Ignored, and answered 0,
  // for an online storage. Each day costs the site what its store charges,
  // so the shortest that serves the work is best.
  int32 recall_days = 10;

  // For a storage of the archive tier, how fast the store is asked to bring
  // an object back (the Tier of RestoreObject). Answered
  // S3_RECALL_TIER_UNSPECIFIED for an online storage.
  S3RecallTier recall_tier = 11;
}

// StorageTestStep is one step of TestStorage.
enum StorageTestStep {
  // Not a step. Never answered by the server.
  STORAGE_TEST_STEP_UNSPECIFIED = 0;

  // The test object is written.
  STORAGE_TEST_STEP_WRITE = 1;

  // The test object is read back whole.
  STORAGE_TEST_STEP_READ = 2;

  // The SHA-256 of what was read is compared with that of what was written.
  STORAGE_TEST_STEP_COMPARE = 3;

  // The test object is removed.
  STORAGE_TEST_STEP_REMOVE = 4;
}

// StorageTestOutcome is how one step of TestStorage ended.
enum StorageTestOutcome {
  // Never answered by the server.
  STORAGE_TEST_OUTCOME_UNSPECIFIED = 0;

  // The step did what it should.
  STORAGE_TEST_OUTCOME_PASSED = 1;

  // The step did not; the result's failure says why.
  STORAGE_TEST_OUTCOME_FAILED = 2;

  // The step was not tried, because a step it needs failed.
  STORAGE_TEST_OUTCOME_SKIPPED = 3;
}

// StorageFault is why an operation on a storage failed, from a fixed list.
// The store's own words are never answered: a storage pointed at an address
// that is not a store cannot be used to read what that address says. A
// fault added in a later version is a new value.
enum StorageFault {
  // No fault. Answered for a step that did not fail.
  STORAGE_FAULT_UNSPECIFIED = 0;

  // The storage could not be reached in time: no connection, no answer, or
  // a directory that could not be opened.
  STORAGE_FAULT_UNREACHABLE = 1;

  // The TLS handshake with the store failed, as for a certificate that does
  // not verify.
  STORAGE_FAULT_TLS_FAILED = 2;

  // The store refused the request, as for credentials it does not accept
  // or a permission it does not give; for a directory, the file system
  // refused the operation.
  STORAGE_FAULT_REFUSED = 3;

  // The bucket, the directory or the object is not there.
  STORAGE_FAULT_NOT_FOUND = 4;

  // The store answered something the server did not expect, or what was
  // read is not what was written.
  STORAGE_FAULT_WRONG_ANSWER = 5;

  // The endpoint's host name resolved to a loopback, link-local or private
  // address its installation entry does not allow; nothing was sent.
  STORAGE_FAULT_ADDRESS_NOT_ALLOWED = 6;
}

// StorageTestResult is the outcome of one step of TestStorage.
message StorageTestResult {
  // The step.
  StorageTestStep step = 1;

  // How it ended.
  StorageTestOutcome outcome = 2;

  // How long it took. Absent for a skipped step.
  google.protobuf.Duration duration = 3;

  // Why a failed step failed. STORAGE_FAULT_UNSPECIFIED for another
  // outcome.
  StorageFault fault = 4;
}

// AddStorageRequest is the storage to add.
message AddStorageRequest {
  // The tenant to add it to, by name. Required.
  string tenant = 1;

  // The storage. Its name and type are required, with what its type's
  // message requires; create_time, update_time and secret_access_key_set
  // are ignored.
  Storage storage = 2;
}

// AddStorageResponse is the storage added.
message AddStorageResponse {
  // The storage, as stored, without its secret.
  Storage storage = 1;
}

// GetStorageRequest names a storage.
message GetStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage's name. Required.
  string name = 2;
}

// GetStorageResponse is the storage named.
message GetStorageResponse {
  // The storage, without its secret.
  Storage storage = 1;
}

// ListStoragesRequest asks for a page of a tenant's storages.
message ListStoragesRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The most storages to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 2;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant other than the
  // one it was made with.
  string page_token = 3;
}

// ListStoragesResponse is a page of storages.
message ListStoragesResponse {
  // The storages of this page, without their secrets.
  repeated Storage storages = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// SetStorageRequest is the change to a storage.
message SetStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage with the new values of the fields update_mask names. Its
  // name is required and names the storage to change; it is not itself
  // changed. Fields the mask does not name are ignored.
  Storage storage = 2;

  // The fields to change, as paths of Storage: "capacity_bytes", or a field
  // of the storage's type joined to it by a dot, such as "s3.endpoint" or
  // "directory.path"; also "tier", "s3.recall_days", "s3.recall_tier" and
  // "directory.encrypted_at_rest_declared".
  // "replica_of", "switch_generation", "create_time" and "update_time" are
  // not paths a change may name. A path that names a type's whole message ("s3",
  // "directory") is refused: its fields are named one by one, so a secret
  // is never replaced by leaving it out. "s3.access_key_id" and
  // "s3.secret_access_key" are named together or not at all, and both are
  // named with "s3.endpoint". Required and
  // not empty; "*" is refused, so every field a call changes is named. A
  // named field is set to the value given, its zero value included, except
  // a secret, which must not be empty.
  google.protobuf.FieldMask update_mask = 3;
}

// SetStorageResponse is the storage as changed.
message SetStorageResponse {
  // The storage, as stored, without its secret.
  Storage storage = 1;
}

// RemoveStorageRequest names the storage to remove.
message RemoveStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage's name. Required.
  string name = 2;
}

// RemoveStorageResponse is the configuration that was removed.
message RemoveStorageResponse {
  // The storage as it was, without its secret.
  Storage storage = 1;
}

// TestStorageRequest names the storage to test.
message TestStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage's name. Required.
  string name = 2;
}

// TestStorageResponse is the outcome of each step of the test.
message TestStorageResponse {
  // Whether every step passed.
  bool passed = 1;

  // One result per step, in the order the steps ran: write, read, compare,
  // remove.
  repeated StorageTestResult results = 2;
}
