syntax = "proto3";

// Package nopacs.v1: what holds for the whole package (callers, roles, error
// kinds, limits, paging, secrets, partial updates) is said on the package in
// access.proto.
package nopacs.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "nopacs/v1/job.proto";
import "nopacs/v1/storage.proto";

// ReplicaService keeps second copies of a tenant's archive: it attaches and
// detaches replicas (StorageService says what a replica is), tells how far
// each is from its primary, repairs a primary from a replica, recalls
// objects from an archive-tier replica, and moves a tenant off a storage by
// making a replica its primary.
//
// The copy. The transaction that publishes a change of a scan (a
// reception's commit, a replace's or a relabel's publish) also records the
// scan as pending for each replica of its storage, so a crash between the
// commit and the copy forgets nothing. The server then copies each object
// the scan's manifest names that the replica lacks, reading it through the
// same check as every read (its length and SHA-256 against the catalog's),
// putting it on the replica and verifying it there (read back, or the
// store's own SHA-256 confirmation at the put where it gives one, S3's
// x-amz-checksum-sha256), and puts the manifest and metadata last, so a
// replica's scan is whole once its manifest is there. It never copies what
// a delete hid. It runs behind the reception, at most the tenant's setting
// replica.rate per replica (bytes per second, such as "64MiB"; built-in
// default "64MiB"), and a replica that does not answer leaves its scans
// pending and never refuses a sender. So until a scan is in step its only
// copy is the primary's: the lag (ReplicaStatus.lag) is shown, in the
// status, in a metric, and by an EVENT_TYPE_REPLICA_BEHIND event past the
// tenant's setting replica.lag-alert (a period such as "1h", from "1m" to
// "30d"; built-in default "1h").
//
// Reads. The one path that opens an archived instance for every read (a
// download, DICOMweb, frames, DataService.ReadFiles, a send, a deid job)
// tries the primary, and turns to a replica in step for that scan at the
// catalog's manifest when the primary's object is marked damaged or
// missing, answers not found or not online, or its storage does not answer.
// It turns before the first byte, never midway: bytes a reader already has
// are never joined to another copy's. A mismatch found midway still aborts
// that answer, as without a replica, and queues a check of that instance at
// once; once the check confirms it, every later read goes to the replica.
// The bytes from a replica are checked against the catalog's SHA-256 as the
// primary's are, so no answer field changes; the audit entry and a metric
// say which storage served. A replica not in step for a scan is never read
// for it: the answer is the primary's error.
//
// Repair. A replica's damaged or missing object is copied again from the
// primary by the server, unasked. A primary's is repaired on a person's
// word (Repair), or by the server itself when the tenant's setting
// replica.repair is "auto" ("manual" or "auto"; an ordinary setting, a
// tenant may override it; built-in default "manual"): damage on a storage
// is a person's to see before the server writes to it again, and reads
// already turn to the replica, so waiting loses nothing.
//
// Recall. A recall brings an object of an archive-tier storage back for
// recall_days (S3Storage). There is one recall per object, shared by every
// request and job waiting for it. A read of an object not online answers
// UNAVAILABLE with the reason NOT_ONLINE (access.proto), never not found or
// data loss, and starts no recall: a reader's key is not a lever on the
// site's bill. A job unit that meets one on an archive-tier storage (a
// send, a deid job, a repair) asks for its recall and waits with the
// reason "recalling", spending no attempt, and fails
// JOB_FAILURE_CODE_NOT_ONLINE only after the tenant's setting recall.wait
// (a period such as "48h", from "1h" to "30d"; an ordinary setting, a
// tenant may override it; built-in default "48h"); on an online-tier
// storage it is a temporary failure, tried again until its attempts run
// out. An operator recalls on purpose with Recall, after its preview.
//
// Records owed to a replica. A correction's record and a hold's record go
// on the primary before the change they record takes effect. A replica
// that does not answer then is owed the record: the debt is kept in the
// tenant's database, written in the same transaction as the change, and
// the server puts the record there as soon as the replica answers. Until
// every record owed to a replica is put, no purge removes anything from
// it, and a switch to it does not swap. So a replica that is down never
// blocks a correction or a hold, and never ends up without a record of a
// change it holds bytes of.
//
// Moving off a storage. A tenant's data moves to a new storage in five
// steps, each a call a person makes and reads: attach the new storage as a
// replica of the old (AttachReplica), which copies every current object,
// every superseded revision not yet purged, every correction record and
// every hold record; scrub the new storage (ScrubJob), every object read
// there; check a sample with tools outside the server (VerifySample); build
// a shadow catalog from the new storage alone and compare it with the
// catalog in use (RebuildJob, compare mode, from_storage), which must find
// no difference; then switch (SwitchStorage). The old storage stays a
// replica until it is detached, and the server deletes nothing on it.
//
// Every method acts inside one tenant, named by the request's tenant field,
// so a request into a tenant that is not ready is answered UNAVAILABLE. No
// answer of this service speaks of another tenant.
service ReplicaService {
  // ListReplicas answers the tenant's replicas, each with how far it is
  // from its primary, ordered by primary, then replica name.
  //
  // Role: reader on the tenant.
  // Audit: one entry in the tenant's log, with the primary filter in
  // details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid,
  // not found (a tenant that does not exist, for a caller who may list every
  // tenant), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc ListReplicas(ListReplicasRequest) returns (ListReplicasResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // AttachReplica makes an existing storage of the tenant a replica of a
  // primary and queues a replicate job (ReplicateJob) that copies what the
  // primary holds; scans archived from then on are copied as they come.
  // The copy never takes an object of a correction whose purge has
  // started, and a purge running when the replica is attached adds it to
  // its set of copies, so a withdrawal in progress also covers whatever
  // reached the replica before the purge saw it.
  // The storage must hold no archived file and no object under the
  // tenant's keys, and its place must not overlap the primary's (the rule
  // of two storages of a tenant). A storage already a replica of that
  // primary is answered as it stands, with its replicate job if one is
  // queued or running, so a repeated call starts nothing more. A masked key
  // (Key.masked) is refused it: where copies of the archive go is a
  // person's choice.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the replica's name as its
  // object and the primary's in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant; also a
  // masked key), invalid,
  // not found (the tenant has no storage with the replica's name; a tenant
  // that does not exist, for a caller who may list every tenant),
  // precondition (a primary the tenant does not have, that is itself a
  // replica, is of the archive tier or has two replicas; a storage that is
  // a replica of another primary, is a primary with replicas, holds
  // archived files or objects, or that a receiver or a route names; a
  // switch of the primary in progress; the tenant moved or fenced, with the
  // reason TENANT_MOVED or TENANT_FENCED), unavailable (the tenant's
  // database or the storage does not answer, or the tenant is not ready).
  rpc AttachReplica(AttachReplicaRequest) returns (AttachReplicaResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // DetachReplica makes a replica an ordinary storage again: copying to it
  // stops, its replicate jobs are canceled, its state per scan and the
  // records owed to it are dropped, and reads no longer turn to it. It
  // deletes nothing: the files it holds stay where they are, and since the
  // catalog names none of them, StorageService.RemoveStorage may then
  // remove its configuration. While a committed or purging correction
  // counts the replica among its copies, the detach is refused, since the
  // bytes that correction withdraws would stay there unseen; with
  // abandon_purges and a reason it goes ahead, and each such correction
  // records the replica's objects as OBJECT_DISPOSITION_UNKNOWN and names
  // the replica in Correction.copies_abandoned, so it never reads as if
  // that copy were removed. A repeated call finds a storage that is not a
  // replica and is answered precondition; it changes nothing more.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the replica's name as its
  // object, and its former primary's name, abandon_purges, the corrections
  // abandoned there and the reason in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also abandon_purges without an abandon_reason, or a reason without
  // it), not found (the tenant has no storage with that name; a tenant
  // that does not exist, for a caller who may list every tenant),
  // precondition (the storage is not a replica; a committed or purging
  // correction counts it and abandon_purges is not set, the message naming
  // how many; a switch of its primary is in progress; the tenant moved or
  // fenced), unavailable (the tenant's database does not answer, or the
  // tenant is not ready).
  rpc DetachReplica(DetachReplicaRequest) returns (DetachReplicaResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // BackfillReplica queues a replicate job that copies to a replica every
  // object of its primary it does not hold verified, as AttachReplica's
  // does: after a replica was restored from elsewhere, or to make sure
  // before a switch. A replicate job of the replica already queued or
  // running is answered instead, so a repeated call starts nothing more. A
  // masked key (Key.masked) is refused it, as AttachReplica.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the replica's name as its
  // object and the job's id in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant; also a
  // masked key), invalid,
  // not found (the tenant has no storage with that name; a tenant that
  // does not exist, for a caller who may list every tenant), precondition
  // (the storage is not a replica; the tenant moved or fenced),
  // unavailable (the tenant's database does not answer, or the tenant is
  // not ready).
  rpc BackfillReplica(BackfillReplicaRequest) returns (BackfillReplicaResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Repair queues a repair job (RepairJob) that puts back on a primary the
  // objects scrubs found missing or damaged there, each read whole from a
  // replica in step for its scan and checked against the catalog's length
  // and SHA-256. The damaged object's size and found SHA-256 are recorded
  // first (they stay on its finding); then exactly the bytes the catalog
  // names are put at the same key, so no key ever holds bytes other than
  // the checksum the catalog gives for it; then read back; then the
  // finding is cleared and the instance's mark removed in one transaction,
  // with an audit entry made by the server. An object no replica holds
  // good is left as it is and counted refused
  // (JOB_FAILURE_CODE_DAMAGED_IN_STORAGE, the detail "no good copy"); a
  // replace from a file sent again
  // (CorrectionService.Replace) is then the way to mend it. A repair job of
  // the same storage, replica and findings (or all) already queued or
  // running is answered instead, so a repeated call starts nothing more.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object, and the replica's name, all or the number of findings, and the
  // job's id in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also neither findings nor all, or both; more than 1000 findings),
  // not found (the tenant has no storage with that name, or no finding
  // with one of the ids; a tenant that does not exist, for a caller who
  // may list every tenant), precondition (the storage is a replica, whose
  // objects the server copies again by itself; a replica named that is not
  // a replica of it; a finding on another storage, cleared, or of a kind a
  // repair does not mend (an orphan); a repair of the storage with other
  // findings already queued or running; a switch of it in progress; the
  // tenant moved or fenced), unavailable (the tenant's database does not
  // answer, or the tenant is not ready).
  rpc Repair(RepairRequest) returns (RepairResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Recall asks an archive-tier storage to bring back the objects of a
  // subject, a session of it or a scan of that, for recall_days, so a
  // later read or job finds them online; or, with validate_only, answers
  // how many objects and bytes it would recall and how many are online or
  // being recalled already, and a confirm token, asking nothing of the
  // store. A recall costs the site what its store charges, so the real
  // call carries the token of a preview of the same target, storages and
  // days, made within the hour, and is refused when a preview made now
  // would answer other objects or bytes to ask for: it asks for what a
  // person saw. A call that carries a token already used answers what the
  // first call with it asked for, asking nothing more of the store and
  // refusing nothing, so a client that lost the answer may send it again;
  // and an object online or being recalled already is never asked for
  // again, whatever the token. Days above a storage's
  // recall_days need admin on the tenant, checked after the requirement
  // below, and are answered permission denied to an operator: the site set
  // that bound on what a recall costs.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the target's path of labels
  // as its object, and validate_only, the storages, the days, the objects
  // and bytes asked for in details.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant; days above
  // a storage's recall_days asked by an operator), invalid (also a label
  // that does not pass the label rule, a level named without the one above
  // it, days outside 0 to 365, a confirm token with validate_only or none
  // without it), not found (the tenant holds no such subject, session or
  // scan, or no storage of that name; a tenant that does not exist, for a
  // caller who may list every tenant), precondition (the confirm token
  // does not match what the recall would now ask for, or is more than an
  // hour old; a storage named that is not of the archive tier or holds
  // none of the target; no archive-tier storage holds any of it; the
  // tenant moved or fenced), unavailable (the tenant's database or the
  // store does not answer, or the tenant is not ready).
  rpc Recall(RecallRequest) returns (RecallResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SwitchStorage ends a move off a storage: the replica becomes the
  // primary, under the primary's name, in one step.
  //
  // First, every write to the primary pauses: receivers and the routes
  // that name it refuse new data as a transient refusal a sender tries
  // again (DIMSE: ASSOCIATION_FAILURE_STORAGE_SWITCHING; STOW-RS: 503 with
  // Retry-After), and an association already open has its next store
  // refused likewise; a quarantined file's release into it, an import
  // unit's hand-off, a purge, a repair, a relabel's copy, a new
  // correction, a scrub of it, and the hold records of a PlaceHold or a
  // ReleaseHold that touch it wait or are answered UNAVAILABLE with the
  // reason STORAGE_SWITCHING (access.proto). Reads go on: a read begun
  // before the swap finishes on the old place, whole. Then the copy drains
  // every scan pending for the replica and every record owed to it; then
  // the server takes the owner record on the replica's place; then one
  // transaction swaps the two storages' places and raises both storages'
  // switch_generation: the primary's name, which the catalog, the
  // receivers and the routes use, now names the replica's place, and the
  // replica's name now names the old place, a replica of the primary. No
  // catalog row changes. In the same transaction the open scrub findings
  // of each name move with its place (the primary's become the replica's,
  // and the replica's, if any, the primary's), the instance marks those
  // findings set are lifted, since reads now go to the new place, which
  // the switch's checks read whole, and every scan is recorded in step on
  // the replica's new place, which held the primary's bytes until the
  // pause. Every scan committed before the pause is in step on the new
  // place before the swap, or the switch is refused and every write
  // resumes on the old place as before; every scan after it lands on the
  // new place; the associations refused meanwhile are counted.
  //
  // The switch is recorded in the tenant's database when it is accepted,
  // with each step it reaches. A server that restarts during a switch
  // whose swap has not committed refuses it at start ("server restarted"):
  // every write resumes on the old place and an
  // EVENT_TYPE_STORAGE_SWITCHED event says it was refused; a swap that has
  // committed stands, and what follows it is finished.
  //
  // With validate_only it answers whether the switch could start now, what
  // stands in its way, and a confirm token, changing nothing. Its blockers
  // include a replica with no clean scrub of it since its backfill ended,
  // and no rebuild compare from it alone (RebuildJob.from_storage) that
  // found no difference since then; those two are passed over only with
  // skip_verification and its own reason, recorded in the audit entry. The
  // real call carries the token, a digest of both storages' places, the
  // primary's switch_generation and the time it was issued, within an hour
  // of its issue; it is refused when either place or the generation
  // changed. Once accepted, the switch runs to its end or to its refusal
  // whatever becomes of the call: a call cut short, by its deadline or the
  // client, stops nothing, and a refusal resumes every write. Its outcome
  // is read from StorageStatus (switching, last_switch_time,
  // switch_generation) and from the EVENT_TYPE_STORAGE_SWITCHED event. A
  // token is used once: a call that carries a token already used answers
  // the outcome of the switch it started, or, while it runs, waits for it
  // as the first call does; when that switch was refused, the call is
  // answered precondition with the refusal's phrase.
  //
  // Role: admin on the tenant.
  // Audit: one entry in the tenant's log, with the primary's name as its
  // object, and the replica's name, validate_only, skip_verification and
  // its reason, the scans drained and the associations refused in details;
  // a switch that ends after its call writes another, made by the server.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a drain_timeout outside 1 second to 1 hour; a confirm token with
  // validate_only, or none without it; skip_verification without a
  // skip_reason, or a reason without it), not found (the tenant has no
  // storage with either name; a tenant that does not exist, for a caller
  // who may list every tenant), precondition (the confirm token does not
  // match the places and generation now, or is more than an hour old; a
  // used token whose switch was refused, with that refusal's phrase; the
  // replica is not a replica of the primary, or is of the archive tier;
  // no clean scrub or no empty compare of the replica, without
  // skip_verification; a scan or a record still not on it when
  // drain_timeout passed; a correction of the primary prepared; a rebuild
  // of the tenant or another switch running; a scrub finding that holds on
  // the replica; the tenant moved or fenced, with the reason TENANT_MOVED
  // or TENANT_FENCED), unavailable (the tenant's database or either
  // storage does not answer, or the tenant is not ready).
  // Limits: the drain is bounded by drain_timeout alone; no deadline is
  // applied to the call when the client sends none (access.proto).
  rpc SwitchStorage(SwitchStorageRequest) returns (SwitchStorageResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // VerifySample answers a random sample of the instances a storage holds,
  // each with its key, size and SHA-256 as the catalog holds them, so a
  // tool outside the server can read those objects straight from the
  // storage, hash and decode them, and compare. For a replica, only the
  // objects of scans in step on it are sampled. Each call draws a new
  // sample unless it gives a seed: the same seed over the same population
  // answers the same sample, so a check can be repeated. It reads no
  // object itself.
  //
  // Role: operator on the tenant.
  // Audit: one entry in the tenant's log, with the storage's name as its
  // object and the count in details; never a key, which holds a UID as
  // received.
  // Errors: unauthenticated, permission denied (no grant; also a tenant that
  // does not exist, for a caller who may not list every tenant), invalid
  // (also a count outside 1 to 10000), not found (the tenant has no
  // storage with that name; a tenant that does not exist, for a caller who
  // may list every tenant), unavailable (the tenant's database does not
  // answer, or the tenant is not ready).
  rpc VerifySample(VerifySampleRequest) returns (VerifySampleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// ListReplicasRequest asks for a page of a tenant's replicas.
message ListReplicasRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // Only the replicas of the primary of this name. Empty for every primary.
  string primary = 2;

  // The most replicas to answer: zero means 100; at most 1000. A larger or
  // negative value is invalid.
  int32 page_size = 3;

  // The next_page_token of the previous page, or empty for the first page.
  // Opaque; at most 1 KiB; refused as invalid with a tenant or primary
  // other than those it was made with.
  string page_token = 4;
}

// ListReplicasResponse is a page of replicas.
message ListReplicasResponse {
  // The replicas of this page, by primary, then name.
  repeated ReplicaStatus replicas = 1;

  // The page_token that asks for the next page. Empty on the last page.
  string next_page_token = 2;
}

// AttachReplicaRequest names the storage to make a replica, and its
// primary.
message AttachReplicaRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The name of the storage that becomes a replica. Required.
  string replica = 2;

  // The name of its primary. Required.
  string primary = 3;
}

// AttachReplicaResponse is the replica attached.
message AttachReplicaResponse {
  // The storage, as stored, with replica_of set; without its secret.
  Storage storage = 1;

  // The replicate job that copies what the primary held, queued; absent
  // when the primary held nothing.
  Job backfill = 2;
}

// DetachReplicaRequest names the replica to detach.
message DetachReplicaRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The replica's name. Required.
  string replica = 2;

  // Detach even while committed or purging corrections count the replica
  // among their copies: each records the replica's objects as unknown and
  // names it in copies_abandoned. Needs abandon_reason.
  bool abandon_purges = 3;

  // Why, in the person's own words: 1 to 1024 bytes of UTF-8 with no
  // control characters, never a value read from a file. Required with
  // abandon_purges; must be empty without it. Kept in the audit entry;
  // each correction's state reason says "copies abandoned".
  string abandon_reason = 4;
}

// DetachReplicaResponse is the storage detached.
message DetachReplicaResponse {
  // The storage, as stored, with replica_of empty; without its secret.
  Storage storage = 1;
}

// BackfillReplicaRequest names the replica to fill.
message BackfillReplicaRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The replica's name. Required.
  string replica = 2;
}

// BackfillReplicaResponse is the replicate job queued, or the one already
// queued or running.
message BackfillReplicaResponse {
  // The job.
  Job job = 1;
}

// RepairRequest names the primary to repair, the findings to mend and,
// optionally, the replica to read from.
message RepairRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The name of the primary storage to repair. Required.
  string storage = 2;

  // The name of the replica to read the good bytes from. Empty for any
  // replica of the storage in step for each object's scan, online ones
  // first.
  string from = 3;

  // The ids of the findings to mend (ListScrubFindings): missing, damaged,
  // disagreeing or manifest damaged, on the storage, holding now. At most
  // 1000; empty with all.
  repeated string findings = 4;

  // Mend every finding that holds on the storage now, of a kind a repair
  // mends. Must be false with findings.
  bool all = 5;
}

// RepairResponse is the repair job queued.
message RepairResponse {
  // The job, queued.
  Job job = 1;
}

// RecallRequest names what to recall, from where, and for how long.
message RecallRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The subject's label. Required.
  string subject_label = 2;

  // The label of the session of the subject. Empty for the whole subject.
  string session_label = 3;

  // The label of the scan of the session. Empty for the whole session;
  // needs session_label.
  string scan_label = 4;

  // The name of the archive-tier storage to recall from. Empty for each
  // archive-tier storage that holds any of the target.
  string storage = 5;

  // How many days the objects stay readable: 1 to 365; 0 for each
  // storage's recall_days.
  int32 days = 6;

  // Answer the preview only, asking nothing of the store.
  bool validate_only = 7;

  // The confirm token of a preview of the same target, storage and days.
  // Required unless validate_only; must be empty with it.
  string confirm = 8;
}

// RecallResponse is what was recalled, or would be.
message RecallResponse {
  // The names of the archive-tier storages that hold any of the target,
  // ordered by name.
  repeated string storages = 1;

  // The target's objects on those storages.
  int64 objects = 2;

  // Their bytes.
  int64 bytes = 3;

  // The objects online already, which need no recall.
  int64 objects_online = 4;

  // The objects whose recall is requested or in progress already, which
  // this call joins rather than asks for again.
  int64 objects_recalling = 5;

  // The objects this call asked the store to recall; 0 with
  // validate_only.
  int64 objects_requested = 6;

  // The bytes of the objects asked for, or that would be.
  int64 bytes_requested = 7;

  // With validate_only, the token the recall must carry: opaque, at most
  // 128 bytes, a digest of the target, the storages, the days, the objects
  // and bytes to ask for, and the time it was issued; it matches for at
  // most one hour. Empty without validate_only.
  string confirm = 8;
}

// SwitchStorageRequest names the primary and the replica that takes its
// place.
message SwitchStorageRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The primary's name: the name that, after the switch, names the
  // replica's place. Required.
  string primary = 2;

  // The replica's name: the name that, after the switch, names the old
  // place, as a replica of the primary. Required.
  string replica = 3;

  // Answer whether the switch could start now, and what stands in its way,
  // changing nothing.
  bool validate_only = 4;

  // How long the drain may take before the switch is refused and every
  // write resumes on the old place: 1 second to 1 hour; absent for 10
  // minutes.
  google.protobuf.Duration drain_timeout = 5;

  // The confirm token of a preview (validate_only) of the same primary and
  // replica. Required unless validate_only; must be empty with it.
  string confirm = 6;

  // Switch although the replica has had no clean scrub since its backfill
  // ended, or no rebuild compare from it alone that found no difference.
  // Needs skip_reason.
  bool skip_verification = 7;

  // Why the checks are passed over, in the person's own words: 1 to 1024
  // bytes of UTF-8 with no control characters, never a value read from a
  // file. Required with skip_verification; must be empty without it.
  string skip_reason = 8;
}

// SwitchStorageResponse is the switch made, or whether it could be.
message SwitchStorageResponse {
  // Whether the switch could start now. With validate_only, false when
  // blockers is not empty; without it, true.
  bool ready = 1;

  // What stands in the way, in words for a person, from a fixed set of
  // phrases the server has, such as "replica not in step: 12 scans",
  // "records owed to the replica", "no clean scrub of the replica since
  // its backfill", "no empty compare from the replica" or "correction
  // prepared"; each at most 256 bytes. Empty when ready.
  repeated string blockers = 2;

  // The scans not in step on the replica now (with validate_only), or
  // that the drain copied (without it).
  int64 scans_pending = 3;

  // The names of the receivers whose data, or a route of whose, goes to the
  // primary: those that pause during the switch. Ordered by name.
  repeated string receivers = 4;

  // The primary as it is after the switch, its place the replica's former
  // place; without its secret. Absent with validate_only.
  Storage primary = 5;

  // The replica as it is after the switch, its place the primary's former
  // place; without its secret. Absent with validate_only.
  Storage replica = 6;

  // How long the receivers refused new data. Absent with validate_only.
  google.protobuf.Duration pause = 7;

  // The associations and requests refused during the pause, each of which
  // its sender tries again. 0 with validate_only.
  int64 associations_refused = 8;

  // When the swap committed, by the server's clock. Absent with
  // validate_only.
  google.protobuf.Timestamp switch_time = 9;

  // With validate_only, the token the switch must carry: opaque, at most
  // 128 bytes, a digest of both storages' places, the primary's
  // switch_generation and the time it was issued; it matches for at most
  // one hour, and once. Empty without validate_only.
  string confirm = 10;

  // The primary's switch_generation after the switch (Storage); with
  // validate_only, the one the token holds.
  int64 switch_generation = 11;
}

// VerifySampleRequest names the storage to sample and how many objects.
message VerifySampleRequest {
  // The tenant, by name. Required.
  string tenant = 1;

  // The storage's name. Required.
  string storage = 2;

  // How many instances to sample: 1 to 10000. Fewer are answered when the
  // storage holds fewer.
  int32 count = 3;

  // A seed for the draw: the same seed, count and population answer the
  // same sample. Absent for a new draw each call.
  optional int64 seed = 4;
}

// SampledObject is one archived instance of a sample, as the catalog holds
// it.
message SampledObject {
  // Its key on the storage, as DataService answers it: at most 1024 bytes,
  // opaque but for reading the object straight from the storage under the
  // storage's prefix or directory. Never written to a log or an event: it
  // holds a SOP Instance UID as received.
  string key = 1;

  // Its size in bytes, as archived.
  int64 size_bytes = 2;

  // Its SHA-256, in lowercase hexadecimal, as archived.
  string sha256 = 3;

  // The instance's id, as DataService names it.
  string instance_id = 4;

  // The revision the object holds (ArchivedFile.revision).
  int32 revision = 5;

  // The label of its subject.
  string subject_label = 6;

  // The label of its session.
  string session_label = 7;

  // The label of its scan.
  string scan_label = 8;
}

// VerifySampleResponse is the sample drawn.
message VerifySampleResponse {
  // The sampled instances, ordered by key.
  repeated SampledObject objects = 1;

  // How many instances the sample was drawn from: every instance of the
  // storage, or, for a replica, of its scans in step.
  int64 population = 2;
}
